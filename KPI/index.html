<title>115 年度 KPI 字典 — 中華電信彰化營運處</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --cht-blue:#0066B3; --cht-teal:#00ACB6; --cht-deep:#003D6E;
  --bg:#f5f7fa; --card:#ffffff; --text:#1a1f2e; --muted:#5a6478;
  --border:#e2e6ec; --border2:#d0d6df;
  --ok:#16a34a; --warn:#f59e0b; --bad:#dc2626;
  --cat-O:#0066B3; --cat-L:#16a34a; --cat-M:#dc2626; --cat-E:#7c3aed; --cat-C:#5a6478;
  --safe-top:env(safe-area-inset-top); --safe-bot:env(safe-area-inset-bottom);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;background:var(--bg)}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang TC','Microsoft JhengHei',sans-serif;
  color:var(--text);font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%;
  padding-top:var(--safe-top);padding-bottom:calc(64px + var(--safe-bot));
}
.hdr{
  background:linear-gradient(135deg,var(--cht-deep),var(--cht-blue));color:#fff;
  padding:14px 16px 12px;position:sticky;top:var(--safe-top);z-index:100;
  box-shadow:0 2px 8px rgba(0,0,0,.1);
}
.hdr h1{margin:0;font-size:17px;font-weight:600;letter-spacing:.5px}
.hdr .sub{font-size:11px;opacity:.85;margin-top:2px}
.hdr .badge{display:inline-block;background:rgba(255,255,255,.18);padding:1px 6px;border-radius:4px;font-size:10px;margin-left:6px}

/* Tab Bar — 底部固定 */
.tabbar{
  position:fixed;bottom:0;left:0;right:0;background:#fff;
  display:flex;border-top:1px solid var(--border);
  padding-bottom:var(--safe-bot);z-index:200;
  box-shadow:0 -2px 8px rgba(0,0,0,.05);
}
.tab{
  flex:1;text-align:center;padding:8px 4px 6px;cursor:pointer;
  font-size:10px;color:var(--muted);border:none;background:none;
  display:flex;flex-direction:column;align-items:center;gap:2px;
}
.tab .icn{font-size:22px;line-height:1}
.tab.active{color:var(--cht-blue);font-weight:600}
.tab.active .icn{transform:scale(1.05)}

main{padding:12px 12px 16px}

/* ─── 總覽分頁 ─────────────────────────────── */
.summary-bar{
  display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:12px;
}
.sum-card{
  background:var(--card);border-radius:8px;padding:8px 6px;text-align:center;
  border:1px solid var(--border);
}
.sum-card .v{font-size:18px;font-weight:700;color:var(--cht-blue)}
.sum-card .l{font-size:10px;color:var(--muted);margin-top:2px}

.cat-section{margin-bottom:14px}
.cat-title{
  display:flex;align-items:center;gap:8px;margin:8px 2px 8px;
  font-size:13px;font-weight:600;
}
.cat-dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.cat-weight{margin-left:auto;font-size:11px;color:var(--muted);font-weight:500}

.kpi-card{
  background:var(--card);border-radius:10px;padding:11px 12px;margin-bottom:8px;
  border:1px solid var(--border);cursor:pointer;
  transition:transform .15s,box-shadow .15s;
}
.kpi-card:active{transform:scale(.98);box-shadow:0 4px 12px rgba(0,0,0,.08)}
.kpi-head{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.kpi-id{
  background:var(--cht-blue);color:#fff;font-size:11px;font-weight:700;
  padding:2px 7px;border-radius:4px;letter-spacing:.5px;flex-shrink:0;
}
.kpi-name{font-size:14px;font-weight:600;flex:1;line-height:1.3}
.kpi-meta{
  display:flex;flex-wrap:wrap;gap:4px 10px;font-size:11px;color:var(--muted);
}
.kpi-meta span{display:inline-flex;align-items:center;gap:2px}
.kpi-meta b{color:var(--text);font-weight:600}

/* ─── 字典分頁 ─────────────────────────────── */
.search-bar{
  position:sticky;top:calc(var(--safe-top) + 56px);z-index:50;
  background:var(--bg);padding:8px 0 8px;margin:-4px -12px 8px;padding-left:12px;padding-right:12px;
}
.search-bar input{
  width:100%;padding:9px 12px;border:1px solid var(--border2);border-radius:8px;
  font-size:14px;background:#fff;-webkit-appearance:none;
}
.search-bar input:focus{outline:none;border-color:var(--cht-blue);box-shadow:0 0 0 2px rgba(0,102,179,.1)}
.filter-chips{display:flex;gap:5px;margin-top:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.filter-chips::-webkit-scrollbar{display:none}
.chip{
  padding:4px 10px;border-radius:14px;background:#fff;border:1px solid var(--border2);
  font-size:11px;white-space:nowrap;cursor:pointer;flex-shrink:0;
}
.chip.active{background:var(--cht-blue);color:#fff;border-color:var(--cht-blue)}

.detail-card{
  background:var(--card);border-radius:10px;margin-bottom:8px;
  border:1px solid var(--border);overflow:hidden;
}
.detail-head{padding:11px 12px;cursor:pointer;display:flex;align-items:center;gap:8px}
.detail-head .arrow{
  margin-left:auto;font-size:12px;color:var(--muted);
  transition:transform .2s;
}
.detail-card.open .detail-head .arrow{transform:rotate(90deg)}
.detail-body{display:none;padding:0 12px 12px;border-top:1px solid var(--border)}
.detail-card.open .detail-body{display:block}

.sec{margin-top:10px}
.sec-title{
  font-size:11px;font-weight:700;color:var(--cht-blue);letter-spacing:.5px;
  text-transform:uppercase;margin-bottom:4px;display:flex;align-items:center;gap:4px;
}
.sec-body{
  font-size:13px;line-height:1.6;color:var(--text);white-space:pre-wrap;
  background:#f8fafc;padding:8px 10px;border-radius:6px;border-left:3px solid var(--cht-teal);
}
.sec-body.mono{font-family:'SF Mono','Consolas','Monaco',monospace;font-size:12.5px}

.target-grid{
  display:grid;grid-template-columns:1fr auto;gap:4px 12px;margin-top:6px;
  background:#f0f9fc;padding:8px 10px;border-radius:6px;border:1px solid #d0e8ee;
}
.target-grid .k{font-size:12px;color:var(--muted)}
.target-grid .v{font-size:13px;font-weight:600;color:var(--cht-blue);text-align:right;font-variant-numeric:tabular-nums}

/* ─── 彰化目標分頁 ─────────────────────────── */
.my-card{
  background:linear-gradient(135deg,#fff,#f0f9fc);
  border-radius:10px;padding:12px;margin-bottom:8px;
  border:1px solid #c0dde6;border-left:4px solid var(--cht-teal);
}
.my-card .h{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.my-card .h .nm{font-size:14px;font-weight:600;flex:1}
.my-table{width:100%;border-collapse:collapse;font-size:13px}
.my-table td{padding:5px 0;border-bottom:1px dashed #d0e8ee}
.my-table td:last-child{text-align:right;font-weight:600;font-variant-numeric:tabular-nums;color:var(--cht-deep)}
.my-table tr:last-child td{border-bottom:none}

.comp-banner{
  background:linear-gradient(135deg,#fff7e6,#fef3c7);
  border-radius:8px;padding:10px 12px;margin-bottom:10px;
  border:1px solid #fde68a;font-size:12.5px;color:#92400e;
}

/* ─── 試算器 ─────────────────────────────── */
.calc-wrap{background:var(--card);border-radius:10px;padding:14px;border:1px solid var(--border)}
.calc-row{margin-bottom:14px}
.calc-row label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px;font-weight:600}
.calc-row select,.calc-row input{
  width:100%;padding:9px 11px;border:1px solid var(--border2);border-radius:6px;
  font-size:14px;background:#fff;-webkit-appearance:none;
}
.calc-row select:focus,.calc-row input:focus{outline:none;border-color:var(--cht-blue)}
.calc-input-grp{display:grid;grid-template-columns:1fr 1fr;gap:8px}

.calc-result{
  margin-top:14px;padding:14px;border-radius:10px;
  background:linear-gradient(135deg,#f0f9fc,#e0f2f7);
  border:1px solid #b8dce5;
}
.calc-result .lbl{font-size:11px;color:var(--muted);font-weight:600;margin-bottom:4px}
.calc-result .score{
  font-size:38px;font-weight:700;color:var(--cht-deep);
  font-variant-numeric:tabular-nums;line-height:1;
}
.calc-result .unit{font-size:14px;color:var(--muted);margin-left:4px}
.calc-result .grade{
  display:inline-block;margin-top:6px;padding:3px 10px;border-radius:12px;
  font-size:12px;font-weight:600;
}
.grade-ok{background:#dcfce7;color:#166534}
.grade-warn{background:#fef3c7;color:#92400e}
.grade-bad{background:#fee2e2;color:#991b1b}
.calc-formula{font-size:11px;color:var(--muted);margin-top:8px;line-height:1.6;font-family:monospace}

/* ─── 筆記 ─────────────────────────────── */
.note-bar{display:flex;gap:6px;margin-bottom:10px}
.note-bar input{
  flex:1;padding:9px 11px;border:1px solid var(--border2);border-radius:6px;
  font-size:13px;background:#fff;
}
.note-bar button{
  padding:9px 14px;border:none;background:var(--cht-blue);color:#fff;
  font-size:13px;font-weight:600;border-radius:6px;cursor:pointer;
}
.note-item{
  background:var(--card);border-radius:8px;padding:10px 12px;margin-bottom:6px;
  border:1px solid var(--border);position:relative;
}
.note-item .kpi-tag{font-size:10px;color:var(--cht-blue);font-weight:600;margin-bottom:3px}
.note-item .txt{font-size:13px;line-height:1.5;white-space:pre-wrap}
.note-item .meta{font-size:10px;color:var(--muted);margin-top:4px;display:flex;align-items:center;gap:8px}
.note-del{
  position:absolute;top:6px;right:8px;background:none;border:none;color:var(--muted);
  font-size:18px;cursor:pointer;padding:2px 6px;line-height:1;
}
.note-del:active{color:var(--bad)}

/* ─── 通用 ─────────────────────────────── */
.empty{
  text-align:center;padding:40px 16px;color:var(--muted);font-size:13px;
}
.empty .icn{font-size:42px;opacity:.4;margin-bottom:8px;display:block}

.page{display:none}
.page.active{display:block;animation:fadeIn .2s ease-out}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}

/* ─── v1.1 實績儀表板 ─── */
.hero-rank{
  background:linear-gradient(135deg,var(--cht-deep),var(--cht-blue));
  color:#fff;border-radius:12px;padding:14px 16px;margin-bottom:12px;
  display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;
}
.hero-rank .big{font-size:42px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.hero-rank .lbl{font-size:11px;opacity:.85;margin-top:3px}
.hero-rank .info{display:flex;flex-direction:column;gap:4px}
.hero-rank .info .row{display:flex;gap:8px;font-size:12px;align-items:baseline}
.hero-rank .info .row b{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums}
.hero-rank .info .row .sub{opacity:.7;font-size:10px}

.alert-bar{
  background:#fef2f2;border:1px solid #fecaca;border-left:4px solid var(--bad);
  border-radius:8px;padding:9px 11px;margin-bottom:10px;
  font-size:12px;color:#991b1b;line-height:1.5;
}
.alert-bar .ttl{font-weight:700;margin-bottom:3px;font-size:12.5px}

.kpi-actual{
  background:var(--card);border-radius:10px;padding:11px 12px;margin-bottom:7px;
  border:1px solid var(--border);cursor:pointer;
  display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;
}
.kpi-actual:active{transform:scale(.98)}
.kpi-actual .id-tag{
  background:var(--cht-blue);color:#fff;font-size:10.5px;font-weight:700;
  padding:2px 6px;border-radius:4px;letter-spacing:.5px;flex-shrink:0;
}
.kpi-actual .body{min-width:0}
.kpi-actual .nm{font-size:13.5px;font-weight:600;line-height:1.3;margin-bottom:3px}
.kpi-actual .meta{font-size:11px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap}
.kpi-actual .score-block{text-align:right;flex-shrink:0}
.kpi-actual .sv{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.kpi-actual .sb{font-size:10px;color:var(--muted);margin-top:2px}
.kpi-actual.ok .sv{color:var(--ok)}
.kpi-actual.warn .sv{color:var(--warn)}
.kpi-actual.bad .sv{color:var(--bad)}
.kpi-actual.year .sv{color:var(--muted);font-size:14px}
.kpi-actual.ok{border-left:3px solid var(--ok)}
.kpi-actual.warn{border-left:3px solid var(--warn)}
.kpi-actual.bad{border-left:3px solid var(--bad)}

.prog-bar{
  height:5px;background:var(--border);border-radius:3px;overflow:hidden;margin-top:5px;
}
.prog-bar .fill{height:100%;transition:width .4s}
.prog-bar .fill.ok{background:var(--ok)}
.prog-bar .fill.warn{background:var(--warn)}
.prog-bar .fill.bad{background:var(--bad)}

/* ─── v1.1 全處比較 ─── */
.cmp-controls{
  background:var(--card);border-radius:10px;padding:10px 12px;margin-bottom:10px;
  border:1px solid var(--border);
}
.cmp-controls label{display:block;font-size:11px;color:var(--muted);margin-bottom:4px;font-weight:600}
.cmp-controls select{
  width:100%;padding:8px 10px;border:1px solid var(--border2);border-radius:6px;
  font-size:13px;background:#fff;-webkit-appearance:none;margin-bottom:8px;
}
.cmp-controls select:last-child{margin-bottom:0}

.cmp-mode-tabs{display:flex;gap:4px;margin-bottom:8px}
.cmp-mode-tab{
  flex:1;padding:6px 4px;border:1px solid var(--border2);background:#fff;
  font-size:11px;border-radius:6px;cursor:pointer;
}
.cmp-mode-tab.active{background:var(--cht-blue);color:#fff;border-color:var(--cht-blue)}

.chart-card{
  background:var(--card);border-radius:10px;padding:12px;margin-bottom:10px;
  border:1px solid var(--border);
}
.chart-card .title{font-size:13px;font-weight:700;margin-bottom:8px;color:var(--cht-deep)}
.chart-card .sub{font-size:11px;color:var(--muted);margin-bottom:8px}
.chart-wrap{position:relative;width:100%}
.chart-wrap.tall{height:430px}
.chart-wrap.short{height:280px}
.chart-wrap.radar{height:340px}

.rank-table{width:100%;border-collapse:collapse;font-size:12px;margin-top:4px}
.rank-table th,.rank-table td{padding:6px 4px;border-bottom:1px solid var(--border);text-align:center}
.rank-table th{background:#f8fafc;font-size:10.5px;color:var(--muted);font-weight:600}
.rank-table td.office{text-align:left;font-weight:600;padding-left:8px}
.rank-table td.score{font-variant-numeric:tabular-nums;font-weight:600}
.rank-table tr.me{background:#fef9c3}
.rank-table tr.me td{font-weight:700;color:#854d0e}
.rank-table .pos-1,.rank-table .pos-2,.rank-table .pos-3{color:var(--ok);font-weight:700}
.rank-table .pos-last{color:var(--bad);font-weight:700}

@media (min-width:600px){
  main{max-width:720px;margin:0 auto}
}
</style>
</head>
<body>

<header class="hdr">
  <h1>📊 KPI 字典與指標管理 <span class="badge">v1.1</span></h1>
  <div class="sub">115 年度·彰化營運處 · 字典 2026/04/03 · 實績 4 月累計</div>
</header>

<main>

  <!-- ─── Tab 1: 實績儀表板 (v1.1) ─── -->
  <section class="page active" id="page-dashboard">
    <div class="hero-rank">
      <div>
        <div class="big" id="heroScore">—</div>
        <div class="lbl">115/4 累計得分</div>
      </div>

const MY_OFFICE = DATA.my_office || '彰化';
const ACTUAL = DATA.actual;

function getMyRecord(){
  return ACTUAL.records.find(r=>r.office===MY_OFFICE);
}

function gradeOf(score){
  if(score==null) return {cls:'year',txt:'年指標'};
  if(score>=95) return {cls:'ok',txt:'達標'};
  if(score>=85) return {cls:'warn',txt:'待加強'};
  return {cls:'bad',txt:'未達標'};
}

    const s = me.scores[k.id];
    return s!=null && s>=85 && s<95;
  });
  const alertBox = document.getElementById('alertBox');
  if(badItems.length>0){
    alertBox.innerHTML = `<div class="alert-bar">
      <div class="ttl">🔴 ${badItems.length} 項指標未達標(< 85 分)</div>
      ${badItems.map(k=>`<div>• <b>${k.id}</b> ${k.name}:${me.scores[k.id].toFixed(2)} 分 (權重 ${k.weight}%)</div>`).join('')}
    </div>`;
  } else if(warnItems.length>0){
    alertBox.innerHTML = `<div class="alert-bar" style="background:#fffbeb;border-color:#fde68a;border-left-color:var(--warn);color:#92400e">
      <div class="ttl">🟡 ${warnItems.length} 項指標待加強(85-95 分)</div>
      ${warnItems.slice(0,3).map(k=>`<div>• <b>${k.id}</b> ${k.name}:${me.scores[k.id].toFixed(2)} 分</div>`).join('')}
      ${warnItems.length>3?`<div style="opacity:.7">…還有 ${warnItems.length-3} 項</div>`:''}
    </div>`;
  } else {
    alertBox.innerHTML = '';
  }

  // KPI 清單(按權重由大到小排序)
  const sorted = [...KPI].sort((a,b)=>b.weight-a.weight);
  let html = '';
  sorted.forEach(k=>{
    const s = me.scores[k.id];
    const g = gradeOf(s);
    const color = CAT_COLORS[k.cat];
    const scoreText = s==null ? '—' : s.toFixed(2);
    const sbText = s==null ? '年度結算' : (s>=95?'達 95 分':'差 '+(95-s).toFixed(2)+' 分');
    const progPct = s==null ? 0 : Math.min(100, s);
    html += `<div class="kpi-actual ${g.cls}" data-id="${k.id}">
      <span class="id-tag" style="background:${color}">${k.id}</span>
      <div class="body">
        <div class="nm">${k.name}</div>
        <div class="meta">
          <span>權重 ${k.weight}%</span>
          <span>目標 ${k.target_total}</span>
          <span>${k.owner}</span>
        </div>
        <div class="prog-bar"><div class="fill ${g.cls==='year'?'':g.cls}" style="width:${progPct}%"></div></div>
      </div>
      <div class="score-block">
        <div class="sv">${scoreText}</div>
        <div class="sb">${sbText}</div>
      </div>
    </div>`;
  });
  document.getElementById('actualList').innerHTML = html;
  document.querySelectorAll('.kpi-actual').forEach(c=>{
    c.addEventListener('click',()=>{
      switchToTab('dict');
      setTimeout(()=>{
        const t = document.querySelector(`.detail-card[data-id="${c.dataset.id}"]`);
        if(t){ t.classList.add('open'); t.scrollIntoView({block:'center',behavior:'smooth'}); }
      },150);
    });
  });
}

function switchToTab(name){
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));
  document.querySelector(`.tab[data-page="${name}"]`).classList.add('active');
  document.getElementById('page-'+name).classList.add('active');
}

let currentFilter = 'all';
let currentSearch = '';

function renderDict(){
  const container = document.getElementById('dict-list');
  const search = currentSearch.toLowerCase();
  let items = [...KPI.map(k=>({...k,_type:'kpi'})), ...COMP.map(c=>({...c,_type:'comp',cat:'機構綜合表現'}))];

  if(currentFilter!=='all'){
    items = items.filter(k=>k.cat===currentFilter);
  }
  if(search){
    items = items.filter(k=>{
      const txt = [k.id,k.name,k.formula||'',k.definition||'',k.scoring||''].join(' ').toLowerCase();
      return txt.includes(search);
    });
  }

  if(items.length===0){
    container.innerHTML = '<div class="empty"><span class="icn">🔍</span>找不到符合條件的指標</div>';
    return;
  }

  let html = '';
  items.forEach(k=>{
    const color = CAT_COLORS[k.cat] || 'var(--cat-C)';
    const owner = k.owner;
    const weight = k._type==='kpi' ? `${k.weight}%` : k.weight_note||'15%';
    html += `<div class="detail-card" data-id="${k.id}">
      <div class="detail-head">
        <span class="kpi-id" style="background:${color}">${k.id}</span>
        <div style="flex:1">
          <div style="font-size:14px;font-weight:600">${k.name}</div>
          <div style="font-size:11px;color:var(--muted);margin-top:2px">${k.cat} · ${owner} · ${weight}</div>
        </div>
        <span class="arrow">▶</span>
      </div>
      <div class="detail-body">`;
    
    if(k.formula){
      html += `<div class="sec"><div class="sec-title">📐 公式</div><div class="sec-body mono">${escapeHtml(k.formula)}</div></div>`;
    }
    if(k.definition){
      html += `<div class="sec"><div class="sec-title">📋 定義</div><div class="sec-body">${escapeHtml(k.definition)}</div></div>`;
    }
    if(k.scoring){
      html += `<div class="sec"><div class="sec-title">⭐ 評分標準</div><div class="sec-body">${escapeHtml(k.scoring)}</div></div>`;
    }
    if(k.ch_target){
      html += `<div class="sec"><div class="sec-title">🎯 彰化目標</div><div class="target-grid">`;
      Object.entries(k.ch_target).forEach(([key,val])=>{
        html += `<div class="k">${key}</div><div class="v">${formatNum(val)}</div>`;
      });
      html += `</div></div>`;
    }
    if(k.source){
      html += `<div class="sec"><div class="sec-title">📂 資料來源</div><div class="sec-body" style="font-size:12px">${escapeHtml(k.source)}</div></div>`;
    }
    if(k.deadline){
      html += `<div class="sec"><div class="sec-title">⏰ 資料提供期限</div><div class="sec-body" style="font-size:12px">${escapeHtml(k.deadline)}</div></div>`;
    }

    html += `</div></div>`;
  });
  container.innerHTML = html;

  container.querySelectorAll('.detail-head').forEach(h=>{
    h.addEventListener('click',()=>{
      h.closest('.detail-card').classList.toggle('open');
    });

document.getElementById('searchInput').addEventListener('input',e=>{
  currentSearch = e.target.value.trim();

});

function escapeHtml(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function formatNum(v){
  if(typeof v === 'number'){
    if(Number.isInteger(v)) return v.toLocaleString('zh-TW');
    return v.toLocaleString('zh-TW',{maximumFractionDigits:3});
  }
  return String(v);
}

let cmpChartInst = null;
let cmpCurrentKpi = 'annual';   // 'annual' = 年度合併, 否則為 KPI id

const GROUP_COLORS = {
  'A 組': '#0066B3',
  'B 組': '#00ACB6',

};

function officeGroup(office){
  for(const [g,arr] of Object.entries(DATA.groups)){
    if(arr.includes(office)) return g;
  }

}

function renderCompareChart(){
  if(cmpChartInst){ cmpChartInst.destroy(); cmpChartInst = null; }
  const wrap = document.getElementById('cmpChartWrap');
  wrap.className = 'chart-wrap ' + (cmpCurrentMode==='radar'?'radar':(cmpCurrentMode==='group'?'short':'tall'));

  const isAnnual = cmpCurrentKpi === 'annual';

function getScoreValue(record, kpiId){
  if(kpiId === 'annual') return record.annual;
  return record.scores[kpiId];
}

function renderRankBar(isAnnual, kpi, lbl, titleEl, subEl){
  titleEl.textContent = `🏆 ${lbl} — 17 處排名`;
  subEl.textContent = `黃色高亮為彰化 · 紅色為 < 85 · 綠色為 ≥ 95`;

  // 排序:由高到低
  const recs = [...ACTUAL.records].filter(r=>{
    const v = getScoreValue(r, cmpCurrentKpi);
    return v != null;
  }).map(r=>({...r, _v: getScoreValue(r, cmpCurrentKpi)}));
  recs.sort((a,b)=>b._v - a._v);

  if(recs.length===0){
    titleEl.textContent = '⚠️ 此指標為年度結算項目';
    subEl.textContent = `${lbl} 為年指標,4 月累計尚未結算。請改選其他 KPI 或「年度合併得分」。`;
    document.getElementById('cmpTable').innerHTML='';
    return;
  }

  const labels = recs.map(r=>r.office);
  const values = recs.map(r=>+r._v.toFixed(2));
  const colors = recs.map(r=>{
    if(r.office === MY_OFFICE) return '#facc15';  // 黃色高亮彰化
    if(r._v >= 95) return '#16a34a';
    if(r._v < 85) return '#dc2626';
    return '#94a3b8';
  });

  cmpChartInst = new Chart(document.getElementById('cmpChart').getContext('2d'),{
    type: 'bar',
    data: {
      labels,
      datasets: [{ label: lbl, data: values, backgroundColor: colors, borderWidth: 0 }]
    },
    options: {
      indexAxis: 'y',
      responsive: true, maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: { callbacks: { label: c=>` ${c.parsed.x} 分` } },
        datalabels: false,
      },
      scales: {
        x: { beginAtZero: false, suggestedMin: isAnnual?70:60, suggestedMax: isAnnual?80:105,
             ticks: { font: { size: 10 } } },
        y: { ticks: { font: { size: 11 }, callback: function(v){
          const o = this.getLabelForValue(v);
          return o === MY_OFFICE ? '★ '+o : o;
        }}}
      }
    }
  });

  // 排名表
  let html = '<div class="chart-card"><div class="title">📋 排名速查表</div><table class="rank-table">'+
    '<thead><tr><th>名次</th><th style="text-align:left">營運處</th><th>組別</th><th>得分</th><th>差距</th></tr></thead><tbody>';
  recs.forEach((r,i)=>{
    const rank = i+1;
    const isMe = r.office === MY_OFFICE;
    const top = rank===1?'pos-1':(rank<=3?'pos-2':'');
    const last = rank===recs.length?'pos-last':'';
    const diff = r._v - recs[0]._v;
    html += `<tr class="${isMe?'me':''}">
      <td class="${top} ${last}">${rank}</td>
      <td class="office">${r.office}${isMe?' ★':''}</td>
      <td style="font-size:10px;color:var(--muted)">${officeGroup(r.office)}</td>
      <td class="score">${r._v.toFixed(2)}</td>
      <td style="font-size:10px;color:var(--muted)">${i===0?'—':diff.toFixed(2)}</td>
    </tr>`;
  });
  html += '</tbody></table></div>';
  document.getElementById('cmpTable').innerHTML = html;
}

function renderGroupBar(isAnnual, kpi, lbl, titleEl, subEl){
  titleEl.textContent = `🎯 ${lbl} — A/B/C 組平均`;
  subEl.textContent = `比較三組平均水準與彰化所在組別`;

  const groupAvg = {};
  Object.entries(DATA.groups).forEach(([g, offices])=>{
    const vals = offices.map(o=>{
      const r = ACTUAL.records.find(x=>x.office===o);
      return r ? getScoreValue(r, cmpCurrentKpi) : null;
    }).filter(v=>v!=null);
    groupAvg[g] = vals.length>0 ? vals.reduce((s,v)=>s+v,0)/vals.length : null;
  });

  const labels = Object.keys(groupAvg);
  const values = labels.map(g=>groupAvg[g]==null?null:+groupAvg[g].toFixed(2));
  const colors = labels.map(g=>GROUP_COLORS[g]);

  cmpChartInst = new Chart(document.getElementById('cmpChart').getContext('2d'),{
    type: 'bar',
    data: { labels, datasets: [{ label: lbl, data: values, backgroundColor: colors, borderWidth: 0 }] },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: { callbacks: { label: c=>` 平均 ${c.parsed.y} 分` } }
      },
      scales: {
        y: { beginAtZero: false, suggestedMin: isAnnual?70:60, suggestedMax: isAnnual?82:105 }
      }
    }
  });

  // 列出彰化所在 B 組明細
  const myGroup = officeGroup(MY_OFFICE);
  const groupOffices = DATA.groups[myGroup] || [];
  const groupRecs = groupOffices.map(o=>{
    const r = ACTUAL.records.find(x=>x.office===o);
    return { office: o, v: r ? getScoreValue(r, cmpCurrentKpi) : null };
  });
  groupRecs.sort((a,b)=>(b.v||0)-(a.v||0));
  let html = `<div class="chart-card"><div class="title">🔍 ${myGroup} 內部比較(彰化所在組)</div><table class="rank-table">`+
    '<thead><tr><th>組內名次</th><th style="text-align:left">營運處</th><th>得分</th><th>vs 組平均</th></tr></thead><tbody>';
  const groupMean = groupAvg[myGroup];
  groupRecs.forEach((r,i)=>{
    const isMe = r.office === MY_OFFICE;
    const diff = r.v==null||groupMean==null ? null : r.v - groupMean;
    html += `<tr class="${isMe?'me':''}">
      <td>${i+1}</td>
      <td class="office">${r.office}${isMe?' ★':''}</td>
      <td class="score">${r.v==null?'—':r.v.toFixed(2)}</td>
      <td style="font-size:10.5px" class="${diff==null?'':(diff>=0?'pos-1':'pos-last')}">
        ${diff==null?'—':(diff>=0?'+':'')+diff.toFixed(2)}
      </td>
    </tr>`;
  });
  html += '</tbody></table></div>';
  document.getElementById('cmpTable').innerHTML = html;
}

/* ──────────────── Tab 4: 試算器 ──────────────── */
function renderCalcOptions(){
  const sel = document.getElementById('calcKpi');
  let opts = '<option value="">— 請選擇 —</option>';
  KPI.forEach(k=>{
    opts += `<option value="${k.id}">${k.id} · ${k.name}</option>`;
  });
  sel.innerHTML = opts;
  sel.addEventListener('change',calcUpdate);
  document.getElementById('calcA').addEventListener('input',calcUpdate);
  document.getElementById('calcB').addEventListener('input',calcUpdate);
}

function calcUpdate(){
  const id = document.getElementById('calcKpi').value;
  const a = parseFloat(document.getElementById('calcA').value);
  const b = parseFloat(document.getElementById('calcB').value);
  const scoreEl = document.getElementById('calcScore');
  const gradeEl = document.getElementById('calcGrade');
  const formulaEl = document.getElementById('calcFormula');
  const labelA = document.getElementById('calcLabelA');
  const labelB = document.getElementById('calcLabelB');

  if(!id){
    scoreEl.textContent = '—';
    gradeEl.innerHTML = '';
    formulaEl.textContent = '請選擇 KPI 並輸入數值';
    labelA.textContent = '實績值';
    labelB.textContent = '目標值';
    return;
  }

  const k = KPI.find(x=>x.id===id);
  // 處理「愈小愈好」(O2, L1 月租型離網數等) — 採用 2-比值
  const reverseIds = ['O2'];  // 成本費用 = 動支率(愈小愈好)
  
  // 動態調整標籤
  if(id==='O2'){
    labelA.textContent = '實際動支(億元)';
    labelB.textContent = '預算數(億元)';
  } else if(k.attr==='愈小愈好'){
    labelA.textContent = '實績值(愈小愈好)';
    labelB.textContent = '目標值';
  } else {
    labelA.textContent = '實績值';
    labelB.textContent = '目標值';
  }

  if(isNaN(a) || isNaN(b) || b===0){
    scoreEl.textContent = '—';
    gradeEl.innerHTML = '';
    formulaEl.textContent = '請輸入有效數值(目標值不能為 0)';
    return;
  }

  let rate, score, formula;
  
  if(reverseIds.includes(id)){
    // 成本控制:動支率 = 實績/預算 × 100%
    rate = (a/b) * 100;
    // 達 100% 得 98 分,每減 1% +0.5,每加 1% -0.5
    const diff = 100 - rate;
    score = 98 + diff * 0.5;
    score = Math.min(score, k.scoring_max || 100);
    formula = `動支率 = ${a} / ${b} × 100% = ${rate.toFixed(2)}%\n基準 98 分 + (100% - ${rate.toFixed(2)}%) × 0.5\n= 98 + ${diff.toFixed(2)} × 0.5 = ${score.toFixed(2)}`;
  } else if(k.attr==='愈小愈好'){
    // 愈小愈好(離網等):達成率 = 2 - 實績/目標
    rate = 2 - (a/b);
    const ratePct = rate * 100;
    const diff = ratePct - 100;
    const step = k.scoring_step || 0.5;
    score = (k.scoring_base || 95) + diff * step;
    if(k.scoring_max) score = Math.min(score, k.scoring_max);
    if(k.scoring_min!=null) score = Math.max(score, k.scoring_min);
    formula = `達成率 = 2 - (${a} / ${b}) = ${rate.toFixed(4)} (${ratePct.toFixed(2)}%)\n基準 ${k.scoring_base} + (${ratePct.toFixed(2)}% - 100%) × ${step}\n= ${k.scoring_base} + ${diff.toFixed(2)} × ${step} = ${score.toFixed(2)}`;
  } else {
    // 愈大愈好:達成率 = 實績/目標
    rate = a/b;
    const ratePct = rate * 100;
    const diff = ratePct - 100;
    const stepUp = k.scoring_step_up || k.scoring_step || 0.5;
    const stepDn = k.scoring_step_down || k.scoring_step || 0.5;
    const step = diff >= 0 ? stepUp : stepDn;
    score = (k.scoring_base || 95) + diff * step;
    if(k.scoring_max) score = Math.min(score, k.scoring_max);
    if(k.scoring_min!=null) score = Math.max(score, k.scoring_min);
    formula = `達成率 = ${a} / ${b} = ${rate.toFixed(4)} (${ratePct.toFixed(2)}%)\n基準 ${k.scoring_base} + (${ratePct.toFixed(2)}% - 100%) × ${step}${diff>=0?'(每加1%)':'(每減1%)'}\n= ${k.scoring_base} + ${diff.toFixed(2)} × ${step} = ${score.toFixed(2)}`;
  }

  scoreEl.textContent = score.toFixed(1);
  
  let gradeClass, gradeText;
  if(score >= 100){
    gradeClass = 'grade-ok'; gradeText = '🌟 達上限';
  } else if(score >= (k.scoring_base||95)){
    gradeClass = 'grade-ok'; gradeText = '✅ 達標';
  } else if(score >= 90){
    gradeClass = 'grade-warn'; gradeText = '⚠️ 接近目標';
  } else {
    gradeClass = 'grade-bad'; gradeText = '❌ 未達標';
  }
  gradeEl.innerHTML = `<span class="grade ${gradeClass}">${gradeText}</span>`;
  formulaEl.textContent = formula;
}

/* ──────────────── Tab 5: 筆記 ──────────────── */
const NOTES_KEY = 'kpi_notes_v1';

function loadNotes(){
  try{ return JSON.parse(localStorage.getItem(NOTES_KEY) || '[]'); }
  catch(e){ return []; }
}
function saveNotes(n){
  localStorage.setItem(NOTES_KEY, JSON.stringify(n));
}

function renderNoteSelect(){
  const sel = document.getElementById('noteKpi');
  let opts = '<option value="">通用</option>';
  KPI.forEach(k=>{ opts += `<option value="${k.id}">${k.id}</option>`; });
  sel.innerHTML = opts;
}

function renderNotes(){
  const list = loadNotes();
  const c = document.getElementById('notes-list');
  if(list.length===0){
    c.innerHTML = '<div class="empty"><span class="icn">📝</span>還沒有筆記。<br>選擇 KPI、輸入內容後點 ＋ 新增。<br><br><small>(筆記僅儲存在本機,不會上傳)</small></div>';
    return;
  }
  let html = '';
  list.forEach((n,i)=>{
    const k = KPI.find(x=>x.id===n.kpi);
    const tag = k ? `${k.id} · ${k.name}` : '通用筆記';
    const ts = new Date(n.t).toLocaleString('zh-TW',{hour12:false});
    html += `<div class="note-item">
      <button class="note-del" data-i="${i}">×</button>
      <div class="kpi-tag">${tag}</div>
      <div class="txt">${escapeHtml(n.txt)}</div>
      <div class="meta">🕐 ${ts}</div>
    </div>`;
  });
  c.innerHTML = html;
  c.querySelectorAll('.note-del').forEach(b=>{
    b.addEventListener('click',()=>{
      if(!confirm('刪除這則筆記?')) return;
      const arr = loadNotes();
      arr.splice(parseInt(b.dataset.i),1);
      saveNotes(arr);
      renderNotes();
    });
  });
}

document.getElementById('noteAddBtn').addEventListener('click',()=>{
  const input = document.getElementById('noteInput');
  const kpi = document.getElementById('noteKpi').value;
  const txt = input.value.trim();
  if(!txt) return;
  const arr = loadNotes();
  arr.unshift({kpi, txt, t:Date.now()});
  saveNotes(arr);
  input.value = '';
  renderNotes();
});

document.getElementById('noteInput').addEventListener('keydown',e=>{
  if(e.key==='Enter') document.getElementById('noteAddBtn').click();
});

renderDashboard();
renderFilterChips();
renderDict();
renderCompareControls();
renderCalcOptions();
renderNoteSelect();
renderNotes();
