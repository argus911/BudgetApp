<style>
:root{--green:#0c6944;--green2:#128048;--dark:#0f4e2a;--blue:#1565c0;--orange:#e07b00;--red:#c62828;--bg:#f4f6f5;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei",sans-serif;background:var(--bg);color:#1a1a1a;padding-bottom:76px;}
header{position:sticky;top:0;z-index:50;background:linear-gradient(135deg,var(--green) 0%,#0c9660 100%);color:#fff;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 8px rgba(0,0,0,.15);}
header .title{font-size:17px;font-weight:700;display:flex;align-items:center;gap:8px;}
header .sub{font-size:11px;opacity:.85;margin-top:2px;}
.badge{background:rgba(255,255,255,.25);border-radius:20px;padding:4px 12px;font-size:12px;font-weight:600;}
.tabbar{position:sticky;top:58px;z-index:40;background:#fff;display:flex;overflow-x:auto;border-bottom:1px solid #e0e0e0;box-shadow:0 2px 4px rgba(0,0,0,.04);}
.tabbar.bottom{position:fixed;bottom:0;left:0;right:0;top:auto;z-index:50;box-shadow:0 -2px 8px rgba(0,0,0,.08);padding-bottom:env(safe-area-inset-bottom);}
.tab-btn{flex:1;min-width:70px;text-align:center;padding:10px 4px;font-size:11px;font-weight:600;color:#888;background:none;border:none;border-bottom:3px solid transparent;white-space:nowrap;}
.tabbar.bottom .tab-btn{border-bottom:none;border-top:3px solid transparent;}
.tab-btn.active{color:var(--green);border-bottom-color:var(--green);}
.tabbar.bottom .tab-btn.active{border-top-color:var(--green);}
main{padding:14px;max-width:640px;margin:0 auto;}
.tab-content{display:none;}
.tab-content.active{display:block;}
.card{background:#fff;border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 1px 4px rgba(0,0,0,.06);}
.filter-card input[type=text]{width:100%;padding:10px 12px;border:1px solid #ddd;border-radius:10px;font-size:14px;margin-bottom:10px;background:#fafafa;}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;}
.chip{padding:6px 12px;border-radius:20px;font-size:12px;font-weight:600;background:#f0f0f0;color:#555;border:1px solid transparent;cursor:pointer;}
.chip.active{background:var(--green);color:#fff;}
.chip-label{font-size:11px;color:#999;font-weight:600;margin:6px 0 4px;}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;}
.pill{font-size:11px;padding:4px 10px;border-radius:12px;font-weight:600;}
.pill.g{background:#e6f4ea;color:var(--green2);}
.pill.b{background:#e3f0fc;color:var(--blue);}
.pill.o{background:#fdf0e0;color:var(--orange);}
.notice{background:#fff8e1;border:1px solid #ffe082;border-radius:12px;padding:10px 12px;font-size:12.5px;color:#8a6100;margin-bottom:12px;line-height:1.5;}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px;}
.stat-card{background:#fff;border-radius:14px;padding:12px;box-shadow:0 1px 4px rgba(0,0,0,.06);}
.stat-card .label{font-size:11px;color:#888;margin-bottom:4px;}
.stat-card .value{font-size:17px;font-weight:700;}
.result-count{font-size:12px;color:#888;margin-bottom:8px;}
.item-card{background:#fff;border-radius:16px;margin-bottom:10px;box-shadow:0 1px 4px rgba(0,0,0,.06);overflow:hidden;cursor:pointer;}
.item-head{padding:12px 14px 8px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.item-code{font-family:"IBM Plex Mono",monospace;font-weight:700;font-size:13px;background:#eef7f1;color:var(--green);padding:2px 8px;border-radius:6px;}
.item-name{font-size:14px;font-weight:600;flex:1;min-width:80px;}
.cat-badge{font-size:10px;padding:2px 8px;border-radius:10px;font-weight:600;}
.unit-badge{font-size:10px;padding:2px 8px;border-radius:10px;font-weight:600;}
.item-body{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid #f0f0f0;}
.item-body .cell{padding:8px 14px;border-bottom:1px solid #f5f5f5;}
.item-body .cell:nth-child(odd){border-right:1px solid #f5f5f5;}
.cell .l{font-size:10.5px;color:#999;margin-bottom:2px;}
.cell .v{font-size:14px;font-weight:700;font-family:"IBM Plex Mono",monospace;}
.progress-wrap{padding:8px 14px 12px;}
.progress-label{display:flex;justify-content:space-between;font-size:11px;color:#888;margin-bottom:4px;}
.progress-bar{height:6px;background:#eee;border-radius:4px;overflow:hidden;}
.progress-fill{height:100%;border-radius:4px;}
.pagination{display:flex;justify-content:center;gap:8px;margin:16px 0;}
.pagination button{padding:8px 16px;border-radius:10px;border:1px solid #ddd;background:#fff;font-size:13px;font-weight:600;color:#555;}
.pagination button.active{background:var(--green);color:#fff;border-color:var(--green);}
.pagination button:disabled{opacity:.4;}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,0);pointer-events:none;transition:background .2s;z-index:100;display:flex;align-items:flex-end;}
.overlay.open{background:rgba(0,0,0,.4);pointer-events:auto;}
.sheet{background:#fff;width:100%;max-width:640px;margin:0 auto;border-radius:20px 20px 0 0;padding:18px 18px calc(20px + env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .25s;max-height:80vh;overflow-y:auto;}
.overlay.open .sheet{transform:translateY(0);}
.sheet h3{font-size:16px;margin-bottom:4px;}
.sheet .sub{font-size:12px;color:#888;margin-bottom:14px;}
.sheet-section{margin-bottom:14px;}
.sheet-section h4{font-size:12px;color:#128048;margin-bottom:8px;font-weight:700;}
.sheet-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.sheet-grid .cell{background:#f7f9f8;border-radius:10px;padding:8px 10px;}
.bar-row{margin-bottom:10px;}
.bar-row .bl{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:4px;}
.bar-row .btrack{height:10px;background:#eee;border-radius:6px;overflow:hidden;}
.bar-row .bfill{height:100%;border-radius:6px;}
.warn-item{background:#fff;border-left:4px solid var(--orange);border-radius:10px;padding:10px 12px;margin-bottom:8px;box-shadow:0 1px 4px rgba(0,0,0,.06);}
.warn-item.high{border-left-color:var(--red);}
.warn-item .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;}
.warn-item .name{font-size:13.5px;font-weight:600;}
.warn-item .pct{font-weight:700;font-family:"IBM Plex Mono",monospace;}
.kpi-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:14px;}
.kpi-card{background:#fff;border-radius:14px;padding:10px;text-align:center;box-shadow:0 1px 4px rgba(0,0,0,.06);}
.kpi-card .kl{font-size:10.5px;color:#888;margin-bottom:4px;}
.kpi-card .kv{font-size:15px;font-weight:700;}
.chart-canvas-wrap{position:relative;width:100%;}
.chart-canvas-wrap canvas{width:100%!important;height:100%!important;display:block;}
.section-title{font-size:13px;font-weight:700;color:#333;margin:14px 0 8px;}
</style>
</head>

var CAT_COLORS = {
  '人事費':'#6a4c93','業務外包':'#1982c4','業務成本':'#128048',
  '專案建置成本':'#e07b00','設備及折舊':'#c62828','管銷費用':'#8d6e63','其他':'#607d8b'
};
var UNIT_PALETTE = ['#1565c0','#128048','#e07b00','#6a4c93','#c62828','#00838f','#8d6e63','#5d4037','#455a64','#7b1fa2','#0277bd','#2e7d32','#ef6c00'];
var unitColorMap = {};
(function(){
  var idx = 0;
  var us = {};
  RAW.forEach(function(r){ if(r['預算主管單位']) us[r['預算主管單位']]=true; });
  Object.keys(us).sort().forEach(function(u){ unitColorMap[u] = UNIT_PALETTE[idx % UNIT_PALETTE.length]; idx++; });
})();

function rateColor(p){ p = Number(p)||0; return p>=90?'#c62828':(p>=70?'#e07b00':'#128048'); }
function fmt(v){ if(typeof v !== 'number') return v; return v.toLocaleString('en-US'); }
function wan(v){ return (Number(v)/10000).toFixed(1)+'萬'; }

var state = { search:'', cat:'all', unit:'all', page:1, pageSize:20 };

var CATS = ['all'].concat(Object.keys(CAT_COLORS).filter(function(c){ return RAW.some(function(r){return r['費用分類']===c;}); }));
var UNITS = ['all'].concat(Object.keys(unitColorMap).sort());

document.getElementById('headerCount').textContent = RAW.length + ' 筆';

// ---- Chips ----
function renderChips(){
  var catWrap = document.getElementById('catChips');
  catWrap.innerHTML = '';
  CATS.forEach(function(c){
    var b = document.createElement('button');
    b.className = 'chip' + (state.cat===c?' active':'');
    b.textContent = c==='all' ? '全部' : c;
    b.dataset.val = c;
    b.addEventListener('click', function(){ state.cat=this.dataset.val; state.page=1; renderAll(); });
    catWrap.appendChild(b);
  });
  var unitWrap = document.getElementById('unitChips');
  unitWrap.innerHTML = '';
  UNITS.forEach(function(u){
    var b = document.createElement('button');
    b.className = 'chip' + (state.unit===u?' active':'');
    b.textContent = u==='all' ? '全部' : u;
    b.dataset.val = u;
    b.addEventListener('click', function(){ state.unit=this.dataset.val; state.page=1; renderAll(); });
    unitWrap.appendChild(b);
  });
}

function renderPills(){
  var wrap = document.getElementById('filterPills');
  var html = '';
  if(state.search) html += '<span class="pill b">搜尋: '+state.search+'</span>';
  if(state.cat!=='all') html += '<span class="pill g">分類: '+state.cat+'</span>';
  if(state.unit!=='all') html += '<span class="pill o">科室: '+state.unit+'</span>';
  wrap.innerHTML = html;
}

function getFiltered(){
  return RAW.filter(function(r){
    if(state.cat!=='all' && r['費用分類']!==state.cat) return false;
    if(state.unit!=='all' && r['預算主管單位']!==state.unit) return false;
    if(state.search){
      var s = state.search.toLowerCase();
      if(r['明細帳'].toLowerCase().indexOf(s)<0 && r['會計項目'].toLowerCase().indexOf(s)<0) return false;
    }
    return true;
  });
}

function renderStats(list){
  var sumBal=0,sumMBudget=0,sumYBudget=0,sumRemain=0;
  list.forEach(function(r){
    sumBal += Number(r['本月餘額'])||0;
    sumMBudget += Number(r['本月預算數'])||0;
    sumYBudget += Number(r['本年度預算'])||0;
    sumRemain += Number(r['剩餘可動支數'])||0;
  });
  var grid = document.getElementById('statGrid');
  grid.innerHTML =
    '<div class="stat-card"><div class="label">本月餘額累計</div><div class="value" style="color:#1565c0">'+fmt(sumBal)+'</div></div>'+
    '<div class="stat-card"><div class="label">本月預算數</div><div class="value">'+fmt(sumMBudget)+'</div></div>'+
    '<div class="stat-card"><div class="label">本年度預算</div><div class="value">'+fmt(sumYBudget)+'</div></div>'+
    '<div class="stat-card"><div class="label">剩餘可動支數</div><div class="value" style="color:'+(sumRemain<0?'#c62828':'#128048')+'">'+fmt(sumRemain)+'</div></div>';
}

function renderList(list){
  var start = (state.page-1)*state.pageSize;
  var pageItems = list.slice(start, start+state.pageSize);
  document.getElementById('resultCount').textContent = '共 ' + list.length + ' 筆';
  var wrap = document.getElementById('itemList');
  var html = '';
  pageItems.forEach(function(r){
    var yr = Number(r['年度動支率'])||0;
    var pc = rateColor(yr);
    var catColor = CAT_COLORS[r['費用分類']] || '#607d8b';
    var unitBadge = r['預算主管單位']
      ? '<span class="unit-badge" style="background:'+(unitColorMap[r['預算主管單位']]||'#888')+'1a;color:'+(unitColorMap[r['預算主管單位']]||'#888')+'">'+r['預算主管單位']+'</span>'
      : '';
    html += '<div class="item-card" data-acc="'+r['明細帳']+'">'+
      '<div class="item-head">'+
        '<span class="item-code">'+r['明細帳']+'</span>'+
        '<span class="item-name">'+r['會計項目']+'</span>'+
        '<span class="cat-badge" style="background:'+catColor+'1a;color:'+catColor+'">'+r['費用分類']+'</span>'+
        unitBadge+
      '</div>'+
      '<div class="item-body">'+
        '<div class="cell"><div class="l">本月餘額（累計）</div><div class="v" style="color:#1565c0">'+fmt(r['本月餘額'])+'</div></div>'+
        '<div class="cell"><div class="l">累計動支率</div><div class="v" style="color:'+rateColor(r['累計動支率'])+'">'+r['累計動支率']+'%</div></div>'+
        '<div class="cell"><div class="l">本年度預算</div><div class="v">'+fmt(r['本年度預算'])+'</div></div>'+
        '<div class="cell"><div class="l">剩餘可動支數</div><div class="v" style="color:'+(Number(r['剩餘可動支數'])<0?'#c62828':'#128048')+'">'+fmt(r['剩餘可動支數'])+'</div></div>'+
      '</div>'+
      '<div class="progress-wrap">'+
        '<div class="progress-label"><span>年度動支率</span><span style="color:'+pc+';font-weight:700">'+yr+'%</span></div>'+
        '<div class="progress-bar"><div class="progress-fill" style="width:'+Math.min(yr,100)+'%;background:'+pc+'"></div></div>'+
      '</div>'+
    '</div>';
  });
  wrap.innerHTML = html;
  wrap.querySelectorAll('[data-acc]').forEach(function(el){
    el.addEventListener('click', function(){ openSheet(this.dataset.acc); });
  });

  var totalPages = Math.max(1, Math.ceil(list.length/state.pageSize));
  var pagWrap = document.getElementById('pagination');
  pagWrap.innerHTML = '';
  if(totalPages>1){
    var prev = document.createElement('button');
    prev.textContent = '‹'; prev.disabled = state.page===1;
    prev.addEventListener('click', function(){ if(state.page>1){state.page--; renderAll();} });
    pagWrap.appendChild(prev);
    var info = document.createElement('button');
    info.textContent = state.page + ' / ' + totalPages;
    info.disabled = true;
    pagWrap.appendChild(info);
    var next = document.createElement('button');
    next.textContent = '›'; next.disabled = state.page===totalPages;
    next.addEventListener('click', function(){ if(state.page<totalPages){state.page++; renderAll();} });
    pagWrap.appendChild(next);
  }
}

function openSheet(acc){
  var r = RAW.find(function(x){ return x['明細帳']===acc; });
  if(!r) return;
  var sheet = document.getElementById('sheet');
  var yr = Number(r['年度動支率'])||0;
  var mr = Number(r['累計動支率'])||0;
  sheet.innerHTML =
    '<h3>'+r['明細帳']+' '+r['會計項目']+'</h3>'+
    '<div class="sub">'+r['費用分類']+(r['預算主管單位']?(' · '+r['預算主管單位']):'')+'</div>'+
    '<div class="sheet-section"><h4>本月數據</h4><div class="sheet-grid">'+
      '<div class="cell"><div class="l">本月動支數</div><div class="v" style="font-size:14px;font-weight:700">'+fmt(r['本月動支數'])+'</div></div>'+
      '<div class="cell"><div class="l">本月預算數</div><div class="v" style="font-size:14px;font-weight:700">'+fmt(r['本月預算數'])+'</div></div>'+
      '<div class="cell"><div class="l">本月餘額（累計）</div><div class="v" style="font-size:14px;font-weight:700;color:#1565c0">'+fmt(r['本月餘額'])+'</div></div>'+
      '<div class="cell"><div class="l">至本月預算數累計</div><div class="v" style="font-size:14px;font-weight:700">'+fmt(r['至本月預算數累計'])+'</div></div>'+
    '</div></div>'+
    '<div class="sheet-section"><h4>年度數據</h4><div class="sheet-grid">'+
      '<div class="cell"><div class="l">本年度預算</div><div class="v" style="font-size:14px;font-weight:700">'+fmt(r['本年度預算'])+'</div></div>'+
      '<div class="cell"><div class="l">剩餘可動支數</div><div class="v" style="font-size:14px;font-weight:700;color:'+(Number(r['剩餘可動支數'])<0?'#c62828':'#128048')+'">'+fmt(r['剩餘可動支數'])+'</div></div>'+
    '</div></div>'+
    '<div class="sheet-section"><h4>年度動支進度</h4>'+
      '<div class="bar-row"><div class="bl"><span>累計動支率</span><span style="color:'+rateColor(mr)+'">'+mr+'%</span></div><div class="btrack"><div class="bfill" style="width:'+Math.min(mr,100)+'%;background:'+rateColor(mr)+'"></div></div></div>'+
      '<div class="bar-row"><div class="bl"><span>年度動支率</span><span style="color:'+rateColor(yr)+'">'+yr+'%</span></div><div class="btrack"><div class="bfill" style="width:'+Math.min(yr,100)+'%;background:'+rateColor(yr)+'"></div></div></div>'+
    '</div>';
  document.getElementById('overlay').className = 'overlay open';
}
document.getElementById('overlay').addEventListener('click', function(e){
  if(e.target===this) this.className='overlay';
});

function renderAll(){
  renderChips();
  renderPills();
  var list = getFiltered();
  renderStats(list);
  renderList(list);
}

document.getElementById('searchBox').addEventListener('input', function(){
  state.search = this.value.trim();
  state.page = 1;
  renderAll();
});

// ---- Tabs ----
function switchTab(tabName){
  document.querySelectorAll('.tab-btn').forEach(function(b){ b.classList.toggle('active', b.dataset.tab===tabName); });
  document.querySelectorAll('.tab-content').forEach(function(c){ c.classList.toggle('active', c.id==='tab-'+tabName); });
  if(tabName==='summary') renderSummary();
  if(tabName==='warning') renderWarning();
  if(tabName==='charts') renderCharts();
}
document.querySelectorAll('.tab-btn').forEach(function(b){
  b.addEventListener('click', function(){ switchTab(this.dataset.tab); });
});

// ---- Summary Tab ----
function renderSummary(){
  var root = document.getElementById('summaryRoot');
  var sumYBudget=0, sumBal=0;
  RAW.forEach(function(r){ sumYBudget+=Number(r['本年度預算'])||0; sumBal+=Number(r['本月餘額'])||0; });
  var overallPct = sumYBudget>0 ? (sumBal/sumYBudget*100).toFixed(1) : 0;

  var catAgg = {};
  RAW.forEach(function(r){
    var c = r['費用分類'];
    if(!catAgg[c]) catAgg[c] = {budget:0, bal:0};
    catAgg[c].budget += Number(r['本年度預算'])||0;
    catAgg[c].bal += Number(r['本月餘額'])||0;
  });
  var unitAgg = {};
  RAW.forEach(function(r){
    var u = r['預算主管單位'];
    if(!u) return;
    if(!unitAgg[u]) unitAgg[u] = {budget:0, bal:0};
    unitAgg[u].budget += Number(r['本年度預算'])||0;
    unitAgg[u].bal += Number(r['本月餘額'])||0;
  });

  var html = '<div class="card"><h3 style="font-size:15px;margin-bottom:10px;">📊 整體預算概況</h3>'+
    '<div class="sheet-grid">'+
      '<div class="cell"><div class="l">本年度總預算</div><div class="v" style="font-size:15px;font-weight:700">'+fmt(sumYBudget)+'</div></div>'+
      '<div class="cell"><div class="l">累計動支餘額</div><div class="v" style="font-size:15px;font-weight:700;color:#1565c0">'+fmt(sumBal)+'</div></div>'+
    '</div>'+
    '<div class="bar-row" style="margin-top:12px;"><div class="bl"><span>整體動支率</span><span style="color:'+rateColor(overallPct)+'">'+overallPct+'%</span></div><div class="btrack"><div class="bfill" style="width:'+Math.min(overallPct,100)+'%;background:'+rateColor(overallPct)+'"></div></div></div>'+
  '</div>';

  html += '<div class="card"><h3 style="font-size:15px;margin-bottom:10px;">各費用分類動支率</h3>';
  Object.keys(catAgg).sort(function(a,b){return catAgg[b].budget-catAgg[a].budget;}).forEach(function(c){
    var a = catAgg[c];
    var pct = a.budget>0 ? (a.bal/a.budget*100).toFixed(1) : 0;
    html += '<div class="bar-row"><div class="bl"><span>'+c+'（餘額 '+fmt(a.bal)+' / 預算 '+fmt(a.budget)+'）</span><span style="color:'+rateColor(pct)+'">'+pct+'%</span></div><div class="btrack"><div class="bfill" style="width:'+Math.min(pct,100)+'%;background:'+rateColor(pct)+'"></div></div></div>';
  });
  html += '</div>';

  if(Object.keys(unitAgg).length){
    html += '<div class="card"><h3 style="font-size:15px;margin-bottom:10px;">各科室動支率</h3>';
    Object.keys(unitAgg).sort(function(a,b){return unitAgg[b].budget-unitAgg[a].budget;}).forEach(function(u){
      var a = unitAgg[u];
      var pct = a.budget>0 ? (a.bal/a.budget*100).toFixed(1) : 0;
      html += '<div class="bar-row"><div class="bl"><span>'+u+'（餘額 '+fmt(a.bal)+' / 預算 '+fmt(a.budget)+'）</span><span style="color:'+rateColor(pct)+'">'+pct+'%</span></div><div class="btrack"><div class="bfill" style="width:'+Math.min(pct,100)+'%;background:'+rateColor(pct)+'"></div></div></div>';
    });
    html += '</div>';
  }
  root.innerHTML = html;
}

// ---- Warning Tab ----
function renderWarning(){
  var root = document.getElementById('warningRoot');
  var warns = RAW.filter(function(r){ return (Number(r['年度動支率'])||0) >= 70; })
    .sort(function(a,b){ return (Number(b['年度動支率'])||0) - (Number(a['年度動支率'])||0); });
  if(!warns.length){
    root.innerHTML = '<div class="card" style="text-align:center;color:#888;padding:30px 10px;">✅ 目前無年度動支率 ≥ 70% 之項目</div>';
    return;
  }
  var html = '<div class="result-count" style="margin-bottom:10px;">共 '+warns.length+' 筆 年度動支率 ≥ 70%</div>';
  warns.forEach(function(r){
    var yr = Number(r['年度動支率'])||0;
    var high = yr >= 90;
    html += '<div class="warn-item'+(high?' high':'')+'">'+
      '<div class="top"><span class="name">'+r['明細帳']+' '+r['會計項目']+'</span><span class="pct" style="color:'+(high?'#c62828':'#e07b00')+'">'+yr+'%</span></div>'+
      '<div style="font-size:11.5px;color:#888;">'+r['費用分類']+(r['預算主管單位']?(' · '+r['預算主管單位']):'')+' · 剩餘可動支 '+fmt(r['剩餘可動支數'])+'</div>'+
    '</div>';
  });
  root.innerHTML = html;
}

// ---- Charts Tab ----
var _chartsReady = false;
function renderCharts(){
  var root = document.getElementById('chartsRoot');
  var sumYBudget=0, sumBal=0;
  RAW.forEach(function(r){ sumYBudget+=Number(r['本年度預算'])||0; sumBal+=Number(r['本月餘額'])||0; });
  var overallPct = sumYBudget>0 ? (sumBal/sumYBudget*100).toFixed(1) : 0;

  var kpiHtml = '<div class="kpi-row">'+
    '<div class="kpi-card"><div class="kl">本年度預算</div><div class="kv">'+wan(sumYBudget)+'</div></div>'+
    '<div class="kpi-card"><div class="kl">累計動支</div><div class="kv" style="color:#1565c0">'+wan(sumBal)+'</div></div>'+
    '<div class="kpi-card"><div class="kl">整體動支率</div><div class="kv" style="color:'+rateColor(overallPct)+'">'+overallPct+'%</div></div>'+
  '</div>';

  if(!document.getElementById('kpiRow')){
    root.innerHTML = '<div id="kpiRow">'+kpiHtml+'</div>'+
      '<div class="section-title">🍩 費用分類預算分配</div>'+
      '<div class="card"><div class="chart-canvas-wrap" style="height:280px"><canvas id="chartDonut"></canvas></div></div>'+
      '<div class="section-title">📊 費用分類年度動支率</div>'+
      '<div class="card"><div class="chart-canvas-wrap" style="height:260px"><canvas id="chartCatBar"></canvas></div></div>'+
      '<div class="section-title">🏢 科室年度動支率</div>'+
      '<div class="card"><div class="chart-canvas-wrap" id="unitChartWrap" style="height:300px"><canvas id="chartUnitBar"></canvas></div></div>'+
      '<div class="section-title">📦 已動支 vs 剩餘可動支（萬元）</div>'+
      '<div class="card"><div class="chart-canvas-wrap" style="height:260px"><canvas id="chartStack"></canvas></div></div>';
  }

  if(_chartsReady) return;
  _chartsReady = true;

  if(typeof Chart === 'undefined'){
    var s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js';
    s.onload = function(){ drawAll(); };
    document.head.appendChild(s);
  } else {
    drawAll();
  }

  function drawAll(){
    var catAgg = {};
    RAW.forEach(function(r){
      var c = r['費用分類'];
      if(!catAgg[c]) catAgg[c] = {budget:0, bal:0};
      catAgg[c].budget += Number(r['本年度預算'])||0;
      catAgg[c].bal += Number(r['本月餘額'])||0;
    });
    var catKeys = Object.keys(catAgg).sort(function(a,b){return catAgg[b].budget-catAgg[a].budget;});

    new Chart(document.getElementById('chartDonut'), {
      type:'doughnut',
      data:{ labels:catKeys, datasets:[{ data:catKeys.map(function(c){return catAgg[c].budget;}), backgroundColor:catKeys.map(function(c){return CAT_COLORS[c]||'#888';}) }] },
      options:{ maintainAspectRatio:false, plugins:{ legend:{ position:'bottom', labels:{ font:{size:11}, boxWidth:12 } } } }
    });

    new Chart(document.getElementById('chartCatBar'), {
      type:'bar',
      data:{ labels:catKeys, datasets:[{ label:'年度動支率%', data:catKeys.map(function(c){ var a=catAgg[c]; return a.budget>0?+(a.bal/a.budget*100).toFixed(1):0; }), backgroundColor:catKeys.map(function(c){ var a=catAgg[c]; var p=a.budget>0?(a.bal/a.budget*100):0; return rateColor(p); }) }] },
      options:{ indexAxis:'y', maintainAspectRatio:false, plugins:{ legend:{display:false} }, scales:{ x:{ max:100 } } }
    });

    var unitAgg = {};
    RAW.forEach(function(r){
      var u = r['預算主管單位'];
      if(!u) return;
      if(!unitAgg[u]) unitAgg[u] = {budget:0, bal:0};
      unitAgg[u].budget += Number(r['本年度預算'])||0;
      unitAgg[u].bal += Number(r['本月餘額'])||0;
    });
    var unitKeys = Object.keys(unitAgg).sort(function(a,b){
      var pa = unitAgg[a].budget>0?(unitAgg[a].bal/unitAgg[a].budget*100):0;
      var pb = unitAgg[b].budget>0?(unitAgg[b].bal/unitAgg[b].budget*100):0;
      return pb-pa;
    });
    var unitH = Math.max(260, unitKeys.length*28);
    document.getElementById('unitChartWrap').style.height = unitH+'px';
    new Chart(document.getElementById('chartUnitBar'), {
      type:'bar',
      data:{ labels:unitKeys, datasets:[{ label:'年度動支率%', data:unitKeys.map(function(u){ var a=unitAgg[u]; return a.budget>0?+(a.bal/a.budget*100).toFixed(1):0; }), backgroundColor:unitKeys.map(function(u){ var a=unitAgg[u]; var p=a.budget>0?(a.bal/a.budget*100):0; return rateColor(p); }) }] },
      options:{ indexAxis:'y', maintainAspectRatio:false, plugins:{ legend:{display:false} }, scales:{ x:{ max:100 } } }
    });

    new Chart(document.getElementById('chartStack'), {
      type:'bar',
      data:{ labels:catKeys, datasets:[
        { label:'已動支(萬)', data:catKeys.map(function(c){ return +(catAgg[c].bal/10000).toFixed(1); }), backgroundColor:'#1565c0' },
        { label:'剩餘可動支(萬)', data:catKeys.map(function(c){ return +((catAgg[c].budget-catAgg[c].bal)/10000).toFixed(1); }), backgroundColor:'#128048' }
      ]},
      options:{ maintainAspectRatio:false, plugins:{ legend:{ position:'bottom', labels:{font:{size:11}} } }, scales:{ x:{ stacked:true }, y:{ stacked:true } } }
    });
  }
}

renderAll();
</script>
