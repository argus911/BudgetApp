<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--green:#128048;--dgreen:#0c5030;--red:#c62828;--orange:#e07b00;--blue:#1565c0;--bg:#f5f7f5;--card:#fff;--border:#e0e8e4}
body{font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;background:var(--bg);color:#1a2e25;min-height:100vh;padding-bottom:80px}
.header{background:linear-gradient(135deg,#0c5030,#128048);color:#fff;padding:12px 16px 10px;position:sticky;top:0;z-index:100;padding-top:max(12px,env(safe-area-inset-top))}
.header h1{font-size:17px;font-weight:700;letter-spacing:.5px}
.header .sub{font-size:12px;opacity:.85;margin-top:2px;display:flex;align-items:center;gap:8px}
.badge{background:rgba(255,255,255,.25);border-radius:99px;padding:2px 8px;font-size:11px;font-weight:600}
.tab-bar{background:#fff;border-bottom:1px solid var(--border);display:flex;overflow-x:auto;position:sticky;top:54px;z-index:99;scrollbar-width:none;padding:0 4px}
.tab-bar::-webkit-scrollbar{display:none}
.tab-btn{flex:none;padding:10px 14px;font-size:13px;font-weight:600;color:#555;border:none;background:none;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap}
.tab-btn.active{color:var(--green);border-bottom-color:var(--green)}
.tab-content{display:none;padding:12px 14px}
.tab-content.active{display:block}
.notice{background:#fff8e1;border-left:4px solid #f9a825;padding:10px 14px;margin-bottom:12px;border-radius:0 8px 8px 0;font-size:13px;color:#5d4037;line-height:1.5}
.filter-card{background:var(--card);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.filter-card label{font-size:11px;color:#888;font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px;display:block}
input[type=text]{width:100%;padding:10px 12px;border:1.5px solid var(--border);border-radius:10px;font-size:14px;outline:none;transition:.2s}
input[type=text]:focus{border-color:var(--green)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{padding:5px 12px;border-radius:99px;font-size:12px;font-weight:600;border:1.5px solid var(--border);background:#f8fbf9;cursor:pointer;transition:.15s;color:#444}
.chip.active{background:var(--green);color:#fff;border-color:var(--green)}
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.stat-card{background:var(--card);border-radius:14px;padding:13px;box-shadow:0 1px 4px rgba(0,0,0,.07)}
.stat-card .lbl{font-size:11px;color:#888;margin-bottom:4px}
.stat-card .val{font-size:18px;font-weight:700;color:#1a2e25}
.stat-card .val.blue{color:var(--blue)}
.stat-card .val.green{color:var(--green)}
.stat-card .val.red{color:var(--red)}
.result-count{font-size:13px;color:#666;margin-bottom:8px;padding:0 2px}
.card{background:var(--card);border-radius:16px;margin-bottom:10px;box-shadow:0 1px 6px rgba(0,0,0,.07);overflow:hidden;cursor:pointer;transition:transform .1s}
.card:active{transform:scale(.98)}
.card-head{padding:12px 14px 10px;border-bottom:1px solid #f0f4f2}
.card-title{font-size:14px;font-weight:700;color:#1a2e25;margin-bottom:5px}
.badges{display:flex;flex-wrap:wrap;gap:5px}
.cat-badge,.unit-badge{font-size:11px;padding:2px 8px;border-radius:99px;font-weight:600}
.card-body{display:grid;grid-template-columns:1fr 1fr;gap:0}
.card-cell{padding:10px 14px;border-right:1px solid #f0f4f2;border-bottom:1px solid #f0f4f2}
.card-cell:nth-child(2n){border-right:none}
.card-cell:nth-last-child(-n+2){border-bottom:none}
.cell-lbl{font-size:10px;color:#999;margin-bottom:2px}
.cell-val{font-size:14px;font-weight:700}
.cell-val.blue{color:var(--blue)}
.cell-val.green{color:var(--green)}
.cell-val.red{color:var(--red)}
.cell-val.orange{color:var(--orange)}
.prog-wrap{padding:10px 14px 12px;border-top:1px solid #f0f4f2}
.prog-lbl{font-size:11px;color:#888;margin-bottom:5px;display:flex;justify-content:space-between}
.prog-bar{height:6px;background:#e8f0eb;border-radius:99px;overflow:hidden}
.prog-fill{height:100%;border-radius:99px;transition:width .3s}
.pager{display:flex;justify-content:center;align-items:center;gap:12px;padding:12px 0}
.pager button{padding:7px 18px;border-radius:99px;border:1.5px solid var(--border);background:#fff;font-size:13px;font-weight:600;cursor:pointer;color:#444}
.pager button:disabled{opacity:.35;cursor:default}
.pager .pg-info{font-size:13px;color:#666}
.sum-card{background:var(--card);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 1px 4px rgba(0,0,0,.07)}
.sum-card h3{font-size:14px;font-weight:700;color:var(--dgreen);margin-bottom:10px}
.bar-row{margin-bottom:10px}
.bar-lbl{font-size:12px;display:flex;justify-content:space-between;margin-bottom:4px;color:#444}
.bar-bg{height:10px;background:#e8f0eb;border-radius:99px;overflow:hidden}
.bar-fill{height:100%;border-radius:99px}
.warn-card{background:var(--card);border-radius:16px;margin-bottom:10px;padding:14px;box-shadow:0 1px 6px rgba(0,0,0,.07);border-left:4px solid var(--orange)}
.warn-card.red-warn{border-left-color:var(--red)}
.warn-title{font-size:13px;font-weight:700;margin-bottom:4px}
.warn-meta{font-size:12px;color:#666}
.info-section{background:var(--card);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 1px 4px rgba(0,0,0,.07)}
.info-section h3{font-size:14px;font-weight:700;color:var(--dgreen);margin-bottom:10px}
.info-row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #f0f4f2;font-size:13px}
.info-row:last-child{border-bottom:none}
.info-row .k{color:#888}
.info-row .v{font-weight:600;color:#1a2e25}
.chart-section{background:var(--card);border-radius:16px;padding:14px;margin-bottom:14px;box-shadow:0 1px 4px rgba(0,0,0,.07)}
.chart-section h3{font-size:14px;font-weight:700;color:var(--dgreen);margin-bottom:12px}
.kpi-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.kpi-card{border-radius:12px;padding:10px;text-align:center}
.kpi-card .kv{font-size:16px;font-weight:800;margin-bottom:2px}
.kpi-card .kl{font-size:10px;font-weight:600;opacity:.75}
.chart-canvas-wrap{position:relative;width:100%}
.chart-canvas-wrap canvas{width:100%!important;height:100%!important;display:block}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;align-items:flex-end}
.overlay.open{display:flex}
.sheet{background:#fff;border-radius:20px 20px 0 0;width:100%;max-height:85vh;overflow-y:auto;padding:0 0 max(20px,env(safe-area-inset-bottom)) 0}
.sheet-handle{width:40px;height:4px;background:#ddd;border-radius:99px;margin:10px auto 14px}
.sheet-title{font-size:16px;font-weight:700;padding:0 16px 12px;color:#1a2e25;border-bottom:1px solid #f0f4f2}
.sheet-body{padding:14px 16px}
.sheet-section{margin-bottom:16px}
.sheet-section h4{font-size:12px;color:#888;font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}
.sheet-row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #f8f8f8;font-size:14px}
.sheet-row:last-child{border-bottom:none}
.sheet-row .sv{font-weight:700}
.bot-nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--border);display:flex;padding-bottom:max(0px,env(safe-area-inset-bottom));z-index:99}
.bot-btn{flex:1;display:flex;flex-direction:column;align-items:center;padding:8px 2px;font-size:10px;font-weight:600;color:#888;cursor:pointer;border:none;background:none;gap:3px;transition:.15s}
.bot-btn.active{color:var(--green)}
.bot-btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
</style>
</head>

function switchTab(name) {
  document.querySelectorAll('.tab-content').forEach(function(el){ el.classList.remove('active'); });
  document.querySelectorAll('.tab-btn').forEach(function(el){ el.classList.remove('active'); });
  document.querySelectorAll('.bot-btn').forEach(function(el){ el.classList.remove('active'); });
  var tc = document.getElementById('tab-'+name);
  if(tc) tc.classList.add('active');
  document.querySelectorAll('[data-tab="'+name+'"]').forEach(function(el){ el.classList.add('active'); });
  if(name === 'summary' && !_summaryDone){ renderSummary(); _summaryDone=true; }
  if(name === 'warning' && !_warningDone){ renderWarning(); _warningDone=true; }
  if(name === 'charts'){ renderCharts(); }
  if(name === 'info' && !_infoDone){ renderInfo(); _infoDone=true; }
  window.scrollTo(0,0);
}
document.getElementById('topTabBar').addEventListener('click', function(e){
  var btn = e.target.closest('[data-tab]');
  if(btn) switchTab(btn.dataset.tab);
});
document.querySelector('.bot-nav').addEventListener('click', function(e){
  var btn = e.target.closest('[data-tab]');
  if(btn) switchTab(btn.dataset.tab);
});

var CATS = ['all','人事費','業務外包','業務成本','專案建置成本','設備及折舊','管銷費用'];

CATS.forEach(function(c){

  btn.className = 'chip' + (c==='all'?' active':'');
  btn.textContent = c==='all'?'全部':c;
  btn.dataset.cat = c;
  catChipsEl.appendChild(btn);
});
catChipsEl.addEventListener('click', function(e){

  curCat = btn.dataset.cat;
  catChipsEl.querySelectorAll('.chip').forEach(function(c){ c.classList.toggle('active', c.dataset.cat===curCat); if(c.dataset.cat===curCat && curCat!=='all') c.style.cssText='background:'+CAT_COLORS[curCat]||'#128048'+';color:#fff;border-color:'+CAT_COLORS[curCat]||'#128048'; else if(c.dataset.cat!=='all') c.style.cssText=''; });

});

UNITS.forEach(function(u){
  var btn = document.createElement('button');

  btn.style.borderColor = unitColorMap[u];

unitChipsEl.addEventListener('click', function(e){
  var btn = e.target.closest('[data-unit]');
  if(!btn) return;
  curUnit = btn.dataset.unit;
  unitChipsEl.querySelectorAll('.chip').forEach(function(c){ 
    if(c.dataset.unit===curUnit){
      c.classList.add('active');
      if(curUnit!=='all'){ c.style.background=unitColorMap[curUnit]||'#128048'; c.style.color='#fff'; c.style.borderColor=unitColorMap[curUnit]||'#128048'; }
    } else {
      c.classList.remove('active');
      c.style.background=''; c.style.color='';
      if(c.dataset.unit!=='all') c.style.borderColor=unitColorMap[c.dataset.unit]||'';
    }
  });
  curPage=1; applyFilter();
});

document.getElementById('searchInput').addEventListener('input', function(){
  curSearch = this.value.trim();
  curPage=1; applyFilter();
});

function applyFilter(){
  filteredData = RAW.filter(function(r){
    if(curCat!=='all' && r['費用分類']!==curCat) return false;
    if(curUnit!=='all' && r['預算主管單位']!==curUnit) return false;
    if(curSearch){
      var q=curSearch.toLowerCase();
      if(r['明細帳'].toLowerCase().indexOf(q)<0 && r['會計項目'].toLowerCase().indexOf(q)<0) return false;
    }
    return true;
  });
  renderStats();
  renderCards();
}

function fmt(n){
  if(n===''||n===null||n===undefined) return '—';
  return Number(n).toLocaleString('zh-TW');
}
function pctColor(v){ return v>=90?'red':v>=70?'orange':'green'; }
function pctHex(v){ return v>=90?'#c62828':v>=70?'#e07b00':'#128048'; }

function renderStats(){
  var totalBal=0,totalBgt=0,totalYBgt=0,totalRem=0;
  filteredData.forEach(function(r){
    totalBal+=Number(r['本月餘額'])||0;
    totalBgt+=Number(r['本月預算數'])||0;
    totalYBgt+=Number(r['本年度預算'])||0;
    totalRem+=Number(r['剩餘可動支數'])||0;
  });
  document.getElementById('totalBadge').textContent = filteredData.length + ' 筆';
  document.getElementById('resultCount').textContent = '共 ' + filteredData.length + ' 筆';
  var sg = document.getElementById('statsGrid');
  sg.innerHTML = '';
  var items=[
    ['本月餘額（累計）',fmt(Math.round(totalBal)),'blue'],
    ['本月預算數',fmt(Math.round(totalBgt)),''],
    ['本年度預算',fmt(Math.round(totalYBgt)),''],
    ['剩餘可動支數',fmt(Math.round(totalRem)),totalRem<0?'red':'green']
  ];
  items.forEach(function(item){
    var d=document.createElement('div');
    d.className='stat-card';
    d.innerHTML='<div class="lbl">'+item[0]+'</div><div class="val '+item[2]+'">'+item[1]+'</div>';
    sg.appendChild(d);
  });
}

function renderCards(){
  var total=filteredData.length;
  var pages=Math.ceil(total/PAGE_SIZE)||1;
  if(curPage>pages) curPage=1;
  var start=(curPage-1)*PAGE_SIZE, end=Math.min(start+PAGE_SIZE,total);
  var cl=document.getElementById('cardList');
  cl.innerHTML='';
  filteredData.slice(start,end).forEach(function(r){
    var yr=Number(r['年度動支率'])||0;
    var cr=Number(r['累計動支率'])||0;
    var uc=r['預算主管單位']?(unitColorMap[r['預算主管單位']]||'#128048'):'';
    var unitBadge=r['預算主管單位']?'<span class="unit-badge" style="background:'+uc+'1a;color:'+uc+'">'+r['預算主管單位']+'</span>':'';
    var catColor=CAT_COLORS[r['費用分類']]||'#78909c';
    var remColor=(Number(r['剩餘可動支數'])||0)<0?'red':'green';
    var fillColor=pctHex(yr);
    var card=document.createElement('div');
    card.className='card';
    card.dataset.acc=r['明細帳'];
    card.innerHTML=
      '<div class="card-head">'+
        '<div class="card-title">['+( r['明細帳']||'—')+'] '+(r['會計項目']||'—')+'</div>'+
        '<div class="badges">'+
          '<span class="cat-badge" style="background:'+catColor+'18;color:'+catColor+'">'+r['費用分類']+'</span>'+
          unitBadge+
        '</div>'+
      '</div>'+
      '<div class="card-body">'+
        '<div class="card-cell"><div class="cell-lbl">本月餘額（累計）</div><div class="cell-val blue">'+fmt(r['本月餘額'])+'</div></div>'+
        '<div class="card-cell"><div class="cell-lbl">累計動支率</div><div class="cell-val '+pctColor(cr)+'">'+cr+'%</div></div>'+
        '<div class="card-cell"><div class="cell-lbl">本年度預算</div><div class="cell-val">'+fmt(r['本年度預算'])+'</div></div>'+
        '<div class="card-cell"><div class="cell-lbl">剩餘可動支數</div><div class="cell-val '+remColor+'">'+fmt(r['剩餘可動支數'])+'</div></div>'+
      '</div>'+
      '<div class="prog-wrap">'+
        '<div class="prog-lbl"><span>年度動支率</span><span style="color:'+fillColor+';font-weight:700">'+yr+'%</span></div>'+
        '<div class="prog-bar"><div class="prog-fill" style="width:'+Math.min(yr,100)+'%;background:'+fillColor+'"></div></div>'+
      '</div>';
    card.addEventListener('click',function(){ openSheet(this.dataset.acc); });
    cl.appendChild(card);
  });
  var pg=document.getElementById('pager');
  pg.innerHTML='';
  if(pages>1){
    var prev=document.createElement('button'); prev.textContent='上一頁'; prev.disabled=(curPage<=1);
    prev.addEventListener('click',function(){ curPage--; renderCards(); window.scrollTo(0,0); });
    var info=document.createElement('span'); info.className='pg-info'; info.textContent=curPage+'/'+pages;
    var next=document.createElement('button'); next.textContent='下一頁'; next.disabled=(curPage>=pages);
    next.addEventListener('click',function(){ curPage++; renderCards(); window.scrollTo(0,0); });
    pg.appendChild(prev); pg.appendChild(info); pg.appendChild(next);
  }
}

function openSheet(acc){
  var r=RAW.find(function(x){ return x['明細帳']===acc; });
  if(!r) return;
  var yr=Number(r['年度動支率'])||0;
  var fillColor=pctHex(yr);
  document.getElementById('sheetTitle').textContent='['+r['明細帳']+'] '+r['會計項目'];
  document.getElementById('sheetBody').innerHTML=
    '<div class="sheet-section"><h4>本月數據</h4>'+
      srow('本月動支數',fmt(r['本月動支數']))+
      srow('本月餘額（累計）','<span style="color:#1565c0;font-weight:700">'+fmt(r['本月餘額'])+'</span>')+
      srow('本月預算數',fmt(r['本月預算數']))+
    '</div>'+
    '<div class="sheet-section"><h4>年度數據</h4>'+
      srow('至本月預算數累計',fmt(r['至本月預算數累計']))+
      srow('累計動支率',r['累計動支率']+'%')+
      srow('本年度預算',fmt(r['本年度預算']))+
      srow('剩餘可動支數',fmt(r['剩餘可動支數']))+
      srow('費用分類',r['費用分類'])+
      srow('預算主管單位',r['預算主管單位']||'—')+
    '</div>'+
    '<div class="sheet-section"><h4>年度動支進度</h4>'+
      '<div style="margin-bottom:6px;font-size:13px;color:'+fillColor+';font-weight:700">'+yr+'%</div>'+
      '<div class="prog-bar"><div class="prog-fill" style="width:'+Math.min(yr,100)+'%;background:'+fillColor+'"></div></div>'+
    '</div>';
  document.getElementById('overlay').className='overlay open';
}
function srow(k,v){ return '<div class="sheet-row"><span class="k">'+k+'</span><span class="sv">'+v+'</span></div>'; }
document.getElementById('overlay').addEventListener('click',function(e){ if(e.target===this) this.className='overlay'; });

function renderSummary(){
  var catMap={},unitMap={};
  RAW.forEach(function(r){
    var c=r['費用分類'];
    if(!catMap[c]) catMap[c]={bgt:0,rem:0};
    catMap[c].bgt+=Number(r['本年度預算'])||0;
    catMap[c].rem+=Number(r['剩餘可動支數'])||0;
    var u=r['預算主管單位'];
    if(u){ if(!unitMap[u]) unitMap[u]={bgt:0,rem:0}; unitMap[u].bgt+=Number(r['本年度預算'])||0; unitMap[u].rem+=Number(r['剩餘可動支數'])||0; }
  });
  var totalBgt=0,totalRem=0;
  Object.values(catMap).forEach(function(v){ totalBgt+=v.bgt; totalRem+=v.rem; });
  var totalUsed=totalBgt-totalRem;
  var totalRate=totalBgt>0?((totalUsed/totalBgt)*100).toFixed(1):0;
  var html='<div class="sum-card"><h3>整體預算概況</h3>'+
    '<div class="info-row"><span class="k">年度預算總計</span><span class="v">'+fmt(Math.round(totalBgt))+'</span></div>'+
    '<div class="info-row"><span class="k">累計動支總計</span><span class="v">'+fmt(Math.round(totalUsed))+'</span></div>'+
    '<div class="info-row"><span class="k">整體動支率</span><span class="v" style="color:'+pctHex(totalRate)+'">'+totalRate+'%</span></div>'+
    '<div class="info-row"><span class="k">剩餘可動支</span><span class="v">'+fmt(Math.round(totalRem))+'</span></div></div>';
  html+='<div class="sum-card"><h3>各費用分類動支率</h3>';
  Object.keys(catMap).sort().forEach(function(c){
    var v=catMap[c]; var rate=v.bgt>0?(((v.bgt-v.rem)/v.bgt)*100).toFixed(1):0;
    var fc=pctHex(rate);
    html+='<div class="bar-row">'+
      '<div class="bar-lbl"><span>'+c+'</span><span style="color:'+fc+';font-weight:700">'+rate+'%</span></div>'+
      '<div class="bar-lbl" style="font-size:11px;color:#999;margin-top:-2px"><span>年度預算 '+fmt(Math.round(v.bgt))+'</span><span>已動支 '+fmt(Math.round(v.bgt-v.rem))+'</span></div>'+
      '<div class="bar-bg"><div class="bar-fill" style="width:'+Math.min(rate,100)+'%;background:'+fc+'"></div></div></div>';
  });
  html+='</div>';
  if(Object.keys(unitMap).length>0){
    html+='<div class="sum-card"><h3>各科室動支率</h3>';
    var ukeys=Object.keys(unitMap).sort(function(a,b){
      var ra=unitMap[a].bgt>0?(unitMap[a].bgt-unitMap[a].rem)/unitMap[a].bgt*100:0;
      var rb=unitMap[b].bgt>0?(unitMap[b].bgt-unitMap[b].rem)/unitMap[b].bgt*100:0;
      return rb-ra;
    });
    ukeys.forEach(function(u){
      var v=unitMap[u]; var rate=v.bgt>0?(((v.bgt-v.rem)/v.bgt)*100).toFixed(1):0;
      var uc=unitColorMap[u]||'#128048';
      html+='<div class="bar-row">'+
        '<div class="bar-lbl"><span style="color:'+uc+';font-weight:600">'+u+'</span><span style="color:'+uc+';font-weight:700">'+rate+'%</span></div>'+
        '<div class="bar-bg"><div class="bar-fill" style="width:'+Math.min(rate,100)+'%;background:'+uc+'"></div></div></div>';
    });
    html+='</div>';
  }
  document.getElementById('summaryRoot').innerHTML=html;
}

function renderWarning(){
  var warns=RAW.filter(function(r){ return (Number(r['年度動支率'])||0)>=70; })
    .sort(function(a,b){ return (Number(b['年度動支率'])||0)-(Number(a['年度動支率'])||0); });
  if(!warns.length){ document.getElementById('warningRoot').innerHTML='<div class="info-section"><p style="color:#888;text-align:center;padding:20px">無高用率項目</p></div>'; return; }
  var html='<div style="font-size:13px;color:#888;margin-bottom:10px">共 '+warns.length+' 筆年度動支率 ≥ 70%</div>';
  warns.forEach(function(r){
    var yr=Number(r['年度動支率'])||0;
    var isRed=yr>=90;
    var uc=r['預算主管單位']?(unitColorMap[r['預算主管單位']]||'#128048'):'';
    var unitSpan=r['預算主管單位']?'<span class="unit-badge" style="background:'+uc+'1a;color:'+uc+';margin-left:6px">'+r['預算主管單位']+'</span>':'';
    html+='<div class="warn-card'+(isRed?' red-warn':'')+'">'+
      '<div class="warn-title">['+r['明細帳']+'] '+r['會計項目']+unitSpan+'</div>'+
      '<div class="warn-meta" style="margin-top:6px;display:flex;gap:12px">'+
        '<span>年度動支率 <strong style="color:'+(isRed?'#c62828':'#e07b00')+'">'+yr+'%</strong></span>'+
        '<span>累計 '+r['累計動支率']+'%</span>'+
        '<span>剩餘 '+fmt(r['剩餘可動支數'])+'</span>'+
      '</div></div>';
  });
  document.getElementById('warningRoot').innerHTML=html;
}

function renderCharts(){
  if(_chartsReady) return;
  _chartsReady=true;
  var catMap={},unitMap={};
  RAW.forEach(function(r){
    var c=r['費用分類'];
    if(!catMap[c]) catMap[c]={bgt:0,rem:0};
    catMap[c].bgt+=Number(r['本年度預算'])||0;
    catMap[c].rem+=Number(r['剩餘可動支數'])||0;
    var u=r['預算主管單位'];
    if(u){ if(!unitMap[u]) unitMap[u]={bgt:0,rem:0}; unitMap[u].bgt+=Number(r['本年度預算'])||0; unitMap[u].rem+=Number(r['剩餘可動支數'])||0; }
  });
  var totalBgt=0,totalRem=0;
  Object.values(catMap).forEach(function(v){ totalBgt+=v.bgt; totalRem+=v.rem; });
  var totalUsed=totalBgt-totalRem;
  var totalRate=totalBgt>0?((totalUsed/totalBgt)*100).toFixed(1):0;
  var kc=pctHex(totalRate);
  var root=document.getElementById('chartsRoot');
  var ukeys=Object.keys(unitMap);
  var unitH=Math.max(260,ukeys.length*28);
  root.innerHTML=
    '<div class="chart-section"><h3>整體 KPI</h3><div class="kpi-grid">'+
      '<div class="kpi-card" style="background:#e8f5e9"><div class="kv" style="color:#2e7d32">'+Math.round(totalBgt/10000)+'萬</div><div class="kl" style="color:#388e3c">年度預算</div></div>'+
      '<div class="kpi-card" style="background:#e3f2fd"><div class="kv" style="color:#1565c0">'+Math.round(totalUsed/10000)+'萬</div><div class="kl" style="color:#1976d2">累計動支</div></div>'+
      '<div class="kpi-card" style="background:'+(totalRate>=90?'#ffebee':totalRate>=70?'#fff3e0':'#e8f5e9')+'"><div class="kv" style="color:'+kc+'">'+totalRate+'%</div><div class="kl" style="color:'+kc+'">整體動支率</div></div>'+
    '</div></div>'+
    '<div class="chart-section"><h3>費用分類預算分配</h3><div class="chart-canvas-wrap" style="height:280px"><canvas id="chartDonut"></canvas></div></div>'+
    '<div class="chart-section"><h3>費用分類年度動支率</h3><div class="chart-canvas-wrap" style="height:260px"><canvas id="chartCat"></canvas></div></div>'+
    '<div class="chart-section"><h3>科室年度動支率</h3><div class="chart-canvas-wrap" id="unitWrap" style="height:'+unitH+'px"><canvas id="chartUnit"></canvas></div></div>'+
    '<div class="chart-section"><h3>已動支 vs 剩餘（萬元）</h3><div class="chart-canvas-wrap" style="height:280px"><canvas id="chartStack"></canvas></div></div>';
  if(typeof Chart==='undefined'){
    var s=document.createElement('script');
    s.src='https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js';
    s.onload=function(){ drawAllCharts(catMap,unitMap); };
    document.head.appendChild(s);
  } else { drawAllCharts(catMap,unitMap); }
}

function drawAllCharts(catMap,unitMap){
  var catKeys=Object.keys(catMap);
  var catBgts=catKeys.map(function(c){ return Math.round(catMap[c].bgt/10000); });
  var catRates=catKeys.map(function(c){ var v=catMap[c]; return v.bgt>0?Number(((v.bgt-v.rem)/v.bgt*100).toFixed(1)):0; });
  var catColors=catKeys.map(function(c){ return CAT_COLORS[c]||'#78909c'; });
  new Chart(document.getElementById('chartDonut'),{type:'doughnut',data:{labels:catKeys,datasets:[{data:catBgts,backgroundColor:catColors,borderWidth:2,borderColor:'#fff'}]},options:{maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{font:{size:11},padding:8}}}}});
  new Chart(document.getElementById('chartCat'),{type:'bar',data:{labels:catKeys,datasets:[{label:'年度動支率(%)',data:catRates,backgroundColor:catRates.map(function(r){ return pctHex(r); }),borderRadius:4}]},options:{maintainAspectRatio:false,indexAxis:'y',plugins:{legend:{display:false}},scales:{x:{max:100,ticks:{callback:function(v){ return v+'%'; }}}}}});
  var ukeys=Object.keys(unitMap).sort(function(a,b){ var ra=unitMap[a].bgt>0?(unitMap[a].bgt-unitMap[a].rem)/unitMap[a].bgt*100:0; var rb=unitMap[b].bgt>0?(unitMap[b].bgt-unitMap[b].rem)/unitMap[b].bgt*100:0; return rb-ra; });
  var urates=ukeys.map(function(u){ var v=unitMap[u]; return v.bgt>0?Number(((v.bgt-v.rem)/v.bgt*100).toFixed(1)):0; });
  new Chart(document.getElementById('chartUnit'),{type:'bar',data:{labels:ukeys,datasets:[{label:'動支率(%)',data:urates,backgroundColor:ukeys.map(function(u){ return unitColorMap[u]||'#128048'; }),borderRadius:4}]},options:{maintainAspectRatio:false,indexAxis:'y',plugins:{legend:{display:false}},scales:{x:{max:100,ticks:{callback:function(v){ return v+'%'; }}}}}});
  var stackUsed=catKeys.map(function(c){ return Math.round((catMap[c].bgt-catMap[c].rem)/10000); });
  var stackRem=catKeys.map(function(c){ return Math.round(Math.max(0,catMap[c].rem)/10000); });
  new Chart(document.getElementById('chartStack'),{type:'bar',data:{labels:catKeys,datasets:[{label:'已動支(萬)',data:stackUsed,backgroundColor:'#1976d2',borderRadius:4},{label:'剩餘(萬)',data:stackRem,backgroundColor:'#81c784',borderRadius:4}]},options:{maintainAspectRatio:false,indexAxis:'y',plugins:{legend:{position:'top'}},scales:{x:{stacked:true},y:{stacked:true}}}});
}

      '<div class="info-row"><span class="k">剩餘可動支</span><span class="v">'+fmt(Math.round(totalRem))+'</span></div>'+

    '<div class="info-section"><h3>PWA 使用說明</h3>'+

      '<div class="info-row"><span class="k">3. 加入主畫面</span><span class="v"></span></div>'+
      '<div class="info-row"><span class="k">4. 右上角「加入」</span><span class="v"></span></div>'+

}

</script>
