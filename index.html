<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f0f4f0;min-height:100vh;padding-bottom:80px}
.header{background:linear-gradient(135deg,#0a5c2e 0%,#128048 60%,#1a9a5a 100%);color:#fff;padding:12px 16px;position:sticky;top:0;z-index:100;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.header h1{font-size:17px;font-weight:700;letter-spacing:.5px}
.header .badge{background:rgba(255,255,255,.25);border-radius:12px;padding:2px 10px;font-size:12px;font-weight:600}
.tab-bar{display:flex;background:#fff;border-bottom:2px solid #e8f5e9;position:sticky;top:52px;z-index:99;overflow-x:auto;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.tab-btn{flex:none;padding:10px 16px;font-size:13px;font-weight:600;color:#666;border:none;background:none;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;transition:all .2s}
.tab-btn.active{color:#128048;border-bottom-color:#128048}
.tab-content{display:none;padding:12px 12px 0}
.tab-content.active{display:block}
.filter-card{background:#fff;border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 1px 6px rgba(0,0,0,.08)}
.search-box{width:100%;border:1.5px solid #c8e6c9;border-radius:10px;padding:9px 12px;font-size:14px;outline:none;transition:border .2s}
.search-box:focus{border-color:#128048}
.chip-group{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{border-radius:20px;padding:5px 12px;font-size:12px;font-weight:600;border:1.5px solid #ccc;background:#fff;cursor:pointer;transition:all .2s;color:#555}
.chip.active{color:#fff;border-color:transparent}
.notice{background:#fff8e1;border-left:4px solid #f9a825;border-radius:8px;padding:10px 14px;font-size:12.5px;color:#5d4037;margin-bottom:12px;line-height:1.5}
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.stat-card{background:#fff;border-radius:14px;padding:12px;box-shadow:0 1px 5px rgba(0,0,0,.07);text-align:center}
.stat-card .label{font-size:11px;color:#888;margin-bottom:4px}
.stat-card .value{font-size:18px;font-weight:700;color:#1a1a1a}
.result-count{font-size:13px;color:#666;margin-bottom:8px;padding-left:2px}
.card-list{display:flex;flex-direction:column;gap:10px;margin-bottom:12px}
.card{background:#fff;border-radius:16px;padding:14px;box-shadow:0 1px 6px rgba(0,0,0,.08);cursor:pointer;transition:box-shadow .15s}
.card:active{box-shadow:0 3px 12px rgba(0,0,0,.15)}
.card-head{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:8px;gap:8px}
.card-code{font-size:12px;color:#888;font-weight:500}
.card-name{font-size:14px;font-weight:700;color:#1a1a1a;flex:1}
.badges{display:flex;flex-wrap:wrap;gap:4px;justify-content:flex-end}
.cat-badge{border-radius:8px;padding:2px 8px;font-size:11px;font-weight:600;color:#fff;white-space:nowrap}
.unit-badge{border-radius:8px;padding:2px 8px;font-size:11px;font-weight:600;white-space:nowrap}
.card-row{display:grid;grid-template-columns:1fr 1fr;gap:6px;border-top:1px solid #f0f0f0;padding-top:8px;margin-top:6px}
.card-field .fl{font-size:10.5px;color:#999;margin-bottom:2px}
.card-field .fv{font-size:15px;font-weight:700}
.progress-bar{background:#e8f5e9;border-radius:4px;height:6px;margin-top:6px;overflow:hidden}
.progress-fill{height:100%;border-radius:4px;transition:width .3s}
.pager{display:flex;align-items:center;justify-content:center;gap:10px;padding:8px 0 16px}
.pager button{border:1.5px solid #c8e6c9;background:#fff;border-radius:10px;padding:6px 16px;font-size:13px;cursor:pointer;color:#128048;font-weight:600}
.pager button:disabled{opacity:.35;cursor:not-allowed}
.pager .pinfo{font-size:13px;color:#666}
/* Summary Tab */
.summary-section{background:#fff;border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 1px 6px rgba(0,0,0,.08)}
.summary-section h3{font-size:14px;font-weight:700;color:#128048;margin-bottom:12px;border-left:3px solid #128048;padding-left:8px}
.bar-row{margin-bottom:14px}
.bar-label{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:4px;color:#333}
.bar-track{background:#e8f5e9;border-radius:4px;height:10px;overflow:hidden}
.bar-fill{height:100%;border-radius:4px}
/* Warning Tab */
.warn-card{background:#fff;border-radius:16px;padding:14px;margin-bottom:10px;box-shadow:0 1px 6px rgba(0,0,0,.08)}
.warn-card.orange{border-left:4px solid #e07b00}
.warn-card.red{border-left:4px solid #c62828}
/* Info Tab */
.info-section{background:#fff;border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 1px 6px rgba(0,0,0,.08)}
.info-section h3{font-size:14px;font-weight:700;color:#128048;margin-bottom:10px}
.info-row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #f5f5f5;font-size:13px}
.info-row:last-child{border-bottom:none}
/* Charts Tab */
.chart-section{background:#fff;border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 1px 6px rgba(0,0,0,.08)}
.chart-section h3{font-size:14px;font-weight:700;color:#128048;margin-bottom:12px;border-left:3px solid #128048;padding-left:8px}
.kpi-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:8px}
.kpi-card{border-radius:12px;padding:12px 8px;text-align:center}
.kpi-card .kl{font-size:10px;color:#888;margin-bottom:4px}
.kpi-card .kv{font-size:14px;font-weight:700}
/* Overlay */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;align-items:flex-end}
.overlay.open{display:flex}
.sheet{background:#fff;border-radius:20px 20px 0 0;padding:20px;width:100%;max-height:80vh;overflow-y:auto}
.sheet-title{font-size:16px;font-weight:700;color:#128048;margin-bottom:14px;border-bottom:1px solid #e8f5e9;padding-bottom:10px}
.sheet-group{margin-bottom:14px}
.sheet-group h4{font-size:12px;color:#888;font-weight:600;margin-bottom:8px;text-transform:uppercase;letter-spacing:.5px}
.sheet-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sheet-field .sl{font-size:11px;color:#aaa;margin-bottom:2px}
.sheet-field .sv{font-size:16px;font-weight:700}
/* Bottom Nav */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e8f5e9;display:flex;z-index:100;padding-bottom:env(safe-area-inset-bottom)}
.bottom-nav .tab-btn{flex:1;padding:8px 4px 6px;font-size:10px;display:flex;flex-direction:column;align-items:center;gap:2px;color:#999;border-bottom:none;border-top:2px solid transparent}
.bottom-nav .tab-btn.active{color:#128048;border-top-color:#128048}
/* Applied filters pills */
.filter-pills{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.filter-pill{border-radius:14px;padding:4px 12px;font-size:12px;font-weight:600;color:#fff;display:flex;align-items:center;gap:4px}
.filter-pill.kw{background:#1565c0}
.filter-pill.cat{background:#e65100}
.filter-pill.unit{background:#128048}
</style>

var META_YEAR = '115';
var META_MONTH = '5';
var CAT_COLORS = {"人事費": "#1565c0", "業務外包": "#6a1b9a", "業務成本": "#e65100", "專案建置成本": "#2e7d32", "設備及折舊": "#4527a0", "管銷費用": "#00838f", "其他": "#546e7a"};
var UNIT_PALETTE = ["#128048", "#1565c0", "#6a1b9a", "#e65100", "#4527a0", "#00838f", "#ad1457", "#558b2f", "#f57f17", "#00695c", "#37474f", "#283593", "#4e342e"];
var unitColorMap = {};

// ─── Utils ───────────────────────────────────────────────
function fmt(v) {
  if (v === '' || v === null || v === undefined) return '—';
  var n = parseFloat(v);
  if (isNaN(n)) return String(v);
  return n.toLocaleString('zh-TW');
}
function fmtPct(v) {
  if (v === '' || v === null || v === undefined) return '—';
  var n = parseFloat(v);
  if (isNaN(n)) return '—';
  return n.toFixed(2) + '%';
}
function rateColor(r) {
  var n = parseFloat(r);
  if (isNaN(n)) return '#128048';
  return n >= 90 ? '#c62828' : n >= 70 ? '#e07b00' : '#128048';
}
function unitColor(u) {
  if (!u) return '#546e7a';
  if (!unitColorMap[u]) {
    var keys = Object.keys(unitColorMap);
    unitColorMap[u] = UNIT_PALETTE[keys.length % UNIT_PALETTE.length];
  }
  return unitColorMap[u];
}

// ─── Build unit color map upfront ────────────────────────
(function() {
  var uSet = {};
  RAW.forEach(function(r) { if(r['預算主管單位']) uSet[r['預算主管單位']] = true; });
  Object.keys(uSet).sort().forEach(function(u) { unitColor(u); });
})();

// ─── Tab Switch ──────────────────────────────────────────
var _summaryReady = false, _warnReady = false, _infoReady = false, _chartsReady = false;
function switchTab(tabName) {
  document.querySelectorAll('.tab-btn').forEach(function(b) {
    b.classList.toggle('active', b.dataset.tab === tabName);
  });
  document.querySelectorAll('.tab-content').forEach(function(c) {
    c.classList.toggle('active', c.id === 'tab-' + tabName);
  });
  if (tabName === 'summary' && !_summaryReady) { renderSummary(); _summaryReady = true; }
  if (tabName === 'warning' && !_warnReady)   { renderWarning(); _warnReady = true; }
  if (tabName === 'info'    && !_infoReady)   { renderInfo();    _infoReady = true; }
  if (tabName === 'charts'  && !_chartsReady) { renderCharts();  _chartsReady = true; }
}
document.querySelectorAll('[data-tab]').forEach(function(btn) {
  btn.addEventListener('click', function() { switchTab(this.dataset.tab); });
});

// ─── Filter State ────────────────────────────────────────
var state = { kw: '', cat: 'all', unit: 'all' };
var PAGE = 1, PAGE_SIZE = 20;

// ─── Build Chips ─────────────────────────────────────────
(function() {
  var catKeys = ['all','人事費','業務外包','業務成本','專案建置成本','設備及折舊','管銷費用','其他'];
  var cg = document.getElementById('catChips');
  catKeys.forEach(function(k) {
    var c = document.createElement('button');
    c.className = 'chip' + (k === 'all' ? ' active' : '');
    c.textContent = k === 'all' ? '全部分類' : k;
    c.dataset.cat = k;
    if (k !== 'all') c.style.borderColor = CAT_COLORS[k] || '#888';
    cg.appendChild(c);
  });
  cg.addEventListener('click', function(e) {
    var b = e.target.closest('[data-cat]');
    if (!b) return;
    state.cat = b.dataset.cat;
    cg.querySelectorAll('.chip').forEach(function(x) {
      var isActive = x.dataset.cat === state.cat;
      x.classList.toggle('active', isActive);
      if (isActive && state.cat !== 'all') x.style.background = CAT_COLORS[state.cat] || '#888';
      else if (state.cat === 'all' && x.dataset.cat === 'all') x.style.background = '#128048';
      else x.style.background = '';
    });
    PAGE = 1; renderCards();
  });

  var uSet = {};
  RAW.forEach(function(r) { if (r['預算主管單位']) uSet[r['預算主管單位']] = true; });
  var UNITS = ['all'].concat(Object.keys(uSet).sort());
  var ug = document.getElementById('unitChips');
  UNITS.forEach(function(u) {
    var c = document.createElement('button');
    c.className = 'chip' + (u === 'all' ? ' active' : '');
    c.textContent = u === 'all' ? '全部科室' : u;
    c.dataset.unit = u;
    if (u !== 'all') {
      var uc = unitColor(u);
      c.style.borderColor = uc;
    }
    ug.appendChild(c);
  });
  ug.addEventListener('click', function(e) {
    var b = e.target.closest('[data-unit]');
    if (!b) return;
    state.unit = b.dataset.unit;
    ug.querySelectorAll('.chip').forEach(function(x) {
      var isActive = x.dataset.unit === state.unit;
      x.classList.toggle('active', isActive);
      if (isActive && state.unit !== 'all') x.style.background = unitColor(state.unit);
      else if (state.unit === 'all' && x.dataset.unit === 'all') x.style.background = '#128048';
      else x.style.background = '';
    });
    PAGE = 1; renderCards();
  });
})();

document.getElementById('searchBox').addEventListener('input', function() {
  state.kw = this.value.trim();
  PAGE = 1; renderCards();
});

// ─── Filter ──────────────────────────────────────────────
function filterData() {
  return RAW.filter(function(r) {
    if (state.kw) {
      var kw = state.kw.toLowerCase();
      if (r['明細帳'].toLowerCase().indexOf(kw) < 0 && r['會計項目'].toLowerCase().indexOf(kw) < 0) return false;
    }
    if (state.cat !== 'all' && r['費用分類'] !== state.cat) return false;
    if (state.unit !== 'all' && r['預算主管單位'] !== state.unit) return false;
    return true;
  });
}

// ─── Render Cards ────────────────────────────────────────
function renderCards() {
  var filtered = filterData();
  var total = filtered.length;
  // Pills
  var pills = document.getElementById('filterPills');
  pills.innerHTML = '';
  if (state.kw) {
    var p = document.createElement('span'); p.className = 'filter-pill kw'; p.textContent = '🔍 ' + state.kw; pills.appendChild(p);
  }
  if (state.cat !== 'all') {
    var p = document.createElement('span'); p.className = 'filter-pill cat'; p.textContent = '📂 ' + state.cat; pills.appendChild(p);
  }
  if (state.unit !== 'all') {
    var p = document.createElement('span'); p.className = 'filter-pill unit'; p.textContent = '🏢 ' + state.unit; pills.appendChild(p);
  }
  // Stats
  var totalBudget = 0, totalRemainder = 0, totalMonthBudget = 0, totalBalance = 0;
  filtered.forEach(function(r) {
    totalBudget      += parseFloat(r['本年度預算']) || 0;
    totalRemainder   += parseFloat(r['剩餘可動支數']) || 0;
    totalMonthBudget += parseFloat(r['本月預算數']) || 0;
    totalBalance     += parseFloat(r['本月餘額']) || 0;
  });
  document.getElementById('totalBadge').textContent = total + ' 筆';
  var sg = document.getElementById('statsGrid');
  sg.innerHTML = '';
  [
    ['本月餘額累計', totalBalance],
    ['本月預算數', totalMonthBudget],
    ['本年度預算', totalBudget],
    ['剩餘可動支數', totalRemainder],
  ].forEach(function(pair) {
    var div = document.createElement('div');
    div.className = 'stat-card';
    div.innerHTML = '<div class="label">' + pair[0] + '</div><div class="value">' + fmt(pair[1]) + '</div>';
    sg.appendChild(div);
  });
  document.getElementById('resultCount').textContent = '共 ' + total + ' 筆';
  // Paginate
  var maxPage = Math.ceil(total / PAGE_SIZE) || 1;
  if (PAGE > maxPage) PAGE = maxPage;
  var start = (PAGE - 1) * PAGE_SIZE;
  var pageData = filtered.slice(start, start + PAGE_SIZE);
  // Cards
  var cl = document.getElementById('cardList');
  cl.innerHTML = '';
  pageData.forEach(function(r) {
    var catColor = CAT_COLORS[r['費用分類']] || '#546e7a';
    var uc = unitColor(r['預算主管單位']);
    var yr = parseFloat(r['年度動支率']);
    var yrc = rateColor(yr);
    var yrs = isNaN(yr) ? 0 : Math.min(yr, 100);
    var unitBadge = r['預算主管單位']
      ? '<span class="unit-badge" style="background:'+uc+'1a;color:'+uc+'">'+r['預算主管單位']+'</span>'
      : '';
    var card = document.createElement('div');
    card.className = 'card';
    card.dataset.acc = r['明細帳'];
    card.innerHTML =
      '<div class="card-head">' +
        '<div><div class="card-code">'+r['明細帳']+'</div><div class="card-name">'+r['會計項目']+'</div></div>' +
        '<div class="badges"><span class="cat-badge" style="background:'+catColor+'">'+r['費用分類']+'</span>' + unitBadge + '</div>' +
      '</div>' +
      '<div class="card-row">' +
        '<div class="card-field"><div class="fl">本月餘額（累計）</div><div class="fv" style="color:#1565c0">'+fmt(r['本月餘額'])+'</div></div>' +
        '<div class="card-field"><div class="fl">累計動支率</div><div class="fv" style="color:'+rateColor(r['累計動支率'])+'">'+fmtPct(r['累計動支率'])+'</div></div>' +
      '</div>' +
      '<div class="card-row">' +
        '<div class="card-field"><div class="fl">本年度預算</div><div class="fv">'+fmt(r['本年度預算'])+'</div></div>' +
        '<div class="card-field"><div class="fl">剩餘可動支數</div><div class="fv" style="color:'+(parseFloat(r['剩餘可動支數'])<0?'#c62828':'#128048')+'">'+fmt(r['剩餘可動支數'])+'</div></div>' +
      '</div>' +
      '<div style="padding-top:8px">' +
        '<div style="display:flex;justify-content:space-between;font-size:11.5px;color:#666;margin-bottom:4px"><span>年度動支率</span><span style="color:'+yrc+';font-weight:700">'+fmtPct(yr)+'</span></div>' +
        '<div class="progress-bar"><div class="progress-fill" style="width:'+yrs+'%;background:'+yrc+'"></div></div>' +
      '</div>';
    cl.appendChild(card);
  });
  cl.querySelectorAll('[data-acc]').forEach(function(el) {
    el.addEventListener('click', function() { openSheet(this.dataset.acc); });
  });
  // Pager
  var pager = document.getElementById('pager');
  pager.innerHTML = '';
  var prevBtn = document.createElement('button');
  prevBtn.textContent = '◀ 上頁'; prevBtn.disabled = PAGE <= 1;
  prevBtn.addEventListener('click', function() { PAGE--; renderCards(); window.scrollTo(0,0); });
  var pinfo = document.createElement('span');
  pinfo.className = 'pinfo'; pinfo.textContent = PAGE + ' / ' + maxPage;
  var nextBtn = document.createElement('button');
  nextBtn.textContent = '下頁 ▶'; nextBtn.disabled = PAGE >= maxPage;
  nextBtn.addEventListener('click', function() { PAGE++; renderCards(); window.scrollTo(0,0); });
  pager.appendChild(prevBtn); pager.appendChild(pinfo); pager.appendChild(nextBtn);
}

// ─── Bottom Sheet ────────────────────────────────────────
function openSheet(acc) {
  var r = RAW.find(function(x) { return x['明細帳'] === acc; });
  if (!r) return;
  var catColor = CAT_COLORS[r['費用分類']] || '#546e7a';
  var uc = unitColor(r['預算主管單位']);
  var yr = parseFloat(r['年度動支率']);
  var yrs = isNaN(yr) ? 0 : Math.min(yr, 100);
  var yrc = rateColor(yr);
  var unitBadge = r['預算主管單位']
    ? '<span class="unit-badge" style="background:'+uc+'1a;color:'+uc+';margin-left:6px">'+r['預算主管單位']+'</span>'
    : '';
  document.getElementById('sheetBody').innerHTML =
    '<div class="sheet-title">['+r['明細帳']+'] '+r['會計項目']+'<span class="cat-badge" style="background:'+catColor+';margin-left:8px;font-size:11px">'+r['費用分類']+'</span>'+unitBadge+'</div>' +
    '<div class="sheet-group"><h4>本月數據</h4><div class="sheet-grid">' +
      '<div class="sheet-field"><div class="sl">本月餘額（累計）</div><div class="sv" style="color:#1565c0">'+fmt(r['本月餘額'])+'</div></div>' +
      '<div class="sheet-field"><div class="sl">本月動支數</div><div class="sv">'+fmt(r['本月動支數'])+'</div></div>' +
      '<div class="sheet-field"><div class="sl">本月預算數</div><div class="sv">'+fmt(r['本月預算數'])+'</div></div>' +
      '<div class="sheet-field"><div class="sl">至本月預算數累計</div><div class="sv">'+fmt(r['至本月預算數累計'])+'</div></div>' +
    '</div></div>' +
    '<div class="sheet-group"><h4>年度數據</h4><div class="sheet-grid">' +
      '<div class="sheet-field"><div class="sl">本年度預算</div><div class="sv">'+fmt(r['本年度預算'])+'</div></div>' +
      '<div class="sheet-field"><div class="sl">剩餘可動支數</div><div class="sv" style="color:'+(parseFloat(r['剩餘可動支數'])<0?'#c62828':'#128048')+'">'+fmt(r['剩餘可動支數'])+'</div></div>' +
      '<div class="sheet-field"><div class="sl">累計動支率</div><div class="sv" style="color:'+rateColor(r['累計動支率'])+'">'+fmtPct(r['累計動支率'])+'</div></div>' +
      '<div class="sheet-field"><div class="sl">年度動支率</div><div class="sv" style="color:'+yrc+'">'+fmtPct(yr)+'</div></div>' +
    '</div></div>' +
    '<div class="sheet-group"><h4>年度動支進度</h4>' +
      '<div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px"><span style="color:#666">已動支</span><span style="font-weight:700;color:'+yrc+'">'+fmtPct(yr)+'</span></div>' +
      '<div class="progress-bar" style="height:12px"><div class="progress-fill" style="width:'+yrs+'%;background:'+yrc+'"></div></div>' +
    '</div>';
  document.getElementById('overlay').className = 'overlay open';
}
document.getElementById('overlay').addEventListener('click', function(e) {
  if (e.target === this) this.className = 'overlay';
});

// ─── Summary Tab ─────────────────────────────────────────
function renderSummary() {
  // Overall
  var totalBudget = 0, totalBalance = 0, totalRemain = 0, totalYrBudget = 0;
  RAW.forEach(function(r) {
    totalBudget   += parseFloat(r['本年度預算']) || 0;
    totalBalance  += parseFloat(r['本月餘額'])    || 0;
    totalRemain   += parseFloat(r['剩餘可動支數']) || 0;
    totalYrBudget += parseFloat(r['年度預算數'])  || 0;
  });
  var overallRate = totalBudget > 0 ? (totalBalance / totalBudget * 100) : 0;
  var overall = document.getElementById('sumOverall');
  overall.innerHTML = '<h3>整體預算概況</h3>' +
    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">' +
      '<div class="stat-card"><div class="label">本年度預算</div><div class="value" style="font-size:15px">'+fmt(totalBudget)+'</div></div>' +
      '<div class="stat-card"><div class="label">本月餘額累計</div><div class="value" style="font-size:15px;color:#1565c0">'+fmt(totalBalance)+'</div></div>' +
      '<div class="stat-card"><div class="label">剩餘可動支數</div><div class="value" style="font-size:15px;color:#128048">'+fmt(totalRemain)+'</div></div>' +
      '<div class="stat-card"><div class="label">整體動支率</div><div class="value" style="font-size:15px;color:'+rateColor(overallRate)+'">'+overallRate.toFixed(2)+'%</div></div>' +
    '</div>';
  // By category
  var catData = {};
  RAW.forEach(function(r) {
    var k = r['費用分類'];
    if (!catData[k]) catData[k] = {budget:0, balance:0, remain:0};
    catData[k].budget  += parseFloat(r['本年度預算']) || 0;
    catData[k].balance += parseFloat(r['本月餘額'])   || 0;
    catData[k].remain  += parseFloat(r['剩餘可動支數']) || 0;
  });
  var sumCat = document.getElementById('sumCat');
  sumCat.innerHTML = '<h3>各費用分類動支率</h3>';
  Object.keys(catData).sort().forEach(function(k) {
    var d = catData[k];
    var rate = d.budget > 0 ? (d.balance / d.budget * 100) : 0;
    var rc = rateColor(rate);
    var div = document.createElement('div'); div.className = 'bar-row';
    div.innerHTML =
      '<div class="bar-label"><span style="color:'+(CAT_COLORS[k]||'#546e7a')+';font-weight:600">'+k+'</span>' +
      '<span style="color:'+rc+';font-weight:700">'+rate.toFixed(1)+'%</span></div>' +
      '<div class="bar-track"><div class="bar-fill" style="width:'+Math.min(rate,100)+'%;background:'+rc+'"></div></div>' +
      '<div style="font-size:11px;color:#999;margin-top:3px">預算:'+fmt(d.budget)+' ｜ 餘額:'+fmt(d.balance)+' ｜ 可動支:'+fmt(d.remain)+'</div>';
    sumCat.appendChild(div);
  });
  // By unit
  var unitData = {};
  RAW.forEach(function(r) {
    var u = r['預算主管單位']; if (!u) return;
    if (!unitData[u]) unitData[u] = {budget:0, balance:0};
    unitData[u].budget  += parseFloat(r['本年度預算']) || 0;
    unitData[u].balance += parseFloat(r['本月餘額'])   || 0;
  });
  var sumUnit = document.getElementById('sumUnit');
  sumUnit.innerHTML = '<h3>各科室動支率</h3>';
  Object.keys(unitData).sort(function(a,b) {
    var ra = unitData[a].budget>0 ? unitData[a].balance/unitData[a].budget : 0;
    var rb = unitData[b].budget>0 ? unitData[b].balance/unitData[b].budget : 0;
    return rb - ra;
  }).forEach(function(u) {
    var d = unitData[u];
    var rate = d.budget > 0 ? (d.balance / d.budget * 100) : 0;
    var uc = unitColor(u);
    var div = document.createElement('div'); div.className = 'bar-row';
    div.innerHTML =
      '<div class="bar-label"><span style="color:'+uc+';font-weight:600">'+u+'</span>' +
      '<span style="color:'+rateColor(rate)+';font-weight:700">'+rate.toFixed(1)+'%</span></div>' +
      '<div class="bar-track"><div class="bar-fill" style="width:'+Math.min(rate,100)+'%;background:'+uc+'"></div></div>';
    sumUnit.appendChild(div);
  });
}

// ─── Warning Tab ─────────────────────────────────────────
function renderWarning() {
  var warns = RAW.filter(function(r) {
    return parseFloat(r['年度動支率']) >= 70;
  }).sort(function(a,b) { return parseFloat(b['年度動支率']) - parseFloat(a['年度動支率']); });
  var wl = document.getElementById('warnList');
  if (warns.length === 0) {
    wl.innerHTML = '<div style="text-align:center;color:#888;padding:40px;font-size:14px">✅ 目前無高用率項目</div>';
    return;
  }
  warns.forEach(function(r) {
    var yr = parseFloat(r['年度動支率']);
    var yrc = rateColor(yr);
    var uc = unitColor(r['預算主管單位']);
    var unitBadge = r['預算主管單位']
      ? '<span class="unit-badge" style="background:'+uc+'1a;color:'+uc+';margin-left:6px">'+r['預算主管單位']+'</span>'
      : '';
    var card = document.createElement('div');
    card.className = 'warn-card ' + (yr >= 90 ? 'red' : 'orange');
    card.innerHTML =
      '<div style="display:flex;justify-content:space-between;align-items:flex-start">' +
        '<div><div style="font-size:12px;color:#888">'+r['明細帳']+'</div>' +
        '<div style="font-size:14px;font-weight:700;margin:3px 0">'+r['會計項目']+'</div>' +
        '<span class="cat-badge" style="background:'+(CAT_COLORS[r['費用分類']]||'#546e7a')+'">'+r['費用分類']+'</span>' + unitBadge + '</div>' +
        '<div style="text-align:right"><div style="font-size:20px;font-weight:800;color:'+yrc+'">'+fmtPct(yr)+'</div>' +
        '<div style="font-size:11px;color:#aaa">年度動支率</div></div>' +
      '</div>' +
      '<div class="progress-bar" style="margin-top:10px"><div class="progress-fill" style="width:'+Math.min(yr,100)+'%;background:'+yrc+'"></div></div>' +
      '<div style="font-size:11px;color:#999;margin-top:6px">年度預算:'+fmt(r['本年度預算'])+' ｜ 剩餘:'+fmt(r['剩餘可動支數'])+'</div>';
    wl.appendChild(card);
  });
}

// ─── Info Tab ────────────────────────────────────────────
function renderInfo() {
  var totalBudget = 0, totalBalance = 0, totalRemain = 0;
  RAW.forEach(function(r) {
    totalBudget  += parseFloat(r['本年度預算'])   || 0;
    totalBalance += parseFloat(r['本月餘額'])      || 0;
    totalRemain  += parseFloat(r['剩餘可動支數'])  || 0;
  });
  var uSet = {}; RAW.forEach(function(r) { if(r['預算主管單位']) uSet[r['預算主管單位']] = true; });
  var infoBox = document.getElementById('infoBox');
  infoBox.innerHTML = '<h3>資料來源資訊</h3>' +
    '<div class="info-row"><span>資料年度</span><span style="font-weight:600">'+META_YEAR+' 年</span></div>' +
    '<div class="info-row"><span>資料月份</span><span style="font-weight:600">'+META_MONTH+' 月</span></div>' +
    '<div class="info-row"><span>總筆數</span><span style="font-weight:600">'+RAW.length+' 筆</span></div>' +
    '<div class="info-row"><span>科室數量</span><span style="font-weight:600">'+Object.keys(uSet).length+' 個</span></div>' +
    '<div class="info-row"><span>本年度預算合計</span><span style="font-weight:600">'+fmt(totalBudget)+'</span></div>' +
    '<div class="info-row"><span>本月餘額累計</span><span style="font-weight:600;color:#1565c0">'+fmt(totalBalance)+'</span></div>' +
    '<div class="info-row"><span>剩餘可動支數合計</span><span style="font-weight:600;color:#128048">'+fmt(totalRemain)+'</span></div>' +
    '<div class="info-row"><span>資料來源</span><span style="font-size:12px">TAIS AS400 匯出</span></div>' +
    '<div class="info-row"><span>App版本</span><span>v8.0</span></div>';
}

// ─── Charts Tab ──────────────────────────────────────────
function renderCharts() {
  var root = document.getElementById('chartsRoot');

  // KPI 卡片（不需 Chart.js）
  var totalBudget = 0, totalBalance = 0, totalRemain = 0;
  RAW.forEach(function(r) {
    totalBudget  += parseFloat(r['本年度預算'])  || 0;
    totalBalance += parseFloat(r['本月餘額'])     || 0;
    totalRemain  += parseFloat(r['剩餘可動支數']) || 0;
  });
  var overallRate = totalBudget > 0 ? (totalBalance / totalBudget * 100) : 0;
  var kpiSection = document.createElement('div'); kpiSection.className = 'chart-section';
  kpiSection.innerHTML = '<h3>📌 KPI 總覽</h3>' +
    '<div class="kpi-grid">' +
      '<div class="kpi-card" style="background:#e8f5e9"><div class="kl">本年度預算</div><div class="kv" style="color:#1b5e20">'+Math.round(totalBudget/10000)+'萬</div></div>' +
      '<div class="kpi-card" style="background:#e3f2fd"><div class="kl">累計動支</div><div class="kv" style="color:#0d47a1">'+Math.round(totalBalance/10000)+'萬</div></div>' +
      '<div class="kpi-card" style="background:'+(overallRate>=90?'#ffebee':overallRate>=70?'#fff3e0':'#f1f8e9')+'"><div class="kl">整體動支率</div><div class="kv" style="color:'+rateColor(overallRate)+'">'+overallRate.toFixed(1)+'%</div></div>' +
    '</div>';
  root.appendChild(kpiSection);

  // 動態載入 Chart.js
  if (typeof Chart === 'undefined') {
    var s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js';
    s.onload = function() { drawCharts(root, totalBudget, totalBalance); };
    document.head.appendChild(s);
  } else {
    drawCharts(root, totalBudget, totalBalance);
  }
}

function drawCharts(root, totalBudget, totalBalance) {
  // 費用分類資料
  var catData = {};
  RAW.forEach(function(r) {
    var k = r['費用分類'];
    if (!catData[k]) catData[k] = {budget:0, balance:0, remain:0};
    catData[k].budget  += parseFloat(r['本年度預算'])   || 0;
    catData[k].balance += parseFloat(r['本月餘額'])      || 0;
    catData[k].remain  += parseFloat(r['剩餘可動支數']) || 0;
  });
  var catKeys = Object.keys(catData).sort();

  // 科室資料
  var unitData = {};
  RAW.forEach(function(r) {
    var u = r['預算主管單位']; if (!u) return;
    if (!unitData[u]) unitData[u] = {budget:0, balance:0};
    unitData[u].budget  += parseFloat(r['本年度預算']) || 0;
    unitData[u].balance += parseFloat(r['本月餘額'])   || 0;
  });
  var unitKeys = Object.keys(unitData).sort(function(a,b) {
    var ra = unitData[a].budget>0 ? unitData[a].balance/unitData[a].budget : 0;
    var rb = unitData[b].budget>0 ? unitData[b].balance/unitData[b].budget : 0;
    return rb - ra;
  });

  // 圖表 1：甜甜圈（費用分類年度預算）
  var sec1 = document.createElement('div'); sec1.className = 'chart-section';
  sec1.innerHTML = '<h3>🍩 費用分類預算分配</h3><div style="height:250px;position:relative"><canvas id="c_donut"></canvas></div>';
  root.appendChild(sec1);
  new Chart(document.getElementById('c_donut'), {
    type: 'doughnut',
    data: {
      labels: catKeys,
      datasets: [{ data: catKeys.map(function(k){return Math.round(catData[k].budget/10000);}),
        backgroundColor: catKeys.map(function(k){return CAT_COLORS[k]||'#546e7a';}),
        borderWidth: 2, borderColor: '#fff' }]
    },
    options: { maintainAspectRatio: false, plugins: { legend: { position: 'right', labels: { font: {size:11}, boxWidth:12 } } } }
  });

  // 圖表 2：費用分類橫條（年度動支率）
  var sec2 = document.createElement('div'); sec2.className = 'chart-section';
  sec2.innerHTML = '<h3>📊 費用分類年度動支率</h3><div style="height:220px;position:relative"><canvas id="c_cat"></canvas></div>';
  root.appendChild(sec2);
  var catRates = catKeys.map(function(k){ return catData[k].budget>0 ? Math.round(catData[k].balance/catData[k].budget*100*100)/100 : 0; });
  new Chart(document.getElementById('c_cat'), {
    type: 'bar',
    data: {
      labels: catKeys,
      datasets: [{ label: '年度動支率(%)', data: catRates,
        backgroundColor: catRates.map(function(r){ return r>=90?'#c62828':r>=70?'#e07b00':'#2e7d32'; }),
        borderRadius: 4 }]
    },
    options: { indexAxis:'y', maintainAspectRatio:false,
      plugins:{ legend:{display:false} },
      scales:{ x:{ max:100, ticks:{callback:function(v){return v+'%';}} } } }
  });

  // 圖表 3：科室橫條（動支率）
  var unitH = Math.max(260, unitKeys.length * 26);
  var sec3 = document.createElement('div'); sec3.className = 'chart-section';
  sec3.innerHTML = '<h3>🏢 各科室年度動支率</h3><div style="height:'+unitH+'px;position:relative"><canvas id="c_unit"></canvas></div>';
  root.appendChild(sec3);
  var unitRates = unitKeys.map(function(u){ return unitData[u].budget>0 ? Math.round(unitData[u].balance/unitData[u].budget*100*100)/100 : 0; });
  new Chart(document.getElementById('c_unit'), {
    type: 'bar',
    data: {
      labels: unitKeys,
      datasets: [{ label: '年度動支率(%)', data: unitRates,
        backgroundColor: unitKeys.map(function(u){ return unitColor(u); }),
        borderRadius: 4 }]
    },
    options: { indexAxis:'y', maintainAspectRatio:false,
      plugins:{ legend:{display:false} },
      scales:{ x:{ max:100, ticks:{callback:function(v){return v+'%';}} } } }
  });

  // 圖表 4：堆疊橫條（已動支 vs 剩餘）
  var sec4 = document.createElement('div'); sec4.className = 'chart-section';
  sec4.innerHTML = '<h3>📦 費用分類「已動支」vs「剩餘可動支」（萬元）</h3><div style="height:220px;position:relative"><canvas id="c_stack"></canvas></div>';
  root.appendChild(sec4);
  new Chart(document.getElementById('c_stack'), {
    type: 'bar',
    data: {
      labels: catKeys,
      datasets: [
        { label:'已動支(萬)', data:catKeys.map(function(k){return Math.round(catData[k].balance/10000);}) , backgroundColor:'#1565c0', borderRadius:2 },
        { label:'剩餘可動支(萬)', data:catKeys.map(function(k){return Math.round(Math.max(catData[k].remain,0)/10000);}) , backgroundColor:'#c8e6c9', borderRadius:2 }
      ]
    },
    options: { indexAxis:'y', maintainAspectRatio:false,
      plugins:{ legend:{position:'top'} },
      scales:{ x:{ stacked:true }, y:{ stacked:true } } }
  });
}

// ─── Init ────────────────────────────────────────────────
renderCards();
</script>
