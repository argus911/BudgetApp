<title>預算管理｜中華電信彰化營運處</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--green:#128048;--red:#c62828;--orange:#e07b00;--blue:#1565c0;--bg:#f4f6f9;--text:#1a1a1a;--sub:#555;--border:#e0e0e0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:80px}
.header{background:linear-gradient(135deg,#0d4f2e,#128048,#1a9958);color:#fff;padding:env(safe-area-inset-top,12px) 16px 12px;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.h1{font-size:17px;font-weight:700;letter-spacing:.5px}
.header-sub{font-size:12px;opacity:.85;margin-top:2px;display:flex;align-items:center;gap:8px}
.badge{background:rgba(255,255,255,.25);border-radius:10px;padding:1px 8px;font-size:11px;font-weight:600}
.tab-bar{display:flex;background:#fff;border-bottom:1px solid var(--border);position:sticky;top:56px;z-index:99;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.tab-bar::-webkit-scrollbar{display:none}
.tab-btn{flex:none;padding:10px 14px;font-size:13px;font-weight:500;color:var(--sub);border:none;background:none;cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent;transition:.2s}
.tab-btn.active{color:var(--green);border-bottom-color:var(--green);font-weight:700}
.tab-content{display:none;padding:12px 12px 16px}
.tab-content.active{display:block}
.filter-card{background:#fff;border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.search-box{width:100%;padding:9px 12px;border:1.5px solid var(--border);border-radius:10px;font-size:14px;outline:none}
.search-box:focus{border-color:var(--green)}
.chips-label{font-size:12px;color:var(--sub);margin:10px 0 6px;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:5px 12px;border-radius:20px;font-size:12px;font-weight:500;cursor:pointer;border:1.5px solid var(--border);background:#fff;color:var(--sub);transition:.15s}
.chip.active-cat{background:var(--green);color:#fff;border-color:var(--green)}
.chip.active-unit{background:#1565c0;color:#fff;border-color:#1565c0}
.active-filters{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.filter-pill{padding:3px 10px;border-radius:12px;font-size:11px;font-weight:600}
.fp-cat{background:#e8f5e9;color:#1b5e20}
.fp-unit{background:#e3f2fd;color:#0d47a1}
.fp-kw{background:#fff3e0;color:#e65100}
.notice{background:#fff8e1;border:1px solid #ffe082;border-radius:10px;padding:10px 12px;font-size:12px;color:#6d4c00;margin-bottom:10px;line-height:1.5}
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.stat-card{background:#fff;border-radius:12px;padding:12px;box-shadow:0 1px 4px rgba(0,0,0,.08);text-align:center}
.stat-label{font-size:11px;color:var(--sub);margin-bottom:4px}
.stat-value{font-size:17px;font-weight:700}
.results-count{font-size:13px;color:var(--sub);margin-bottom:8px;padding-left:2px}
.card{background:#fff;border-radius:14px;padding:14px;margin-bottom:10px;box-shadow:0 1px 4px rgba(0,0,0,.08);cursor:pointer;transition:.15s;border-left:4px solid transparent}
.card:active{transform:scale(.98);background:#f9fdf9}
.card-code{font-size:11px;color:var(--sub);margin-bottom:2px}
.card-title{font-size:14px;font-weight:600;line-height:1.3;margin-bottom:6px}
.badges-row{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:10px}
.cat-badge{padding:2px 8px;border-radius:10px;font-size:10px;font-weight:600}
.unit-badge{padding:2px 8px;border-radius:10px;font-size:10px;font-weight:600}
.card-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.card-field{background:#f8f9fa;border-radius:8px;padding:8px;text-align:center}
.field-label{font-size:10px;color:var(--sub);margin-bottom:3px}
.field-value{font-size:15px;font-weight:700}
.progress-wrap{background:#f0f0f0;border-radius:6px;height:8px;overflow:hidden;margin-top:6px}
.progress-bar{height:100%;border-radius:6px;transition:width .4s}
.rate-row{display:flex;align-items:center;gap:8px;font-size:13px}
.rate-label{color:var(--sub);font-size:12px;min-width:52px}
.pagination{display:flex;justify-content:center;gap:8px;padding:12px 0;flex-wrap:wrap}
.page-btn{padding:6px 14px;border-radius:20px;font-size:13px;font-weight:500;cursor:pointer;border:1.5px solid var(--border);background:#fff;color:var(--sub)}
.page-btn.active-page{background:var(--green);color:#fff;border-color:var(--green)}
.summary-card{background:#fff;border-radius:14px;padding:16px;margin-bottom:12px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.summary-title{font-size:15px;font-weight:700;margin-bottom:12px;color:var(--green)}
.bar-row{margin-bottom:12px}
.bar-label{display:flex;justify-content:space-between;align-items:center;font-size:12px;margin-bottom:4px;gap:6px}
.bar-track{background:#f0f0f0;border-radius:6px;height:10px;overflow:hidden}
.bar-fill{height:100%;border-radius:6px}
.warning-card{background:#fff;border-radius:14px;padding:14px;margin-bottom:10px;box-shadow:0 1px 4px rgba(0,0,0,.08);border-left:4px solid var(--orange)}
.warning-card.critical{border-left-color:var(--red)}
.info-card{background:#fff;border-radius:14px;padding:16px;margin-bottom:12px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.info-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #f0f0f0;font-size:14px}
.info-row:last-child{border-bottom:none}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;opacity:0;pointer-events:none;transition:.25s}
.overlay.open{opacity:1;pointer-events:all}
.sheet{position:fixed;bottom:0;left:0;right:0;background:#fff;border-radius:20px 20px 0 0;max-height:80vh;overflow-y:auto;transform:translateY(100%);transition:.3s cubic-bezier(.4,0,.2,1);padding:20px 16px env(safe-area-inset-bottom,16px);z-index:201}
.sheet.open{transform:translateY(0)}
.sheet-handle{width:40px;height:4px;background:#ddd;border-radius:2px;margin:0 auto 16px}
.sheet-title{font-size:17px;font-weight:700;margin-bottom:4px}
.sheet-sub{font-size:13px;color:var(--sub);margin-bottom:14px;display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.sheet-section{font-size:12px;font-weight:700;color:var(--sub);margin:14px 0 8px}
.sheet-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.sheet-field{background:#f8f9fa;border-radius:10px;padding:10px;text-align:center}
.sheet-field .label{font-size:11px;color:var(--sub);margin-bottom:4px}
.sheet-field .value{font-size:16px;font-weight:700}
.btm-nav{display:flex;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--border);padding:6px 0 env(safe-area-inset-bottom,0);z-index:100}
.btm-btn{flex:1;display:flex;flex-direction:column;align-items:center;padding:4px 2px;font-size:10px;color:var(--sub);cursor:pointer;border:none;background:none;gap:2px}
.btm-btn.active{color:var(--green)}
.btm-btn svg{width:22px;height:22px}
.kpi-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:16px}
.kpi-card{background:#fff;border-radius:12px;padding:12px 8px;box-shadow:0 1px 4px rgba(0,0,0,.08);text-align:center}
.kpi-label{font-size:10px;color:var(--sub);margin-bottom:6px;line-height:1.3}
.kpi-value{font-size:15px;font-weight:700}
.chart-card{background:#fff;border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 1px 4px rgba(0,0,0,.08)}

RAW.forEach(function(r){if(r['預算主管單位'])unitSet[r['預算主管單位']]=true;});

var filterCat='all',filterUnit='all',filterKw='',curPage=1,PAGE_SIZE=20;
var summaryDone=false,warningDone=false,chartsDone=false;
function fmt(n){if(n===''||n===null||n===undefined)return '—';return Number(n).toLocaleString('zh-TW');}
function rc(r){return r>=90?'#c62828':r>=70?'#e07b00':'#128048';}
function switchTab(name){
  document.querySelectorAll('.tab-content').forEach(function(el){el.classList.remove('active');});
  document.getElementById('tab-'+name).classList.add('active');
  document.querySelectorAll('.tab-btn,.btm-btn').forEach(function(b){b.classList.toggle('active',b.dataset.tab===name);});
  if(name==='summary'&&!summaryDone){renderSummary();summaryDone=true;}
  if(name==='warning'&&!warningDone){renderWarning();warningDone=true;}
  if(name==='charts'&&!chartsDone){renderCharts();}
  if(name==='info'&&!document.getElementById('infoContent').innerHTML){renderInfo();}
}
document.getElementById('topTabBar').addEventListener('click',function(e){var b=e.target.closest('.tab-btn');if(b)switchTab(b.dataset.tab);});
document.getElementById('btmNav').addEventListener('click',function(e){var b=e.target.closest('.btm-btn');if(b)switchTab(b.dataset.tab);});
(function(){
  var cc=document.getElementById('catChips');
  ['all','人事費','業務外包','業務成本','專案建置成本','設備及折舊','管銷費用','其他'].forEach(function(c){
    var btn=document.createElement('button');btn.className='chip'+(c==='all'?' active-cat':'');btn.dataset.cat=c;btn.textContent=c==='all'?'全部':c;
    btn.addEventListener('click',function(){filterCat=c;curPage=1;cc.querySelectorAll('.chip').forEach(function(x){x.classList.remove('active-cat');});btn.classList.add('active-cat');applyFilter();});
    cc.appendChild(btn);
  });
  var uc=document.getElementById('unitChips');
  ['all'].concat(UNITS).forEach(function(u){
    var btn=document.createElement('button');btn.className='chip'+(u==='all'?' active-unit':'');btn.dataset.unit=u;btn.textContent=u==='all'?'全部':u;
    btn.addEventListener('click',function(){filterUnit=u;curPage=1;uc.querySelectorAll('.chip').forEach(function(x){x.classList.remove('active-unit');});btn.classList.add('active-unit');applyFilter();});
    uc.appendChild(btn);
  });
})();
document.getElementById('searchBox').addEventListener('input',function(){filterKw=this.value.trim();curPage=1;applyFilter();});
function getFiltered(){
  return RAW.filter(function(r){
    if(filterCat!=='all'&&r['費用分類']!==filterCat)return false;
    if(filterUnit!=='all'&&r['預算主管單位']!==filterUnit)return false;
    if(filterKw){var kl=filterKw.toLowerCase();if(!r['明細帳'].toLowerCase().includes(kl)&&!r['會計項目'].toLowerCase().includes(kl))return false;}
    return true;
  });
}
function applyFilter(){
  var filtered=getFiltered();
  document.getElementById('total-badge').textContent=filtered.length+' 筆';
  document.getElementById('resultsCount').textContent='共 '+filtered.length+' 筆';
  renderActiveFilters();renderStats(filtered);renderPage(filtered,curPage);renderPagination(filtered);
}
function renderActiveFilters(){
  var af=document.getElementById('activeFilters');af.innerHTML='';
  if(filterCat!=='all'){var p=document.createElement('span');p.className='filter-pill fp-cat';p.textContent='費用分類：'+filterCat;af.appendChild(p);}
  if(filterUnit!=='all'){var p2=document.createElement('span');p2.className='filter-pill fp-unit';p2.textContent='科室：'+filterUnit;af.appendChild(p2);}
  if(filterKw){var p3=document.createElement('span');p3.className='filter-pill fp-kw';p3.textContent='關鍵字：'+filterKw;af.appendChild(p3);}
}
function renderStats(filtered){
  var totBal=0,totBudMon=0,totBudYr=0,totRem=0;
  filtered.forEach(function(r){totBal+=Number(r['本月餘額'])||0;totBudMon+=Number(r['本月預算數'])||0;totBudYr+=Number(r['本年度預算'])||0;totRem+=Number(r['剩餘可動支數'])||0;});
  document.getElementById('statsGrid').innerHTML='<div class="stat-card"><div class="stat-label">本月餘額（累計）</div><div class="stat-value" style="color:#1565c0">'+fmt(Math.round(totBal))+'</div></div>'
    +'<div class="stat-card"><div class="stat-label">本月預算數</div><div class="stat-value">'+fmt(Math.round(totBudMon))+'</div></div>'
    +'<div class="stat-card"><div class="stat-label">本年度預算</div><div class="stat-value">'+fmt(Math.round(totBudYr))+'</div></div>'
    +'<div class="stat-card"><div class="stat-label">剩餘可動支數</div><div class="stat-value" style="color:'+(totRem<0?'#c62828':'#128048')+'">'+fmt(Math.round(totRem))+'</div></div>';
}
function renderPage(filtered,page){
  var cl=document.getElementById('cardList');cl.innerHTML='';
  filtered.slice((page-1)*PAGE_SIZE,page*PAGE_SIZE).forEach(function(r){
    var catC=CAT_COLORS[r['費用分類']]||CAT_COLORS['其他'];
    var uc=unitColorMap[r['預算主管單位']]||'#128048';
    var yr=Number(r['年度動支率'])||0;
    var ac=Number(r['累計動支率'])||0;
    var div=document.createElement('div');div.className='card';div.style.borderLeftColor=rc(yr);div.dataset.acc=r['明細帳'];
    var unitBadge=r['預算主管單位']?'<span class="unit-badge" style="background:'+uc+'1a;color:'+uc+'">'+r['預算主管單位']+'</span>':'';
    div.innerHTML='<div class="card-code">'+r['明細帳']+'</div>'
      +'<div class="card-title">'+r['會計項目']+'</div>'
      +'<div class="badges-row"><span class="cat-badge" style="background:'+catC.bg+';color:'+catC.text+'">'+r['費用分類']+'</span>'+unitBadge+'</div>'
      +'<div class="card-grid">'
      +'<div class="card-field"><div class="field-label">本月餘額（累計）</div><div class="field-value" style="color:#1565c0">'+fmt(r['本月餘額'])+'</div></div>'
      +'<div class="card-field"><div class="field-label">累計動支率</div><div class="field-value" style="color:'+rc(ac)+'">'+ac+'%</div></div>'
      +'<div class="card-field"><div class="field-label">本年度預算</div><div class="field-value">'+fmt(r['本年度預算'])+'</div></div>'
      +'<div class="card-field"><div class="field-label">剩餘可動支數</div><div class="field-value" style="color:'+(Number(r['剩餘可動支數'])<0?'#c62828':'#128048')+'">'+fmt(r['剩餘可動支數'])+'</div></div>'
      +'</div>'
      +'<div class="rate-row"><span class="rate-label">年度動支率</span><div class="progress-wrap" style="flex:1"><div class="progress-bar" style="width:'+Math.min(yr,100)+'%;background:'+rc(yr)+'"></div></div><span style="color:'+rc(yr)+';font-weight:700;font-size:13px;margin-left:6px">'+yr+'%</span></div>';

    cl.appendChild(div);
  });

function renderPagination(filtered){
  var pg=document.getElementById('pagination');pg.innerHTML='';
  var totalPages=Math.ceil(filtered.length/PAGE_SIZE);if(totalPages<=1)return;
  for(var i=1;i<=totalPages;i++){
    var btn=document.createElement('button');btn.className='page-btn'+(i===curPage?' active-page':'');btn.textContent=i;btn.dataset.p=i;
    btn.addEventListener('click',function(){curPage=parseInt(this.dataset.p);renderPage(getFiltered(),curPage);renderPagination(getFiltered());window.scrollTo(0,0);});
    pg.appendChild(btn);
  }
}

function buildCharts(root){
  var catMap={},unitMap={};
  RAW.forEach(function(r){
    var c=r['費用分類'];if(!catMap[c])catMap[c]={budget:0,balance:0,remain:0};
    catMap[c].budget+=Number(r['本年度預算'])||0;catMap[c].balance+=Number(r['本月餘額'])||0;catMap[c].remain+=Number(r['剩餘可動支數'])||0;
    if(r['預算主管單位']){var u=r['預算主管單位'];if(!unitMap[u])unitMap[u]={budget:0,balance:0};unitMap[u].budget+=Number(r['本年度預算'])||0;unitMap[u].balance+=Number(r['本月餘額'])||0;}
  });
  var totalBudget=RAW.reduce(function(s,r){return s+(Number(r['本年度預算'])||0);},0);
  var totalBalance=RAW.reduce(function(s,r){return s+(Number(r['本月餘額'])||0);},0);
  var overallRate=totalBudget>0?Math.round(totalBalance/totalBudget*1000)/10:0;
  var catKeys=Object.keys(catMap).sort();
  var unitKeys=Object.keys(unitMap).sort(function(a,b){
    var ra=unitMap[a].budget>0?unitMap[a].balance/unitMap[a].budget:0;
    var rb=unitMap[b].budget>0?unitMap[b].balance/unitMap[b].budget:0;
    return rb-ra;
  });
  root.innerHTML='<div class="kpi-grid">'
    +'<div class="kpi-card"><div class="kpi-label">本年度預算</div><div class="kpi-value">'+fmt(Math.round(totalBudget/10000))+'<small style="font-size:10px;display:block;font-weight:400">萬元</small></div></div>'
    +'<div class="kpi-card"><div class="kpi-label">累計動支</div><div class="kpi-value" style="color:#1565c0">'+fmt(Math.round(totalBalance/10000))+'<small style="font-size:10px;display:block;font-weight:400">萬元</small></div></div>'
    +'<div class="kpi-card"><div class="kpi-label">整體動支率</div><div class="kpi-value" style="color:'+rc(overallRate)+'">'+overallRate+'%</div></div>'
    +'</div>'
    +'<div class="chart-card"><div class="chart-title">🍩 費用分類年度預算分配</div><div style="position:relative;height:260px"><canvas id="donutChart"></canvas></div></div>'
    +'<div class="chart-card"><div class="chart-title">📊 費用分類年度動支率</div><div style="position:relative;height:'+Math.max(200,catKeys.length*44)+'px"><canvas id="catBarChart"></canvas></div></div>'
    +'<div class="chart-card"><div class="chart-title">🏢 科室年度動支率（由高→低）</div><div style="position:relative;height:'+Math.max(200,unitKeys.length*44)+'px"><canvas id="unitBarChart"></canvas></div></div>'
    +'<div class="chart-card"><div class="chart-title">📦 費用分類 累計動支 vs 剩餘（萬元）</div><div style="position:relative;height:'+Math.max(200,catKeys.length*44)+'px"><canvas id="stackedChart"></canvas></div></div>';
  var donutColors=['#128048','#1565c0','#e65100','#7b1fa2','#c62828','#00838f','#558b2f'];
  new Chart(document.getElementById('donutChart'),{type:'doughnut',data:{labels:catKeys,datasets:[{data:catKeys.map(function(c){return Math.round(catMap[c].budget/10000);}),backgroundColor:donutColors,borderWidth:2}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{font:{size:11},boxWidth:12,padding:8}},tooltip:{callbacks:{label:function(ctx){return ctx.label+': '+ctx.parsed.toLocaleString('zh-TW')+'萬元';}}}}}});
  var catRates=catKeys.map(function(c){return catMap[c].budget>0?Math.round(catMap[c].balance/catMap[c].budget*1000)/10:0;});
  var catBgColors=catRates.map(function(r){return r>=90?'#c62828':r>=70?'#e07b00':'#128048';});
  new Chart(document.getElementById('catBarChart'),{type:'bar',data:{labels:catKeys,datasets:[{label:'年度動支率',data:catRates,backgroundColor:catBgColors,borderRadius:4}]},options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,scales:{x:{max:100,ticks:{callback:function(v){return v+'%';}}}},plugins:{legend:{display:false},tooltip:{callbacks:{label:function(ctx){return ctx.parsed.x+'%';}}}}}});
  var unitRates=unitKeys.map(function(u){return unitMap[u].budget>0?Math.round(unitMap[u].balance/unitMap[u].budget*1000)/10:0;});
  var unitBgColors=unitKeys.map(function(u){return unitColorMap[u]||'#128048';});
  new Chart(document.getElementById('unitBarChart'),{type:'bar',data:{labels:unitKeys,datasets:[{label:'年度動支率',data:unitRates,backgroundColor:unitBgColors,borderRadius:4}]},options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,scales:{x:{max:100,ticks:{callback:function(v){return v+'%';}}}},plugins:{legend:{display:false},tooltip:{callbacks:{label:function(ctx){return ctx.parsed.x+'%';}}}}}});
  var balData=catKeys.map(function(c){return Math.round(catMap[c].balance/10000);});
  var remData=catKeys.map(function(c){return Math.max(0,Math.round(catMap[c].remain/10000));});
  new Chart(document.getElementById('stackedChart'),{type:'bar',data:{labels:catKeys,datasets:[{label:'累計動支',data:balData,backgroundColor:'#1565c0',borderRadius:4},{label:'剩餘可動支',data:remData,backgroundColor:'#a5d6a7',borderRadius:4}]},options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,scales:{x:{stacked:true,ticks:{callback:function(v){return v+'萬';}}},y:{stacked:true}},plugins:{legend:{position:'bottom',labels:{font:{size:11},boxWidth:12}},tooltip:{callbacks:{label:function(ctx){return ctx.dataset.label+': '+ctx.parsed.x.toLocaleString('zh-TW')+'萬元';}}}}}});
}
