<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;background:#f0f7f0;color:#1a2e1a;padding-bottom:80px}
.header{background:linear-gradient(135deg,#0c6944,#128048);color:#fff;padding:12px 16px 10px;padding-top:calc(12px + env(safe-area-inset-top));position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,0.15)}
.header-row{display:flex;align-items:center;justify-content:space-between}
.header-title{font-size:20px;font-weight:700;letter-spacing:0.5px}
.header-sub{font-size:11px;opacity:0.85;margin-top:2px}
.badge{background:rgba(255,255,255,0.25);border-radius:12px;padding:4px 10px;font-size:12px;font-weight:700;white-space:nowrap}
.top-tabs{background:#fff;border-bottom:1px solid #e8f5e9;display:flex;position:sticky;top:calc(56px + env(safe-area-inset-top));z-index:99;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.top-tabs::-webkit-scrollbar{display:none}
.tab-btn{flex:0 0 auto;padding:10px 14px;font-size:12px;font-weight:600;color:#666;border:none;background:none;cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent;transition:all .2s}
.tab-btn.active{color:#128048;border-bottom-color:#128048}
.tab-content{display:none;padding:12px 12px 8px}
.tab-content.active{display:block}
.filter-card{background:#fff;border-radius:16px;padding:14px;margin-bottom:10px;box-shadow:0 1px 6px rgba(0,0,0,0.08)}
input[type=search]{width:100%;padding:9px 14px;border:1.5px solid #e0e0e0;border-radius:24px;font-size:14px;outline:none;background:#fafafa}
input[type=search]:focus{border-color:#128048}
.chips-label{font-size:11px;font-weight:700;color:#888;margin:10px 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:5px 12px;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;border:1.5px solid #e0e0e0;background:#fff;color:#555;transition:all .15s}
.chip.active{background:#128048;color:#fff;border-color:#128048}
.active-pills{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px}
.pill{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:14px;font-size:11px;font-weight:600}
.pill-cat{background:#e8f5e9;color:#1b5e20}
.pill-unit{background:#e3f2fd;color:#1565c0}
.pill-search{background:#fff8e1;color:#e65100}
.notice{background:#fff8e1;border:1px solid #ffe082;border-radius:10px;padding:9px 12px;font-size:11px;color:#e65100;margin-bottom:10px;line-height:1.5}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.stat-card{background:#fff;border-radius:14px;padding:12px;box-shadow:0 1px 5px rgba(0,0,0,0.07);text-align:center}
.stat-label{font-size:10px;color:#888;font-weight:600;margin-bottom:4px}
.stat-val{font-size:18px;font-weight:700;color:#128048}
.result-count{font-size:12px;color:#888;margin-bottom:8px;font-weight:600}
.card{background:#fff;border-radius:16px;padding:14px;margin-bottom:10px;box-shadow:0 1px 6px rgba(0,0,0,0.08);cursor:pointer;transition:transform .1s}
.card:active{transform:scale(0.98)}
.card-top{display:flex;flex-wrap:wrap;align-items:flex-start;gap:5px;margin-bottom:10px}
.acc-code{font-size:11px;font-weight:700;color:#555;background:#f5f5f5;padding:2px 7px;border-radius:8px}
.acc-name{font-size:13px;font-weight:700;color:#1a2e1a;flex:1;min-width:120px}
.cat-badge{font-size:10px;font-weight:700;padding:2px 8px;border-radius:10px}
.unit-badge{font-size:10px;font-weight:700;padding:2px 8px;border-radius:10px}
.card-nums{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.num-item{background:#f8fffe;border-radius:10px;padding:8px}
.num-label{font-size:9px;color:#888;font-weight:600;margin-bottom:3px}
.num-val{font-size:14px;font-weight:700}
.blue{color:#1565c0}.green{color:#128048}.red{color:#c62828}.orange{color:#e07b00}
.prog-wrap{margin-top:4px}
.prog-label{font-size:10px;color:#888;margin-bottom:3px;display:flex;justify-content:space-between}
.prog-bar-bg{background:#e8f5e9;border-radius:4px;height:6px;overflow:hidden}
.prog-bar{height:6px;border-radius:4px;transition:width .5s}
.pg-grn{background:#128048}.pg-org{background:#e07b00}.pg-red{background:#c62828}
.pager{display:flex;justify-content:center;align-items:center;gap:12px;padding:10px 0;font-size:13px}
.pager-btn{padding:6px 14px;background:#128048;color:#fff;border:none;border-radius:20px;font-size:13px;font-weight:600;cursor:pointer}
.pager-btn:disabled{background:#ccc;cursor:default}
.summary-card{background:#fff;border-radius:16px;padding:14px;margin-bottom:10px;box-shadow:0 1px 6px rgba(0,0,0,0.08)}

.bar-item{margin-bottom:12px}

.bar-fill{height:10px;border-radius:6px}
.chart-kpi-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:16px}
.kpi-card{background:#fff;border-radius:14px;padding:12px 8px;box-shadow:0 1px 6px rgba(0,0,0,0.08);text-align:center}
.kpi-label{font-size:9px;color:#888;font-weight:600;margin-bottom:4px}
.kpi-value{font-size:14px;font-weight:700;line-height:1.2}

.nav-icon{font-size:18px;line-height:1}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,0);z-index:200;pointer-events:none;transition:background .3s}

.sheet-item-label{font-size:9px;color:#888;font-weight:600;margin-bottom:3px}
.sheet-item-val{font-size:15px;font-weight:700}

function switchTab(t){
  document.querySelectorAll('.tab-btn,.nav-btn').forEach(function(b){ b.classList.toggle('active',b.dataset.tab===t); });
  document.querySelectorAll('.tab-content').forEach(function(d){ d.classList.toggle('active',d.id==='tab-'+t); });
  if(t==='summary'&&!_summaryDone){ renderSummary(); _summaryDone=true; }
  if(t==='warning'&&!_warningDone){ renderWarning(); _warningDone=true; }
  if(t==='charts'&&!_chartsReady){ renderCharts(); }
}

function buildChips(){
  var cc = document.getElementById('catChips');
  CATS.forEach(function(c){
    var btn=document.createElement('button'); btn.className='chip'+(c==='all'?' active':'');
    btn.textContent=c==='all'?'全部':c; btn.dataset.cat=c;
    btn.addEventListener('click',function(){
      curCat=this.dataset.cat; curPage=1;
      document.querySelectorAll('#catChips .chip').forEach(function(b){ b.classList.toggle('active',b.dataset.cat===curCat); });
      render();
    });
    cc.appendChild(btn);
  });
  var uc=document.getElementById('unitChips');
  UNITS.forEach(function(u){
    var btn=document.createElement('button'); btn.className='chip'+(u==='all'?' active':'');
    btn.textContent=u==='all'?'全部':u; btn.dataset.unit=u;
    if(u!=='all'){ btn.style.borderColor=UNIT_PALETTE[u]; }
    btn.addEventListener('click',function(){
      curUnit=this.dataset.unit; curPage=1;
      document.querySelectorAll('#unitChips .chip').forEach(function(b){ b.classList.toggle('active',b.dataset.unit===curUnit); });
      render();
    });
    uc.appendChild(btn);
  });
}

function getFiltered(){
  return RAW.filter(function(r){
    if(curCat!=='all'&&r['費用分類']!==curCat) return false;
    if(curUnit!=='all'&&r['預算主管單位']!==curUnit) return false;
    if(curSearch&&!(r['明細帳'].includes(curSearch)||r['會計項目'].includes(curSearch))) return false;
    return true;
  });
}

function fmt(v){
  if(v===''||v===null||v===undefined) return '—';
  if(typeof v==='number') return v.toLocaleString('zh-TW');
  return v;
}
function rateColor(r){
  if(r===''||r===null||r===undefined) return 'green';
  var n=parseFloat(r); if(isNaN(n)) return 'green';
  return n>=90?'red':n>=70?'orange':'green';
}

function render(){
  var filtered=getFiltered();
  document.getElementById('hdrBadge').textContent=RAW.length+' 筆';
  document.getElementById('resultCount').textContent='共 '+filtered.length+' 筆';
  var totBal=0,totBgt=0,totYrBgt=0,totRem=0;
  filtered.forEach(function(r){
    if(typeof r['本月餘額']==='number') totBal+=r['本月餘額'];
    if(typeof r['本月預算數']==='number') totBgt+=r['本月預算數'];
    if(typeof r['本年度預算']==='number') totYrBgt+=r['本年度預算'];
    if(typeof r['剩餘可動支數']==='number') totRem+=r['剩餘可動支數'];
  });
  var sg=document.getElementById('statGrid');
  sg.innerHTML=[
    ['本月餘額（累計）',Math.round(totBal).toLocaleString('zh-TW'),'blue'],
    ['本月預算數',Math.round(totBgt).toLocaleString('zh-TW'),'green'],
    ['本年度預算',Math.round(totYrBgt).toLocaleString('zh-TW'),'green'],
    ['剩餘可動支數',Math.round(totRem).toLocaleString('zh-TW'),totRem<0?'red':'green']
  ].map(function(x){ return '<div class="stat-card"><div class="stat-label">'+x[0]+'</div><div class="stat-val '+x[2]+'">'+x[1]+'</div></div>'; }).join('');

  var pills=document.getElementById('activePills'); pills.innerHTML='';
  if(curCat!=='all'){ var p=document.createElement('span'); p.className='pill pill-cat'; p.textContent='分類：'+curCat; pills.appendChild(p); }
  if(curUnit!=='all'){ var p=document.createElement('span'); p.className='pill pill-unit'; p.textContent='科室：'+curUnit; pills.appendChild(p); }
  if(curSearch){ var p=document.createElement('span'); p.className='pill pill-search'; p.textContent='搜尋：'+curSearch; pills.appendChild(p); }

  var total=filtered.length, totalPages=Math.max(1,Math.ceil(total/PAGE_SIZE));
  if(curPage>totalPages) curPage=totalPages;
  var slice=filtered.slice((curPage-1)*PAGE_SIZE,curPage*PAGE_SIZE);
  var cl=document.getElementById('cardList'); cl.innerHTML='';
  slice.forEach(function(r){
    var yr=r['年度動支率'], yrNum=typeof yr==='number'?yr:parseFloat(yr)||0;
    var yrCls=yrNum>=90?'red':yrNum>=70?'orange':'green';
    var pgCls=yrNum>=90?'pg-red':yrNum>=70?'pg-org':'pg-grn';
    var yrW=Math.min(100,Math.max(0,yrNum));
    var cc=CAT_COLORS[r['費用分類']]||'#78909c';
    var uc2=r['預算主管單位']?UNIT_PALETTE[r['預算主管單位']]||'#888':'';
    var unitBadge=r['預算主管單位']?'<span class="unit-badge" style="background:'+uc2+'1a;color:'+uc2+'">'+r['預算主管單位']+'</span>':'';
    var rem=r['剩餘可動支數'], remCls=(typeof rem==='number'&&rem<0)?'red':'green';
    var div=document.createElement('div'); div.className='card'; div.dataset.acc=r['明細帳'];
    div.innerHTML='<div class="card-top">'+
      '<span class="acc-code">'+r['明細帳']+'</span>'+
      '<span class="acc-name">'+r['會計項目']+'</span>'+
      '<span class="cat-badge" style="background:'+cc+'1a;color:'+cc+'">'+r['費用分類']+'</span>'+
      unitBadge+'</div>'+
      '<div class="card-nums">'+
        '<div class="num-item"><div class="num-label">本月餘額（累計）</div><div class="num-val blue">'+fmt(r['本月餘額'])+'</div></div>'+
        '<div class="num-item"><div class="num-label">累計動支率</div><div class="num-val '+rateColor(r['累計動支率'])+'">'+fmt(r['累計動支率'])+'%</div></div>'+
        '<div class="num-item"><div class="num-label">本年度預算</div><div class="num-val">'+fmt(r['本年度預算'])+'</div></div>'+
        '<div class="num-item"><div class="num-label">剩餘可動支數</div><div class="num-val '+remCls+'">'+fmt(rem)+'</div></div>'+
      '</div>'+
      '<div class="prog-wrap">'+
        '<div class="prog-label"><span>年度動支率</span><span class="'+yrCls+'">'+fmt(yr)+'%</span></div>'+
        '<div class="prog-bar-bg"><div class="prog-bar '+pgCls+'" style="width:'+yrW+'%"></div></div>'+
      '</div>';
    div.addEventListener('click',function(){ openSheet(this.dataset.acc); });
    cl.appendChild(div);
  });

  var pg=document.getElementById('pager');
  if(totalPages>1){
    pg.innerHTML='';
    var prev=document.createElement('button'); prev.className='pager-btn'; prev.textContent='◀'; prev.disabled=(curPage===1);
    prev.addEventListener('click',function(){ curPage--; render(); window.scrollTo(0,0); });
    var info=document.createElement('span'); info.textContent=curPage+' / '+totalPages;
    var next=document.createElement('button'); next.className='pager-btn'; next.textContent='▶'; next.disabled=(curPage===totalPages);
    next.addEventListener('click',function(){ curPage++; render(); window.scrollTo(0,0); });
    pg.appendChild(prev); pg.appendChild(info); pg.appendChild(next);
  } else { pg.innerHTML=''; }
}

function openSheet(acc){
  var r=RAW.find(function(x){ return x['明細帳']===acc; }); if(!r) return;
  var yr=r['年度動支率'], yrNum=typeof yr==='number'?yr:parseFloat(yr)||0;
  var yrCls=yrNum>=90?'red':yrNum>=70?'orange':'green';
  document.getElementById('sheetTitle').textContent=r['會計項目'];
  document.getElementById('sheetSub').textContent='明細帳：'+r['明細帳']+(r['預算主管單位']?'　科室：'+r['預算主管單位']:'');
  var yrW=Math.min(100,Math.max(0,yrNum));
  document.getElementById('sheetBody').innerHTML=
    '<div class="sheet-sec">本月數據</div>'+
    '<div class="sheet-grid">'+
      '<div class="sheet-item"><div class="sheet-item-label">本月餘額（累計）</div><div class="sheet-item-val blue">'+fmt(r['本月餘額'])+'</div></div>'+
      '<div class="sheet-item"><div class="sheet-item-label">本月動支數</div><div class="sheet-item-val">'+fmt(r['本月動支數'])+'</div></div>'+
      '<div class="sheet-item"><div class="sheet-item-label">本月預算數</div><div class="sheet-item-val">'+fmt(r['本月預算數'])+'</div></div>'+
      '<div class="sheet-item"><div class="sheet-item-label">累計動支率</div><div class="sheet-item-val '+rateColor(r['累計動支率'])+'">'+fmt(r['累計動支率'])+'%</div></div>'+
    '</div>'+
    '<div class="sheet-sec">年度數據</div>'+
    '<div class="sheet-grid">'+
      '<div class="sheet-item"><div class="sheet-item-label">本年度預算</div><div class="sheet-item-val">'+fmt(r['本年度預算'])+'</div></div>'+
      '<div class="sheet-item"><div class="sheet-item-label">剩餘可動支數</div><div class="sheet-item-val '+((typeof r['剩餘可動支數']==='number'&&r['剩餘可動支數']<0)?'red':'green')+'">'+fmt(r['剩餘可動支數'])+'</div></div>'+
      '<div class="sheet-item"><div class="sheet-item-label">至本月預算數</div><div class="sheet-item-val">'+fmt(r['至本月預算數累計'])+'</div></div>'+
      '<div class="sheet-item"><div class="sheet-item-label">年度動支率</div><div class="sheet-item-val '+yrCls+'">'+fmt(yr)+'%</div></div>'+
    '</div>'+
    '<div class="sheet-sec">年度動支進度</div>'+
    '<div class="prog-wrap" style="padding:0 4px">'+
      '<div class="prog-label"><span>'+fmt(yr)+'%</span><span style="color:#888">目標 100%</span></div>'+
      '<div class="prog-bar-bg" style="height:10px"><div class="prog-bar '+(yrNum>=90?'pg-red':yrNum>=70?'pg-org':'pg-grn')+'" style="width:'+yrW+'%;height:10px"></div></div>'+
    '</div>';
  document.getElementById('overlay').className='overlay open';
  document.getElementById('sheet').className='sheet open';
}
document.getElementById('overlay').addEventListener('click',function(e){ if(e.target===this){ this.className='overlay'; document.getElementById('sheet').className='sheet'; } });

function renderSummary(){
  var cats=['人事費','業務外包','業務成本','專案建置成本','設備及折舊','管銷費用'];
  var catStats={}; cats.forEach(function(c){ catStats[c]={budget:0,spent:0}; });
  var totalBgt=0,totalSpt=0;
  RAW.forEach(function(r){
    var b=r['本年度預算'],s=r['本月餘額'];
    if(typeof b==='number') totalBgt+=b;
    if(typeof s==='number') totalSpt+=s;
    if(catStats[r['費用分類']]){ if(typeof b==='number') catStats[r['費用分類']].budget+=b; if(typeof s==='number') catStats[r['費用分類']].spent+=s; }
  });
  var ov=totalBgt?Math.round(totalSpt/totalBgt*100):0;
  var html='<div class="summary-card"><div class="summary-title">整體預算概況</div>'+
    '<div class="bar-item"><div class="bar-item-label"><span>整體動支率</span><span class="'+(ov>=90?'red':ov>=70?'orange':'green')+'">'+ov+'%</span></div>'+
    '<div class="bar-wrap"><div class="bar-fill '+(ov>=90?'pg-red':ov>=70?'pg-org':'pg-grn')+'" style="width:'+Math.min(100,ov)+'%"></div></div></div>'+
    '<div style="font-size:11px;color:#888;margin-top:8px">年度預算：'+Math.round(totalBgt).toLocaleString('zh-TW')+'　累計動支：'+Math.round(totalSpt).toLocaleString('zh-TW')+'</div></div>';
  html+='<div class="summary-card"><div class="summary-title">費用分類動支率</div>';
  cats.forEach(function(c){
    var st=catStats[c], r=st.budget?Math.round(st.spent/st.budget*100):0;
    var cc=CAT_COLORS[c]||'#78909c', cls=r>=90?'red':r>=70?'orange':'green';
    html+='<div class="bar-item"><div class="bar-item-label">'+
      '<span style="display:flex;align-items:center;gap:6px"><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:'+cc+'"></span>'+c+'</span>'+
      '<span class="'+cls+'">'+r+'%</span></div>'+
      '<div class="bar-wrap"><div class="bar-fill" style="width:'+Math.min(100,r)+'%;background:'+cc+'"></div></div>'+
      '<div style="font-size:10px;color:#999;margin-top:3px">預算：'+Math.round(st.budget).toLocaleString('zh-TW')+'　動支：'+Math.round(st.spent).toLocaleString('zh-TW')+'</div></div>';
  });
  html+='</div>';
  var unitStats={};
  RAW.forEach(function(r){ var u=r['預算主管單位']; if(!u) return; if(!unitStats[u]) unitStats[u]={budget:0,spent:0}; if(typeof r['本年度預算']==='number') unitStats[u].budget+=r['本年度預算']; if(typeof r['本月餘額']==='number') unitStats[u].spent+=r['本月餘額']; });
  html+='<div class="summary-card"><div class="summary-title">各科室動支率</div>';
  Object.keys(unitStats).sort().forEach(function(u){
    var st=unitStats[u], r=st.budget?Math.round(st.spent/st.budget*100):0;
    var uc2=UNIT_PALETTE[u]||'#888', cls=r>=90?'red':r>=70?'orange':'green';
    html+='<div class="bar-item"><div class="bar-item-label">'+
      '<span style="display:flex;align-items:center;gap:6px"><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:'+uc2+'"></span>'+u+'</span>'+
      '<span class="'+cls+'">'+r+'%</span></div>'+
      '<div class="bar-wrap"><div class="bar-fill" style="width:'+Math.min(100,r)+'%;background:'+uc2+'"></div></div></div>';
  });
  html+='</div>';
  document.getElementById('summaryRoot').innerHTML=html;
}

function renderWarning(){
  var warn=RAW.filter(function(r){ var yr=r['年度動支率']; return typeof yr==='number'&&yr>=70; });
  warn.sort(function(a,b){ return (b['年度動支率']||0)-(a['年度動支率']||0); });
  if(!warn.length){ document.getElementById('warningRoot').innerHTML='<div style="text-align:center;color:#888;padding:40px 0">✅ 目前無高用率項目</div>'; return; }
  var html='<div style="font-size:12px;color:#888;margin-bottom:10px">共 '+warn.length+' 筆動支率 ≥ 70%</div>';
  warn.forEach(function(r){
    var yr=r['年度動支率'], cls=yr>=90?'red':'orange';
    var bc=yr>=90?'#ffebee':'#fff8e1';
    var cc=CAT_COLORS[r['費用分類']]||'#78909c';
    var uc2=r['預算主管單位']?UNIT_PALETTE[r['預算主管單位']]||'#888':'';
    var unitBadge=r['預算主管單位']?'<span class="unit-badge" style="background:'+uc2+'1a;color:'+uc2+'">'+r['預算主管單位']+'</span>':'';
    html+='<div class="card" style="border-left:4px solid '+(yr>=90?'#c62828':'#e07b00')+';background:'+bc+'">'+
      '<div class="card-top"><span class="acc-code">'+r['明細帳']+'</span><span class="acc-name">'+r['會計項目']+'</span>'+
      '<span class="cat-badge" style="background:'+cc+'1a;color:'+cc+'">'+r['費用分類']+'</span>'+unitBadge+'</div>'+
      '<div style="display:flex;justify-content:space-between;font-size:13px;font-weight:700;margin-bottom:6px">'+
        '<span>年度預算：'+fmt(r['本年度預算'])+'</span><span class="'+cls+'">動支率：'+yr+'%</span></div>'+
      '<div class="prog-bar-bg"><div class="prog-bar '+(yr>=90?'pg-red':'pg-org')+'" style="width:'+Math.min(100,yr)+'%"></div></div></div>';
  });
  document.getElementById('warningRoot').innerHTML=html;
}

// ★ v9 修正版 renderCharts：chart-canvas-wrap 容器控制高度，解決甜甜圈圖跑版
function renderCharts(){
  _chartsReady=true;
  var root=document.getElementById('chartsRoot');
  var totalBgt=0,totalSpt=0;
  RAW.forEach(function(r){ if(typeof r['本年度預算']==='number') totalBgt+=r['本年度預算']; if(typeof r['本月餘額']==='number') totalSpt+=r['本月餘額']; });
  var ovRate=totalBgt?Math.round(totalSpt/totalBgt*100):0;
  var kpiHtml='<div class="chart-kpi-grid">'+
    '<div class="kpi-card"><div class="kpi-label">本年度預算</div><div class="kpi-value" style="color:#128048">'+Math.round(totalBgt/10000).toLocaleString('zh-TW')+'<br><span style="font-size:10px;font-weight:400">萬元</span></div></div>'+
    '<div class="kpi-card"><div class="kpi-label">累計動支</div><div class="kpi-value" style="color:#1565c0">'+Math.round(totalSpt/10000).toLocaleString('zh-TW')+'<br><span style="font-size:10px;font-weight:400">萬元</span></div></div>'+
    '<div class="kpi-card"><div class="kpi-label">整體動支率</div><div class="kpi-value" style="color:'+(ovRate>=90?'#c62828':ovRate>=70?'#e07b00':'#128048')+'">'+ovRate+'%</div></div>'+
    '</div>';
  root.innerHTML=kpiHtml+
    '<div class="chart-section"><div class="chart-section-title">🍩 費用分類預算分配</div>'+
      '<div class="chart-canvas-wrap" style="height:280px"><canvas id="chartDonut"></canvas></div></div>'+
    '<div class="chart-section"><div class="chart-section-title">📊 費用分類年度動支率</div>'+
      '<div class="chart-canvas-wrap" style="height:220px"><canvas id="chartCat"></canvas></div></div>'+
    '<div class="chart-section"><div class="chart-section-title">🏢 科室年度動支率</div>'+
      '<div class="chart-canvas-wrap" id="unitChartWrap" style="height:260px"><canvas id="chartUnit"></canvas></div></div>'+
    '<div class="chart-section"><div class="chart-section-title">📦 已動支 vs 剩餘可動支（萬元）</div>'+
      '<div class="chart-canvas-wrap" style="height:220px"><canvas id="chartStack"></canvas></div></div>';

  if(typeof Chart==='undefined'){
    var s=document.createElement('script');
    s.src='https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js';
    s.onload=function(){ drawAll(); };
    document.head.appendChild(s);
  } else { drawAll(); }

  function drawAll(){
    var cats=['人事費','業務外包','業務成本','專案建置成本','設備及折舊','管銷費用'];
    var catBudgets=[],catRates=[],catColors=[];
    cats.forEach(function(c){
      var b=0,s2=0;
      RAW.forEach(function(r){ if(r['費用分類']===c){ if(typeof r['本年度預算']==='number') b+=r['本年度預算']; if(typeof r['本月餘額']==='number') s2+=r['本月餘額']; } });
      catBudgets.push(Math.round(b/10000)); catRates.push(b?Math.round(s2/b*100):0); catColors.push(CAT_COLORS[c]);
    });
    new Chart(document.getElementById('chartDonut'),{
      type:'doughnut',
      data:{labels:cats,datasets:[{data:catBudgets,backgroundColor:catColors,borderWidth:2,borderColor:'#fff'}]},
      options:{maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{font:{size:10},padding:8,boxWidth:12}}}}
    });
    var catBarColors=catRates.map(function(r){ return r>=90?'#c62828':r>=70?'#e07b00':'#2e7d32'; });
    new Chart(document.getElementById('chartCat'),{
      type:'bar',
      data:{labels:cats,datasets:[{label:'動支率%',data:catRates,backgroundColor:catBarColors}]},
      options:{maintainAspectRatio:false,indexAxis:'y',plugins:{legend:{display:false}},scales:{x:{max:100}}}
    });
    var unitMap2={};
    RAW.forEach(function(r){ var u=r['預算主管單位']; if(!u) return; if(!unitMap2[u]) unitMap2[u]={b:0,s:0}; if(typeof r['本年度預算']==='number') unitMap2[u].b+=r['本年度預算']; if(typeof r['本月餘額']==='number') unitMap2[u].s+=r['本月餘額']; });
    var unitKeys=Object.keys(unitMap2).sort(function(a,b){ var ra=unitMap2[a].b?unitMap2[a].s/unitMap2[a].b:0; var rb=unitMap2[b].b?unitMap2[b].s/unitMap2[b].b:0; return ra-rb; });
    var unitRates=unitKeys.map(function(u){ return unitMap2[u].b?Math.round(unitMap2[u].s/unitMap2[u].b*100):0; });
    var unitBarColors=unitRates.map(function(r){ return r>=90?'#c62828':r>=70?'#e07b00':'#2e7d32'; });
    var unitH=Math.max(260,unitKeys.length*28);
    document.getElementById('unitChartWrap').style.height=unitH+'px';
    new Chart(document.getElementById('chartUnit'),{
      type:'bar',
      data:{labels:unitKeys,datasets:[{label:'動支率%',data:unitRates,backgroundColor:unitBarColors}]},
      options:{maintainAspectRatio:false,indexAxis:'y',plugins:{legend:{display:false}},scales:{x:{max:100}}}
    });
    var stackSpent=cats.map(function(c,i){ return Math.round(catBudgets[i]*catRates[i]/100); });
    var stackRemain=cats.map(function(c,i){ return Math.max(0,catBudgets[i]-stackSpent[i]); });
    new Chart(document.getElementById('chartStack'),{
      type:'bar',
      data:{labels:cats,datasets:[{label:'已動支（萬）',data:stackSpent,backgroundColor:'#128048'},{label:'剩餘（萬）',data:stackRemain,backgroundColor:'#c8e6c9'}]},
      options:{maintainAspectRatio:false,indexAxis:'y',scales:{x:{stacked:true},y:{stacked:true}}}
    });
  }
}

buildChips();
render();
