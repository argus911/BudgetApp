<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;background:#f0f4f0;color:#1a1a1a;min-height:100vh;padding-bottom:80px;}
.header{background:linear-gradient(135deg,#0a6830 0%,#128048 60%,#1ab060 100%);color:#fff;padding:14px 16px 10px;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,100,50,.25);}
.header-row{display:flex;align-items:center;justify-content:space-between;}
.header h1{font-size:17px;font-weight:700;letter-spacing:.5px;}
.header .sub{font-size:12px;opacity:.82;margin-top:2px;}
.badge{background:rgba(255,255,255,.22);border-radius:12px;padding:2px 10px;font-size:12px;font-weight:600;}
.tab-bar{display:flex;background:#fff;border-bottom:1.5px solid #d4e8d8;position:sticky;top:58px;z-index:99;overflow-x:auto;scrollbar-width:none;}
.tab-bar::-webkit-scrollbar{display:none;}
.tab-btn{flex:none;padding:10px 14px;font-size:13px;font-weight:600;color:#666;border:none;background:none;cursor:pointer;white-space:nowrap;border-bottom:2.5px solid transparent;transition:all .2s;}
.tab-btn.active{color:#128048;border-bottom-color:#128048;}
.tab-content{display:none;padding:12px 12px 16px;}
.tab-content.active{display:block;}
.filter-card{background:#fff;border-radius:16px;padding:14px;margin-bottom:10px;box-shadow:0 1px 6px rgba(0,80,40,.08);}
.filter-card label{font-size:12px;color:#666;font-weight:600;margin-bottom:6px;display:block;}
.search-box{width:100%;padding:9px 12px;border:1.5px solid #c8e0cf;border-radius:10px;font-size:14px;outline:none;}
.search-box:focus{border-color:#128048;}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
.chip{padding:5px 12px;border-radius:20px;font-size:12px;font-weight:600;border:1.5px solid #c8dfc8;background:#f5fff5;color:#128048;cursor:pointer;transition:all .18s;}
.chip.active{background:#128048;color:#fff;border-color:#128048;}
.active-filters{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px;}
.filter-pill{padding:3px 10px;border-radius:12px;font-size:11px;font-weight:600;color:#fff;}
.notice{background:#fff8e1;border-left:4px solid #f59e0b;border-radius:0 10px 10px 0;padding:9px 12px;margin-bottom:10px;font-size:12px;line-height:1.5;}
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px;}
.stat-card{background:#fff;border-radius:14px;padding:12px 10px;text-align:center;box-shadow:0 1px 6px rgba(0,80,40,.08);}
.stat-card .label{font-size:11px;color:#666;margin-bottom:4px;}
.stat-card .value{font-size:16px;font-weight:700;color:#128048;}
.result-count{font-size:12px;color:#666;margin-bottom:8px;padding-left:2px;}
.item-card{background:#fff;border-radius:16px;padding:14px;margin-bottom:8px;box-shadow:0 1px 6px rgba(0,80,40,.08);cursor:pointer;transition:transform .15s,box-shadow .15s;}
.item-card:active{transform:scale(.985);box-shadow:0 3px 12px rgba(0,80,40,.16);}
.card-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:8px;}
.card-acc{font-size:13px;font-weight:700;color:#0a6830;}
.card-name{font-size:14px;font-weight:600;color:#1a1a1a;flex:1;margin:0 8px;line-height:1.3;}
.badges{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px;}
.cat-badge{padding:2px 8px;border-radius:8px;font-size:10px;font-weight:700;color:#fff;}
.unit-badge{padding:2px 8px;border-radius:8px;font-size:10px;font-weight:600;}
.card-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px;}
.card-cell{background:#f8fdf8;border-radius:8px;padding:7px 8px;}
.card-cell .cl{font-size:10px;color:#888;margin-bottom:2px;}
.card-cell .cv{font-size:14px;font-weight:700;}
.progress-row{margin-top:8px;}
.prog-label{display:flex;justify-content:space-between;font-size:11px;color:#666;margin-bottom:3px;}
.prog-bar{background:#e8f5e9;border-radius:4px;height:7px;overflow:hidden;}
.prog-fill{height:100%;border-radius:4px;transition:width .3s;}
.pagination{display:flex;justify-content:center;gap:8px;margin-top:12px;flex-wrap:wrap;}
.page-btn{padding:7px 14px;border-radius:10px;border:1.5px solid #c8e0cf;background:#fff;color:#128048;font-size:13px;font-weight:600;cursor:pointer;}
.page-btn.active{background:#128048;color:#fff;border-color:#128048;}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,0);z-index:200;pointer-events:none;transition:background .25s;}
.overlay.open{background:rgba(0,0,0,.45);pointer-events:all;}
.bottom-sheet{position:fixed;bottom:-100%;left:0;right:0;background:#fff;border-radius:20px 20px 0 0;padding:0 0 env(safe-area-inset-bottom);z-index:201;transition:bottom .3s cubic-bezier(.4,0,.2,1);max-height:82vh;overflow-y:auto;}
.overlay.open .bottom-sheet{bottom:0;}
.sheet-handle{width:40px;height:4px;background:#ddd;border-radius:2px;margin:12px auto 0;}
.sheet-title{padding:12px 18px 0;font-size:17px;font-weight:700;color:#0a6830;}
.sheet-body{padding:12px 18px 24px;}
.sheet-section{margin-bottom:12px;}
.sheet-section h4{font-size:12px;color:#666;font-weight:600;text-transform:uppercase;margin-bottom:6px;letter-spacing:.5px;border-bottom:1px solid #eee;padding-bottom:4px;}
.sheet-row{display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid #f5f5f5;}
.sheet-row .sr-label{font-size:13px;color:#666;}
.sheet-row .sr-val{font-size:14px;font-weight:600;}
.summary-section{background:#fff;border-radius:16px;padding:14px;margin-bottom:10px;box-shadow:0 1px 6px rgba(0,80,40,.08);}
.summary-section h3{font-size:15px;font-weight:700;color:#0a6830;margin-bottom:10px;}
.bar-row{margin-bottom:10px;}
.bar-label{display:flex;justify-content:space-between;font-size:12px;color:#444;margin-bottom:3px;}
.bar-track{background:#e8f5e9;border-radius:5px;height:10px;overflow:hidden;}
.bar-fill{height:100%;border-radius:5px;}
.warn-card{background:#fff;border-radius:14px;padding:12px 14px;margin-bottom:8px;border-left:4px solid #e07b00;box-shadow:0 1px 6px rgba(0,80,40,.08);cursor:pointer;}
.warn-card.critical{border-left-color:#c62828;}
.info-card{background:#fff;border-radius:14px;padding:14px;margin-bottom:8px;box-shadow:0 1px 6px rgba(0,80,40,.08);}
.info-card h4{font-size:13px;font-weight:700;color:#0a6830;margin-bottom:6px;}
.info-row{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid #f0f0f0;font-size:13px;}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e0ece3;display:flex;z-index:100;padding-bottom:env(safe-area-inset-bottom);}
.bottom-nav .tab-btn{flex:1;padding:10px 0;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px;}
.bottom-nav .tab-btn .icon{font-size:18px;}
.kpi-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:14px;}
.kpi-card{background:#fff;border-radius:14px;padding:12px 8px;text-align:center;box-shadow:0 1px 6px rgba(0,80,40,.08);}
.kpi-card .kl{font-size:10px;color:#666;margin-bottom:4px;}
.kpi-card .kv{font-size:15px;font-weight:700;}
.chart-section{background:#fff;border-radius:16px;padding:14px;margin-bottom:10px;box-shadow:0 1px 6px rgba(0,80,40,.08);}
.chart-section h3{font-size:14px;font-weight:700;color:#0a6830;margin-bottom:10px;}

    '<div class="sheet-row"><span class="sr-label">本月預算數</span><span class="sr-val">'+fmt(r['本月預算數'])+'</span></div>'+
    '<div class="sheet-row"><span class="sr-label">至本月預算數累計</span><span class="sr-val">'+fmt(r['至本月預算數累計'])+'</span></div>'+
    '<div class="sheet-row"><span class="sr-label">累計動支率</span><span class="sr-val" style="color:'+rateColor(cumRate)+'">'+fmt(cumRate)+'%</span></div>'+
    '</div>'+
    '<div class="sheet-section"><h4>年度數據</h4>'+
    '<div class="sheet-row"><span class="sr-label">本年度預算</span><span class="sr-val">'+fmt(r['本年度預算'])+'</span></div>'+
    '<div class="sheet-row"><span class="sr-label">剩餘可動支數</span><span class="sr-val" style="color:'+(typeof r['剩餘可動支數']==='number'&&r['剩餘可動支數']<0?'#c62828':'#128048')+'">'+fmt(r['剩餘可動支數'])+'</span></div>'+
    '</div>'+
    '<div class="sheet-section"><h4>年度動支進度</h4>'+
    '<div class="prog-label"><span>年度動支率</span><span style="color:'+rc+';font-weight:700">'+yr+'%</span></div>'+
    '<div class="prog-bar" style="height:12px;margin-top:4px"><div class="prog-fill" style="width:'+Math.min(yr,100)+'%;background:'+rc+'"></div></div>'+
    '</div>';
  document.getElementById('overlay').className='overlay open';
}
document.getElementById('overlay').addEventListener('click',function(e){if(e.target===this)this.className='overlay';});
function renderSummary(){
  var tYBgt=RAW.reduce(function(s,r){return s+(typeof r['本年度預算']==='number'?r['本年度預算']:0);},0);
  var tUsed=RAW.reduce(function(s,r){return s+(typeof r['本月餘額']==='number'?r['本月餘額']:0);},0);
  var tRem=RAW.reduce(function(s,r){return s+(typeof r['剩餘可動支數']==='number'?r['剩餘可動支數']:0);},0);
  var ovRate=tYBgt?Math.round(tUsed/tYBgt*10000)/100:0;var orc=rateColor(ovRate);
  document.getElementById('overallSummary').innerHTML=
    '<h3>整體預算概況</h3>'+
    '<div class="info-row"><span>本年度預算</span><span><strong>'+fmt(Math.round(tYBgt))+'</strong></span></div>'+
    '<div class="info-row"><span>累計動支（本月餘額）</span><span><strong style="color:#1565c0">'+fmt(Math.round(tUsed))+'</strong></span></div>'+
    '<div class="info-row"><span>剩餘可動支數</span><span><strong style="color:'+(tRem<0?'#c62828':'#128048')+'">'+fmt(Math.round(tRem))+'</strong></span></div>'+
    '<div class="info-row"><span>整體年度動支率</span><span><strong style="color:'+orc+'">'+ovRate+'%</strong></span></div>'+
    '<div class="progress-row" style="margin-top:8px"><div class="prog-bar"><div class="prog-fill" style="width:'+Math.min(ovRate,100)+'%;background:'+orc+'"></div></div></div>';
  var catMap={};
  RAW.forEach(function(r){var c=r['費用分類']||'其他';if(!catMap[c])catMap[c]={bgt:0,used:0};catMap[c].bgt+=(typeof r['本年度預算']==='number'?r['本年度預算']:0);catMap[c].used+=(typeof r['本月餘額']==='number'?r['本月餘額']:0);});
  var catHtml='<h3>各費用分類年度動支率</h3>';
  Object.keys(catMap).sort().forEach(function(c){var m=catMap[c];var rate=m.bgt?Math.round(m.used/m.bgt*10000)/100:0;var rc2=rateColor(rate);var cc2=CAT_COLORS[c]||'#546e7a';
    catHtml+='<div class="bar-row"><div class="bar-label"><span style="color:'+cc2+';font-weight:600">'+c+'</span><span>動支率 <strong style="color:'+rc2+'">'+rate+'%</strong> ／ 預算 '+fmt(Math.round(m.bgt))+'</span></div><div class="bar-track"><div class="bar-fill" style="width:'+Math.min(rate,100)+'%;background:'+rc2+'"></div></div></div>';
  });
  document.getElementById('catSummary').innerHTML=catHtml;
  var unitMap2={};
  RAW.forEach(function(r){var u=r['預算主管單位'];if(!u)return;if(!unitMap2[u])unitMap2[u]={bgt:0,used:0};unitMap2[u].bgt+=(typeof r['本年度預算']==='number'?r['本年度預算']:0);unitMap2[u].used+=(typeof r['本月餘額']==='number'?r['本月餘額']:0);});
  var unitHtml='<h3>各科室年度動支率</h3>';
  Object.keys(unitMap2).sort(function(a,b){var ra=unitMap2[a].bgt?unitMap2[a].used/unitMap2[a].bgt:0;var rb=unitMap2[b].bgt?unitMap2[b].used/unitMap2[b].bgt:0;return rb-ra;}).forEach(function(u){var m=unitMap2[u];var rate=m.bgt?Math.round(m.used/m.bgt*10000)/100:0;var rc3=rateColor(rate);var uc3=unitColorMap[u]||'#128048';
    unitHtml+='<div class="bar-row"><div class="bar-label"><span style="color:'+uc3+';font-weight:600">'+u+'</span><span>動支率 <strong style="color:'+rc3+'">'+rate+'%</strong></span></div><div class="bar-track"><div class="bar-fill" style="width:'+Math.min(rate,100)+'%;background:'+rc3+'"></div></div></div>';
  });
  document.getElementById('unitSummary').innerHTML=unitHtml;
}
function renderWarning(){
  var warns=RAW.filter(function(r){return typeof r['年度動支率']==='number'&&r['年度動支率']>=70;}).sort(function(a,b){return b['年度動支率']-a['年度動支率'];});
  var el=document.getElementById('warnList');
  if(!warns.length){el.innerHTML='<div style="padding:24px;text-align:center;color:#666">無高用率項目 &#127881;</div>';return;}
  el.innerHTML='';
  warns.forEach(function(r){
    var yr=r['年度動支率'];var div=document.createElement('div');
    div.className='warn-card'+(yr>=90?' critical':'');div.dataset.acc=r['明細帳'];
    var rc=rateColor(yr);var uc=unitColorMap[r['預算主管單位']]||'';
    var unitBadge=r['預算主管單位']?'<span class="unit-badge" style="background:'+uc+'1a;color:'+uc+';margin-left:4px">'+r['預算主管單位']+'</span>':'';
    div.innerHTML='<div style="display:flex;justify-content:space-between;align-items:center"><div><span style="font-size:13px;font-weight:700;color:#444">'+r['明細帳']+'</span><span style="font-size:14px;font-weight:600;color:#1a1a1a;margin-left:6px">'+r['會計項目']+'</span></div><span style="font-size:18px;font-weight:800;color:'+rc+'">'+yr+'%</span></div><div style="margin-top:4px"><span class="cat-badge" style="background:'+(CAT_COLORS[r['費用分類']]||'#546e7a')+'">'+r['費用分類']+'</span>'+unitBadge+'</div><div style="font-size:12px;color:#666;margin-top:5px">剩餘可動支：'+fmt(r['剩餘可動支數'])+'</div><div class="prog-bar" style="margin-top:5px"><div class="prog-fill" style="width:'+Math.min(yr,100)+'%;background:'+rc+'"></div></div>';
    div.addEventListener('click',function(){openSheet(this.dataset.acc);});
    el.appendChild(div);
  });
}
var _chartsReady=false;
function renderCharts(){
  if(_chartsReady)return;_chartsReady=true;
  var root=document.getElementById('chartsRoot');
  var tYBgt=RAW.reduce(function(s,r){return s+(typeof r['本年度預算']==='number'?r['本年度預算']:0);},0);
  var tUsed=RAW.reduce(function(s,r){return s+(typeof r['本月餘額']==='number'?r['本月餘額']:0);},0);
  var tRem=RAW.reduce(function(s,r){return s+(typeof r['剩餘可動支數']==='number'?r['剩餘可動支數']:0);},0);
  var ovRate=tYBgt?Math.round(tUsed/tYBgt*1000)/10:0;var orc=rateColor(ovRate);
  function wan(v){return (v/10000).toFixed(0)+'萬';}
  root.innerHTML=
    '<div class="kpi-grid">'+
      '<div class="kpi-card"><div class="kl">本年度預算</div><div class="kv" style="color:#1565c0">'+wan(tYBgt)+'</div></div>'+
      '<div class="kpi-card"><div class="kl">累計動支</div><div class="kv" style="color:#128048">'+wan(tUsed)+'</div></div>'+
      '<div class="kpi-card"><div class="kl">整體動支率</div><div class="kv" style="color:'+orc+'">'+ovRate+'%</div></div>'+
    '</div>'+
    '<div class="chart-section"><h3>&#127849; 費用分類預算分配</h3><canvas id="donutChart" height="260"></canvas></div>'+
    '<div class="chart-section"><h3>&#128202; 費用分類年度動支率</h3><canvas id="catBarChart" height="280"></canvas></div>'+
    '<div class="chart-section" id="unitChartWrap"><h3>&#127970; 科室年度動支率</h3><canvas id="unitBarChart"></canvas></div>'+
    '<div class="chart-section"><h3>&#128230; 費用分類動支對比（萬元）</h3><canvas id="stackChart" height="280"></canvas></div>';
  if(typeof Chart==='undefined'){var s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js';s.onload=function(){drawAllCharts();};document.head.appendChild(s);}
  else drawAllCharts();
}
function drawAllCharts(){
  var catMap={};
  RAW.forEach(function(r){var c=r['費用分類']||'其他';if(!catMap[c])catMap[c]={bgt:0,used:0};catMap[c].bgt+=(typeof r['本年度預算']==='number'?r['本年度預算']:0);catMap[c].used+=(typeof r['本月餘額']==='number'?r['本月餘額']:0);});
  var catKeys=Object.keys(catMap).sort();
  var catBgts=catKeys.map(function(c){return Math.round(catMap[c].bgt/10000);});
  var catRates=catKeys.map(function(c){return catMap[c].bgt?Math.round(catMap[c].used/catMap[c].bgt*1000)/10:0;});
  var catFills=catKeys.map(function(c){return CAT_COLORS[c]||'#546e7a';});
  new Chart(document.getElementById('donutChart'),{type:'doughnut',data:{labels:catKeys,datasets:[{data:catBgts,backgroundColor:catFills,borderWidth:2,borderColor:'#fff'}]},options:{maintainAspectRatio:false,plugins:{legend:{position:'right',labels:{font:{size:11},boxWidth:14}}}}});
  new Chart(document.getElementById('catBarChart'),{type:'bar',data:{labels:catKeys,datasets:[{label:'年度動支率(%)',data:catRates,backgroundColor:catRates.map(function(r){return r>=90?'rgba(198,40,40,.75)':r>=70?'rgba(224,123,0,.75)':'rgba(46,125,50,.75)';}),borderRadius:6}]},options:{maintainAspectRatio:false,indexAxis:'y',plugins:{legend:{display:false}},scales:{x:{max:100,ticks:{callback:function(v){return v+'%';}}}}}});
  var unitMap2={};RAW.forEach(function(r){var u=r['預算主管單位'];if(!u)return;if(!unitMap2[u])unitMap2[u]={bgt:0,used:0};unitMap2[u].bgt+=(typeof r['本年度預算']==='number'?r['本年度預算']:0);unitMap2[u].used+=(typeof r['本月餘額']==='number'?r['本月餘額']:0);});
  var unitKeys=Object.keys(unitMap2).sort(function(a,b){var ra=unitMap2[a].bgt?unitMap2[a].used/unitMap2[a].bgt:0;var rb=unitMap2[b].bgt?unitMap2[b].used/unitMap2[b].bgt:0;return rb-ra;});
  var unitRates=unitKeys.map(function(u){return unitMap2[u].bgt?Math.round(unitMap2[u].used/unitMap2[u].bgt*1000)/10:0;});
  var unitH=Math.max(260,unitKeys.length*26);document.getElementById('unitBarChart').setAttribute('height',unitH);
  new Chart(document.getElementById('unitBarChart'),{type:'bar',data:{labels:unitKeys,datasets:[{label:'年度動支率(%)',data:unitRates,backgroundColor:unitKeys.map(function(u){return unitColorMap[u]||'#128048';}),borderRadius:5}]},options:{maintainAspectRatio:false,indexAxis:'y',plugins:{legend:{display:false}},scales:{x:{max:100,ticks:{callback:function(v){return v+'%';}}}}}});
  var catUsedW=catKeys.map(function(c){return Math.round(catMap[c].used/10000);});
  var catRemW=catKeys.map(function(c){var rem=catMap[c].bgt-catMap[c].used;return Math.max(0,Math.round(rem/10000));});
  new Chart(document.getElementById('stackChart'),{type:'bar',data:{labels:catKeys,datasets:[{label:'已動支(萬)',data:catUsedW,backgroundColor:'rgba(21,101,192,.75)',borderRadius:4},{label:'剩餘可動支(萬)',data:catRemW,backgroundColor:'rgba(200,230,201,.9)',borderRadius:4}]},options:{maintainAspectRatio:false,indexAxis:'y',plugins:{legend:{position:'top',labels:{font:{size:11}}}},scales:{x:{stacked:true,ticks:{callback:function(v){return v+'萬';}}},y:{stacked:true}}}});
}
applyFilters();
</script>
