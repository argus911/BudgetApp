<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;background:#f0f4f0;color:#1a3a2a;min-height:100vh;padding-bottom:80px}
.header{background:linear-gradient(135deg,#0d6b3a,#128048,#1a9e5a);color:#fff;padding:12px 16px 10px;position:sticky;top:0;z-index:100;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 12px rgba(0,80,40,.3)}
.header-title{font-size:16px;font-weight:700;letter-spacing:.5px}
.header-sub{font-size:11px;opacity:.85;margin-top:2px}
.badge{background:rgba(255,255,255,.2);padding:3px 9px;border-radius:12px;font-size:12px;font-weight:600}
.tab-bar{display:flex;background:#fff;border-bottom:1px solid #d4e8dc;position:sticky;top:54px;z-index:99;overflow-x:auto;-webkit-overflow-scrolling:touch}
.tab-bar::-webkit-scrollbar{display:none}
.tab-btn{flex:0 0 auto;padding:10px 16px;font-size:13px;font-weight:500;color:#5a8a6a;border:none;background:none;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap}
.tab-btn.active{color:#128048;border-bottom-color:#128048;font-weight:700}
.tab-content{display:none;padding:12px}
.tab-content.active{display:block}
.notice{background:#fffde7;border-left:4px solid #f9a825;padding:10px 14px;border-radius:8px;font-size:13px;color:#5a4a00;margin-bottom:12px;line-height:1.5}
.filter-card{background:#fff;border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,60,30,.08)}
.search-box{width:100%;padding:10px 14px;border:1.5px solid #b8d8c4;border-radius:12px;font-size:14px;outline:none;background:#f8fdf9}
.search-box:focus{border-color:#128048}
.chip-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{padding:5px 12px;border-radius:20px;font-size:12px;font-weight:500;cursor:pointer;border:1.5px solid #c8e0d0;color:#3a6a4a;background:#f0faf4;transition:all .15s}
.chip.active{background:#128048;color:#fff;border-color:#128048}
.chip-label{font-size:11px;color:#7aaa8a;margin-top:8px;margin-bottom:4px;font-weight:600;letter-spacing:.3px}
.filter-pills{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.pill{padding:4px 10px;border-radius:14px;font-size:12px;font-weight:600}
.pill-cat{background:#e8f5e9;color:#2e7d32;border:1px solid #a5d6a7}
.pill-unit{background:#e3f2fd;color:#1565c0;border:1px solid #90caf9}
.pill-kw{background:#fff3e0;color:#e65100;border:1px solid #ffcc80}
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.stat-card{background:#fff;border-radius:14px;padding:12px;text-align:center;box-shadow:0 1px 6px rgba(0,60,30,.08)}
.stat-label{font-size:11px;color:#7aaa8a;margin-bottom:4px}
.stat-val{font-size:16px;font-weight:700;color:#128048}
.result-count{font-size:13px;color:#7aaa8a;margin-bottom:8px;padding-left:2px}
.card{background:#fff;border-radius:16px;padding:14px;margin-bottom:10px;box-shadow:0 2px 8px rgba(0,60,30,.08);cursor:pointer;transition:transform .1s;border-left:3px solid #e0f0e8}
.card:active{transform:scale(.98)}
.card-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:8px}
.card-code{font-size:12px;color:#7aaa8a;font-family:monospace;font-weight:600}
.card-name{font-size:14px;font-weight:700;color:#1a3a2a;flex:1;margin:0 8px;line-height:1.3}
.badges{display:flex;flex-wrap:wrap;gap:4px}
.cat-badge{padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600}
.unit-badge{padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600}
.card-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.card-item{background:#f8fdf9;border-radius:10px;padding:8px 10px}
.card-item-label{font-size:10px;color:#7aaa8a;margin-bottom:2px}
.card-item-val{font-size:14px;font-weight:700}

    var prev=document.createElement('button');prev.className='pager-btn';prev.textContent='◀ 上頁';prev.disabled=(curPage<=1);
    prev.addEventListener('click',function(){curPage--;renderQuery();});pg.appendChild(prev);
    var info=document.createElement('span');info.className='pager-info';info.textContent=curPage+' / '+maxPage;pg.appendChild(info);
    var next=document.createElement('button');next.className='pager-btn';next.textContent='下頁 ▶';next.disabled=(curPage>=maxPage);
    next.addEventListener('click',function(){curPage++;renderQuery();});pg.appendChild(next);
  }
}
function renderSummary(){
  if(_sd)return;_sd=true;
  var tab=document.getElementById('tab-summary');
  var ty=0,tr=0,tb=0;
  RAW.forEach(function(r){ty+=parseFloat(r['本年度預算'])||0;tr+=parseFloat(r['剩餘可動支數'])||0;tb+=parseFloat(r['本月餘額'])||0;});
  var or2=ty>0?(tb/ty*100):0;
  tab.innerHTML='<div class="overview-card">'
    +'<div class="info-row"><span>本年度預算合計</span><span style="font-weight:700">'+fmt(Math.round(ty))+'</span></div>'
    +'<div class="info-row"><span>累計動支合計</span><span style="font-weight:700;color:#1565c0">'+fmt(Math.round(tb))+'</span></div>'
    +'<div class="info-row"><span>剩餘可動支合計</span><span style="font-weight:700;color:#128048">'+fmt(Math.round(tr))+'</span></div>'
    +'<div class="info-row"><span>整體累計動支率</span><span style="font-weight:700;color:'+rateColor(or2)+'">'+or2.toFixed(2)+'%</span></div>'
    +'</div>';
  var cm={};
  RAW.forEach(function(r){var c=r['費用分類'];if(!cm[c])cm[c]={bgt:0,bal:0,rem:0};cm[c].bgt+=parseFloat(r['本年度預算'])||0;cm[c].bal+=parseFloat(r['本月餘額'])||0;cm[c].rem+=parseFloat(r['剩餘可動支數'])||0;});
  var ch='<div class="summary-section"><div class="summary-title">各費用分類動支率</div><div class="overview-card">';
  Object.keys(cm).sort().forEach(function(c){var m=cm[c];var r2=m.bgt>0?Math.min(m.bal/m.bgt*100,100):0;var rc2=rateColor(r2);var cc=CAT_COLORS[c]||['#f5f5f5','#424242'];
    ch+='<div class="bar-item"><div class="bar-label"><span style="color:'+cc[1]+';font-weight:600">'+c+'</span><span style="color:'+rc2+';font-weight:700">'+r2.toFixed(1)+'%</span></div>'
      +'<div class="bar-track"><div class="bar-fill" style="width:'+r2+'%;background:'+rc2+'"></div></div>'
      +'<div class="bar-info">累計動支 '+fmt(Math.round(m.bal))+' / 年度預算 '+fmt(Math.round(m.bgt))+'</div></div>';
  });
  ch+='</div></div>';tab.innerHTML+=ch;
  var um={};
  RAW.forEach(function(r){var u=r['預算主管單位'];if(!u)return;if(!um[u])um[u]={bgt:0,bal:0};um[u].bgt+=parseFloat(r['本年度預算'])||0;um[u].bal+=parseFloat(r['本月餘額'])||0;});
  var uh='<div class="summary-section"><div class="summary-title">各科室動支率</div><div class="overview-card">';
  Object.keys(um).sort().forEach(function(u){var m=um[u];var r2=m.bgt>0?Math.min(m.bal/m.bgt*100,100):0;var rc2=rateColor(r2);var uc=getUnitColor(u);
    uh+='<div class="bar-item"><div class="bar-label"><span style="color:'+uc+';font-weight:600">'+u+'</span><span style="color:'+rc2+';font-weight:700">'+r2.toFixed(1)+'%</span></div>'
      +'<div class="bar-track"><div class="bar-fill" style="width:'+r2+'%;background:'+rc2+'"></div></div>'
      +'<div class="bar-info">累計動支 '+fmt(Math.round(m.bal))+' / 年度預算 '+fmt(Math.round(m.bgt))+'</div></div>';
  });
  uh+='</div></div>';tab.innerHTML+=uh;
}
function renderWarning(){
  if(_wd)return;_wd=true;
  var warn=RAW.filter(function(r){return(parseFloat(r['年度動支率'])||0)>=70;});
  warn.sort(function(a,b){return(parseFloat(b['年度動支率'])||0)-(parseFloat(a['年度動支率'])||0);});
  var tab=document.getElementById('tab-warning');
  if(!warn.length){tab.innerHTML='<div class="info-card" style="text-align:center;color:#7aaa8a;padding:30px">&#x2705; 目前無高用率預警項目</div>';return;}
  var h='<div style="font-size:13px;color:#7aaa8a;margin-bottom:10px">年度動支率 &ge; 70%，共 '+warn.length+' 筆</div>';
  warn.forEach(function(r){
    var yr=parseFloat(r['年度動支率'])||0;var rc2=yr>=90?'red':'';
    var uc=getUnitColor(r['預算主管單位']);
    h+='<div class="warning-card '+rc2+'">'
      +'<div class="warning-name">'+r['明細帳']+' '+r['會計項目']
      +(r['預算主管單位']?'<span class="unit-badge" style="background:'+uc+'1a;color:'+uc+';margin-left:6px">'+r['預算主管單位']+'</span>':'')
      +'</div>'
      +'<div class="warning-sub">年度動支率 <strong style="color:'+(yr>=90?'#c62828':'#e07b00')+'">'+pct(yr)+'</strong> | 年度預算 '+fmt(r['本年度預算'])+' | 剩餘 '+fmt(r['剩餘可動支數'])+'</div>'
      +'</div>';
  });
  tab.innerHTML=h;
}
function renderInfo(){
  if(_id)return;_id=true;
  var tab=document.getElementById('tab-info');
  tab.innerHTML='<div class="info-card">'
    +'<div class="info-row"><span>資料年度</span><span>115 年</span></div>'
    +'<div class="info-row"><span>資料月份</span><span>4 月</span></div>'
    +'<div class="info-row"><span>資料筆數</span><span>'+RAW.length+' 筆</span></div>'
    +'<div class="info-row"><span>科室數量</span><span>'+unitList.length+' 個</span></div>'
    +'<div class="info-row"><span>資料來源</span><span>TAIS/AS400 匯出</span></div>'
    +'<div class="info-row"><span>機構代碼</span><span>3047 彰化營運處</span></div>'
    +'</div>'
    +'<div class="info-card" style="font-size:13px;color:#888;line-height:1.7">'
    +'<strong>iOS 加入主畫面</strong><br>Safari &#x2192; 分享 &#x2B06;&#xFE0F; &#x2192; 加入主畫面<br><br>'
    +'<strong>版本</strong><br>BudgetApp v9 | 115/4'
    +'</div>';
}
function renderCharts(){
  if(_cd)return;_cd=true;
  var root=document.getElementById('tab-charts');
  var ty=0,tb=0,cm={},um={};
  RAW.forEach(function(r){
    var by=parseFloat(r['本年度預算'])||0,bl=parseFloat(r['本月餘額'])||0,rm=parseFloat(r['剩餘可動支數'])||0;
    ty+=by;tb+=bl;
    var c=r['費用分類'];if(!cm[c])cm[c]={bgt:0,bal:0,rem:0};cm[c].bgt+=by;cm[c].bal+=bl;cm[c].rem+=rm;
    var u=r['預算主管單位'];if(!u)return;if(!um[u])um[u]={bgt:0,bal:0};um[u].bgt+=by;um[u].bal+=bl;
  });
  var or2=ty>0?(tb/ty*100):0;
  var kc=or2>=90?'#c62828':or2>=70?'#e07b00':'#128048';
  root.innerHTML='<div class="kpi-grid">'
    +'<div class="kpi-card"><div class="kpi-label">本年度預算</div><div class="kpi-val" style="color:#1a3a2a">'+(ty/1e4).toFixed(0)+'萬</div></div>'
    +'<div class="kpi-card"><div class="kpi-label">累計動支</div><div class="kpi-val" style="color:#1565c0">'+(tb/1e4).toFixed(0)+'萬</div></div>'
    +'<div class="kpi-card"><div class="kpi-label">整體動支率</div><div class="kpi-val" style="color:'+kc+'">'+or2.toFixed(1)+'%</div></div>'
    +'</div>'
    +'<div class="chart-section"><div class="chart-title">&#x1F369; 費用分類預算分配</div><canvas id="cDonut" height="220"></canvas></div>'
    +'<div class="chart-section"><div class="chart-title">&#x1F4CA; 費用分類年度動支率</div><canvas id="cCat" height="200"></canvas></div>'
    +'<div class="chart-section"><div class="chart-title">&#x1F3E2; 各科室年度動支率</div><canvas id="cUnit"></canvas></div>'
    +'<div class="chart-section"><div class="chart-title">&#x1F4E6; 已動支 vs 剩餘可動支（萬元）</div><canvas id="cStack" height="200"></canvas></div>';
  if(typeof Chart==='undefined'){var s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js';s.onload=function(){drawAllCharts(cm,um);};document.head.appendChild(s);}
  else drawAllCharts(cm,um);
}
function drawAllCharts(cm,um){
  var CO=['人事費','業務外包','業務成本','專案建置成本','設備及折舊','管銷費用','其他'];
  var ck=CO.filter(function(c){return cm[c];});
  new Chart(document.getElementById('cDonut'),{type:'doughnut',data:{labels:ck,datasets:[{data:ck.map(function(c){return Math.round(cm[c].bgt/1e4);}),backgroundColor:ck.map(function(c){var cc=CAT_COLORS[c];return cc?cc[1]+'cc':'#7aaa8acc';})}]},options:{plugins:{legend:{position:'bottom',labels:{font:{size:11}}}}}});
  var cr2=ck.map(function(c){var m=cm[c];return m.bgt>0?Math.min(m.bal/m.bgt*100,100):0;});
  new Chart(document.getElementById('cCat'),{type:'bar',data:{labels:ck,datasets:[{data:cr2,backgroundColor:cr2.map(function(r){return r>=90?'#c62828cc':r>=70?'#e07b00cc':'#2e7d32cc';}),borderRadius:6}]},options:{indexAxis:'y',maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{max:100,ticks:{callback:function(v){return v+'%';}}}}}});
  var uk=Object.keys(um).sort(function(a,b){var ra=um[a].bgt>0?um[a].bal/um[a].bgt:0;var rb=um[b].bgt>0?um[b].bal/um[b].bgt:0;return rb-ra;});
  var uc2=document.getElementById('cUnit');uc2.height=Math.max(260,uk.length*26);
  var ur=uk.map(function(u){var m=um[u];return m.bgt>0?Math.min(m.bal/m.bgt*100,100):0;});
  new Chart(uc2,{type:'bar',data:{labels:uk,datasets:[{data:ur,backgroundColor:ur.map(function(r){return r>=90?'#c62828cc':r>=70?'#e07b00cc':'#1565c0cc';}),borderRadius:6}]},options:{indexAxis:'y',maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{max:100,ticks:{callback:function(v){return v+'%';}}}}}});
  new Chart(document.getElementById('cStack'),{type:'bar',data:{labels:ck,datasets:[{label:'已動支',data:ck.map(function(c){return Math.round(cm[c].bal/1e4);}),backgroundColor:'#1565c0cc',borderRadius:4},{label:'剩餘可動支',data:ck.map(function(c){return Math.round(cm[c].rem/1e4);}),backgroundColor:'#2e7d32cc',borderRadius:4}]},options:{indexAxis:'y',maintainAspectRatio:false,plugins:{legend:{position:'bottom'}},scales:{x:{stacked:true,ticks:{callback:function(v){return v+'萬';}}},y:{stacked:true}}}});
}
function openSheet(acc){
  var r=RAW.find(function(x){return x['明細帳']===acc;});if(!r)return;
  var yr=parseFloat(r['年度動支率'])||0;var cr2=parseFloat(r['累計動支率'])||0;
  var uc=getUnitColor(r['預算主管單位']);var cc=CAT_COLORS[r['費用分類']]||['#f5f5f5','#424242'];
  var rem=parseFloat(r['剩餘可動支數'])||0;
  document.getElementById('sheetBody').innerHTML=
    '<div class="sheet-title">'+r['會計項目']+'</div>'
    +'<div class="sheet-code">'+r['明細帳']+'  <span class="cat-badge" style="background:'+cc[0]+';color:'+cc[1]+'">'+r['費用分類']+'</span>'
    +(r['預算主管單位']?'<span class="unit-badge" style="background:'+uc+'1a;color:'+uc+';margin-left:4px">'+r['預算主管單位']+'</span>':'')
    +'</div>'
    +'<div class="sheet-section"><div class="sheet-section-title">本月數據</div>'
    +'<div class="sheet-row"><span>本月餘額（累計）</span><span style="color:#1565c0;font-weight:700">'+fmt(r['本月餘額'])+'</span></div>'
    +'<div class="sheet-row"><span>本月動支增減</span><span>'+fmt(r['本月動支數'])+'</span></div>'
    +'<div class="sheet-row"><span>本月預算數</span><span>'+fmt(r['本月預算數'])+'</span></div>'
    +'<div class="sheet-row"><span>至本月預算數累計</span><span>'+fmt(r['至本月預算數累計'])+'</span></div>'
    +'<div class="sheet-row"><span>累計動支率</span><span style="color:'+rateColor(cr2)+';font-weight:700">'+pct(cr2)+'</span></div>'
    +'</div>'
    +'<div class="sheet-section"><div class="sheet-section-title">年度數據</div>'
    +'<div class="sheet-row"><span>本年度預算</span><span style="font-weight:700">'+fmt(r['本年度預算'])+'</span></div>'
    +'<div class="sheet-row"><span>剩餘可動支數</span><span style="color:'+(rem<0?'#c62828':'#128048')+';font-weight:700">'+fmt(r['剩餘可動支數'])+'</span></div>'
    +'<div class="sheet-row"><span>年度動支率</span><span style="color:'+rateColor(yr)+';font-weight:700">'+pct(yr)+'</span></div>'
    +'</div>'
    +'<div class="sheet-section"><div class="sheet-section-title">年度動支進度</div>'
    +'<div class="progress-bar" style="height:16px"><div class="progress-fill" style="width:'+Math.min(yr,100)+'%;background:'+rateColor(yr)+'"></div></div>'
    +'<div style="text-align:right;font-size:13px;font-weight:700;color:'+rateColor(yr)+';margin-top:6px">'+pct(yr)+'</div>'
    +'</div>';
  document.getElementById('overlay').className='overlay open';
}
document.getElementById('overlay').addEventListener('click',function(e){if(e.target===this)this.className='overlay';});
function switchTab(t){
  document.querySelectorAll('.tab-content').forEach(function(el){el.classList.remove('active');});
  document.querySelectorAll('.tab-btn').forEach(function(el){el.classList.remove('active');});
  var tc=document.getElementById('tab-'+t);if(tc)tc.classList.add('active');
  document.querySelectorAll('[data-tab="'+t+'"]').forEach(function(el){el.classList.add('active');});
  if(t==='summary')renderSummary();if(t==='warning')renderWarning();if(t==='info')renderInfo();if(t==='charts')renderCharts();
}
document.querySelectorAll('.tab-btn').forEach(function(btn){btn.addEventListener('click',function(){switchTab(this.dataset.tab);});});
renderQuery();
</script>
