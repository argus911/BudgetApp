<title>預算管理 彰化營運處 115年5月</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f0f4f0;color:#1a1a1a;padding-bottom:80px}
/* Header */
.hdr{position:sticky;top:0;z-index:100;background:linear-gradient(135deg,#0a4f28 0%,#128048 100%);color:#fff;padding:10px 16px 8px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.hdr-title{font-size:15px;font-weight:700;letter-spacing:.5px}
.hdr-sub{font-size:11px;opacity:.8;margin-top:2px}
.badge{background:rgba(255,255,255,.2);border-radius:12px;padding:2px 8px;font-size:11px;font-weight:600}
/* Top Tabs */
.tab-bar{position:sticky;top:60px;z-index:99;background:#fff;display:flex;overflow-x:auto;border-bottom:2px solid #e0e0e0;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.tab-bar::-webkit-scrollbar{display:none}
.tab-btn{flex-shrink:0;padding:10px 14px;font-size:13px;font-weight:600;color:#666;background:none;border:none;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap;transition:all .2s}
.tab-btn.active{color:#128048;border-bottom-color:#128048}
/* Content */
.tab-content{display:none;padding:12px}
.tab-content.active{display:block}
/* Filter Card */
.filter-card{background:#fff;border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 1px 6px rgba(0,0,0,.08)}
.filter-label{font-size:11px;font-weight:700;color:#666;text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}
.search-box{width:100%;border:1.5px solid #ddd;border-radius:10px;padding:9px 12px;font-size:14px;outline:none;transition:border .2s}
.search-box:focus{border-color:#128048}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{padding:5px 12px;border-radius:20px;border:1.5px solid #ddd;font-size:12px;font-weight:600;background:#f5f5f5;color:#555;cursor:pointer;transition:all .2s}
.chip.active{background:#128048;color:#fff;border-color:#128048}
/* Filter Pills */
.filter-pills{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.pill{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:16px;font-size:11px;font-weight:700}
.pill-cat{background:#e8f5e9;color:#2e7d32}
.pill-unit{background:#e3f2fd;color:#1565c0}
.pill-kw{background:#fff3e0;color:#e65100}
/* Notice */
.notice{background:#fff8e1;border:1.5px solid #ffd54f;border-radius:10px;padding:10px 12px;font-size:12px;color:#5d4037;margin-bottom:12px;line-height:1.5}
/* Stats Cards */
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.stat-card{background:#fff;border-radius:14px;padding:12px;box-shadow:0 1px 6px rgba(0,0,0,.08)}
.stat-label{font-size:10px;color:#888;font-weight:600;text-transform:uppercase;margin-bottom:4px}
.stat-val{font-size:17px;font-weight:700;color:#128048}
.stat-val.blue{color:#1565c0}
/* Result Count */
.result-count{font-size:12px;color:#666;margin-bottom:8px;font-weight:600}
/* Cards */
.card{background:#fff;border-radius:16px;padding:14px;margin-bottom:10px;box-shadow:0 1px 6px rgba(0,0,0,.08);cursor:pointer;transition:transform .1s,box-shadow .1s;border-left:4px solid #128048}
.card:active{transform:scale(.98);box-shadow:0 2px 12px rgba(0,0,0,.12)}
.card-head{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:8px}
.card-code{font-size:13px;font-weight:700;color:#128048;font-family:monospace}
.card-name{font-size:14px;font-weight:600;margin-bottom:4px}
.badges{display:flex;flex-wrap:wrap;gap:4px}
.cat-badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:700;color:#fff}
.unit-badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:700}
.card-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.card-field{background:#f8f9fa;border-radius:8px;padding:7px 10px}
.field-label{font-size:10px;color:#888;margin-bottom:2px;font-weight:600}
.field-val{font-size:14px;font-weight:700}
.field-val.green{color:#2e7d32}
.field-val.red{color:#c62828}
.field-val.blue{color:#1565c0}
.field-val.orange{color:#e07b00}
/* Progress Bar */
.prog-wrap{margin-top:8px}
.prog-label{display:flex;justify-content:space-between;font-size:11px;color:#666;margin-bottom:3px}
.prog-bar{height:6px;background:#e0e0e0;border-radius:3px;overflow:hidden}
.prog-fill{height:100%;border-radius:3px;transition:width .4s}
/* Pagination */
.pagi{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:12px}
.pagi button{padding:7px 16px;border-radius:10px;border:1.5px solid #128048;background:#fff;color:#128048;font-weight:700;cursor:pointer;font-size:13px}
.pagi button:disabled{opacity:.35;cursor:default}
.pagi span{font-size:13px;color:#555;font-weight:600}
/* Summary Tab */
.summary-card{background:#fff;border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 1px 6px rgba(0,0,0,.08)}
.summary-title{font-size:14px;font-weight:700;color:#128048;margin-bottom:12px}
.bar-row{margin-bottom:12px}
.bar-meta{display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px}
.bar-name{font-weight:600;color:#333}
.bar-pct{font-weight:700}
.bar-track{height:8px;background:#e8f5e9;border-radius:4px;overflow:hidden}
.bar-fill{height:100%;border-radius:4px}
/* Warning Tab */
.warn-card{background:#fff;border-radius:14px;padding:12px;margin-bottom:8px;border-left:4px solid #e07b00;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.warn-card.high{border-left-color:#c62828}
/* Info Tab */
.info-card{background:#fff;border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 1px 6px rgba(0,0,0,.08)}
.info-row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #f0f0f0;font-size:13px}
.info-row:last-child{border:none}
/* Charts Tab */
.kpi-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:14px}
.kpi-card{background:#fff;border-radius:14px;padding:10px 8px;text-align:center;box-shadow:0 1px 6px rgba(0,0,0,.08)}
.kpi-label{font-size:10px;color:#888;font-weight:600;margin-bottom:4px}
.kpi-val{font-size:16px;font-weight:700}
.chart-wrap{background:#fff;border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 1px 6px rgba(0,0,0,.08)}
.chart-title{font-size:13px;font-weight:700;color:#333;margin-bottom:10px}

.bot-nav{position:fixed;bottom:0;left:0;right:0;z-index:100;background:#fff;display:flex;border-top:1px solid #e0e0e0;box-shadow:0 -2px 8px rgba(0,0,0,.08)}

.bot-btn.active{color:#128048}
.bot-btn .icon{font-size:18px;line-height:1}

.overlay{display:none;position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.5);align-items:flex-end}
.overlay.open{display:flex}
.sheet{background:#fff;border-radius:20px 20px 0 0;padding:20px 16px;max-height:80vh;overflow-y:auto;width:100%;animation:slideUp .3s ease}

.sheet-handle{width:40px;height:4px;background:#ddd;border-radius:2px;margin:0 auto 16px}
.sheet-title{font-size:17px;font-weight:700;margin-bottom:14px;color:#128048}
.sheet-section{margin-bottom:14px}
.sheet-sec-title{font-size:11px;font-weight:700;color:#888;text-transform:uppercase;margin-bottom:8px;letter-spacing:.5px}

.sheet-field{background:#f8f9fa;border-radius:10px;padding:10px}
.sheet-field-label{font-size:10px;color:#888;margin-bottom:3px;font-weight:600}
.sheet-field-val{font-size:15px;font-weight:700}

// ── Tab Switching ───────────────────────────────
var activeTab = 'query';
var _summaryReady = false, _warnReady = false, _chartsReady = false;

function switchTab(name) {
  document.querySelectorAll('.tab-content').forEach(function(el){ el.classList.remove('active'); });
  document.querySelectorAll('.tab-btn,.bot-btn').forEach(function(el){ el.classList.remove('active'); });
  var tc = document.getElementById('tab-'+name);
  if(tc) tc.classList.add('active');
  document.querySelectorAll('[data-tab="'+name+'"]').forEach(function(el){ el.classList.add('active'); });
  activeTab = name;
  if(name === 'summary' && !_summaryReady) { renderSummary(); _summaryReady=true; }
  if(name === 'warning' && !_warnReady)  { renderWarning(); _warnReady=true; }
  if(name === 'charts'  && !_chartsReady){ renderCharts(); _chartsReady=true; }
}
document.querySelectorAll('[data-tab]').forEach(function(btn){
  btn.addEventListener('click', function(){ switchTab(this.dataset.tab); });
});

// ── Filters ────────────────────────────────────
var filterCat='all', filterUnit='all', filterKw='';
var PAGE_SIZE=20, curPage=1;

var CATS = ['all','人事費','業務外包','業務成本','專案建置成本','設備及折舊','管銷費用','其他'];
var unitSet={};
RAW.forEach(function(r){ if(r['預算主管單位']) unitSet[r['預算主管單位']]=true; });
var UNITS = ['all'].concat(Object.keys(unitSet).sort());

function buildChips(ids, arr, getter, setter, suffix){
  var el = document.getElementById(ids);
  arr.forEach(function(v){
    var btn = document.createElement('button');
    btn.className = 'chip' + (getter()===v?' active':'');
    btn.textContent = v==='all'?'全部':v;
    btn.dataset.val = v;
    btn.addEventListener('click', function(){
      setter(this.dataset.val);
      document.querySelectorAll('#'+ids+' .chip').forEach(function(c){ c.classList.remove('active'); });
      this.classList.add('active');
      curPage=1; renderCards();
    });
    el.appendChild(btn);
  });
}
buildChips('catChips', CATS, function(){return filterCat;}, function(v){filterCat=v;}, 'c');
buildChips('unitChips', UNITS, function(){return filterUnit;}, function(v){filterUnit=v;}, 'u');

document.getElementById('kwInput').addEventListener('input', function(){
  filterKw=this.value.trim().toLowerCase(); curPage=1; renderCards();
});

function getFiltered(){
  return RAW.filter(function(r){
    var catOk  = filterCat==='all' || r['費用分類']===filterCat;
    var unitOk = filterUnit==='all' || r['預算主管單位']===filterUnit;
    var kwOk   = !filterKw ||
      r['明細帳'].toLowerCase().indexOf(filterKw)>=0 ||
      r['會計項目'].toLowerCase().indexOf(filterKw)>=0;
    return catOk && unitOk && kwOk;
  });
}

// ── Filter Pills ────────────────────────────────
function renderPills(){
  var el=document.getElementById('filterPills'); el.innerHTML='';
  if(filterCat!=='all'){
    var p=document.createElement('span'); p.className='pill pill-cat';
    p.textContent='📁 '+filterCat; el.appendChild(p);
  }
  if(filterUnit!=='all'){
    var p=document.createElement('span'); p.className='pill pill-unit';
    p.textContent='🏢 '+filterUnit; el.appendChild(p);
  }
  if(filterKw){
    var p=document.createElement('span'); p.className='pill pill-kw';
    p.textContent='🔍 '+filterKw; el.appendChild(p);
  }
}

// ── Format Numbers ─────────────────────────────
function fmt(n){
  if(n==='' || n===null || n===undefined) return '—';
  return Math.round(n).toLocaleString('zh-TW');
}
function fmtPct(n){
  if(n==='' || n===null || n===undefined) return '—';
  return parseFloat(n).toFixed(2)+'%';
}
function pctColor(n){
  if(typeof n !== 'number') return '#333';
  return n>=90?'#c62828':n>=70?'#e07b00':'#2e7d32';
}
function progColor(n){
  return n>=90?'#c62828':n>=70?'#e07b00':'#2e7d32';
}

// ── Stats Cards ────────────────────────────────
function renderStats(filtered){
  var totBal=0,totMon=0,totYr=0,totRem=0;
  filtered.forEach(function(r){
    totBal += (typeof r['本月餘額']==='number'?r['本月餘額']:0);
    totMon += (typeof r['本月預算數']==='number'?r['本月預算數']:0);
    totYr  += (typeof r['本年度預算']==='number'?r['本年度預算']:0);
    totRem += (typeof r['剩餘可動支數']==='number'?r['剩餘可動支數']:0);
  });
  document.getElementById('s1').textContent=fmt(totBal);
  document.getElementById('s2').textContent=fmt(totMon);
  document.getElementById('s3').textContent=fmt(totYr);
  var s4=document.getElementById('s4');
  s4.textContent=fmt(totRem);
  s4.className='stat-val'+(totRem<0?' red':' green');
}

// ── Cards ──────────────────────────────────────
function renderCards(){
  renderPills();
  var filtered = getFiltered();
  document.getElementById('totalBadge').textContent = filtered.length+' 筆';
  document.getElementById('resultCount').textContent = '共 '+filtered.length+' 筆';
  renderStats(filtered);
  var pages = Math.max(1, Math.ceil(filtered.length/PAGE_SIZE));
  if(curPage>pages) curPage=1;
  var slice = filtered.slice((curPage-1)*PAGE_SIZE, curPage*PAGE_SIZE);
  var el = document.getElementById('cardList'); el.innerHTML='';
  slice.forEach(function(r){
    var yr = typeof r['年度動支率']==='number' ? r['年度動支率'] : 0;
    var cc = CAT_COLORS[r['費用分類']] || '#78909c';
    var uc = UNIT_PALETTE[r['預算主管單位']] || '';
    var unitHtml = r['預算主管單位']
      ? '<span class="unit-badge" style="background:'+uc+'1a;color:'+uc+'">'+r['預算主管單位']+'</span>'
      : '';
    var rem = typeof r['剩餘可動支數']==='number' ? r['剩餘可動支數'] : 0;
    var remColor = rem<0 ? 'red' : 'green';
    var pct = typeof r['累計動支率']==='number' ? r['累計動支率'] : 0;
    var div = document.createElement('div');
    div.className = 'card';
    div.dataset.acc = r['明細帳'];
    div.innerHTML = '<div class="card-head"><div><div class="card-code">'+r['明細帳']+'</div><div class="card-name">'+r['會計項目']+'</div><div class="badges"><span class="cat-badge" style="background:'+cc+'">'+r['費用分類']+'</span>'+unitHtml+'</div></div></div>'
      +'<div class="card-grid">'
      +'<div class="card-field"><div class="field-label">累計動支（本月餘額）</div><div class="field-val blue">'+fmt(r['本月餘額'])+'</div></div>'
      +'<div class="card-field"><div class="field-label">累計動支率</div><div class="field-val" style="color:'+pctColor(pct)+'">'+fmtPct(pct)+'</div></div>'
      +'<div class="card-field"><div class="field-label">本年度預算</div><div class="field-val">'+fmt(r['本年度預算'])+'</div></div>'
      +'<div class="card-field"><div class="field-label">剩餘可動支</div><div class="field-val '+remColor+'">'+fmt(rem)+'</div></div>'
      +'</div>'
      +'<div class="prog-wrap"><div class="prog-label"><span>年度動支率</span><span style="color:'+pctColor(yr)+'">'+fmtPct(yr)+'</span></div>'
      +'<div class="prog-bar"><div class="prog-fill" style="width:'+Math.min(100,yr)+'%;background:'+progColor(yr)+'"></div></div></div>';
    div.addEventListener('click', function(){ openSheet(this.dataset.acc); });
    el.appendChild(div);
  });
  // Pagination
  var pagi = document.getElementById('pagi'); pagi.innerHTML='';
  if(pages>1){
    var prev = document.createElement('button');
    prev.textContent='◀'; prev.disabled=(curPage===1);
    prev.addEventListener('click', function(){ if(curPage>1){curPage--; renderCards(); window.scrollTo(0,0);} });
    var info = document.createElement('span'); info.textContent=curPage+' / '+pages;
    var next = document.createElement('button');
    next.textContent='▶'; next.disabled=(curPage===pages);
    next.addEventListener('click', function(){ if(curPage<pages){curPage++; renderCards(); window.scrollTo(0,0);} });
    pagi.appendChild(prev); pagi.appendChild(info); pagi.appendChild(next);
  }
}

// ── Sheet ──────────────────────────────────────
function openSheet(acc){
  var r = RAW.find(function(x){ return x['明細帳']===acc; });
  if(!r) return;
  var cc = CAT_COLORS[r['費用分類']] || '#78909c';
  var uc = UNIT_PALETTE[r['預算主管單位']] || '#888';
  var unitBadge = r['預算主管單位']
    ? '<span class="unit-badge" style="background:'+uc+'1a;color:'+uc+'">'+r['預算主管單位']+'</span>'
    : '';
  var yr = typeof r['年度動支率']==='number' ? r['年度動支率'] : 0;
  document.getElementById('sheetTitle').innerHTML =
    '<span style="color:#128048;font-family:monospace">'+r['明細帳']+'</span> '+r['會計項目']
    +'<div class="badges" style="margin-top:6px"><span class="cat-badge" style="background:'+cc+'">'+r['費用分類']+'</span>'+unitBadge+'</div>';
  var rem = typeof r['剩餘可動支數']==='number' ? r['剩餘可動支數'] : 0;
  var remC = rem<0?'#c62828':'#2e7d32';
  document.getElementById('sheetBody').innerHTML =
    '<div class="sheet-section"><div class="sheet-sec-title">本月數據</div>'
    +'<div class="sheet-grid">'
    +'<div class="sheet-field"><div class="sheet-field-label">本月動支數</div><div class="sheet-field-val">'+fmt(r['本月動支數'])+'</div></div>'
    +'<div class="sheet-field"><div class="sheet-field-label">本月預算數</div><div class="sheet-field-val">'+fmt(r['本月預算數'])+'</div></div>'
    +'<div class="sheet-field"><div class="sheet-field-label">至本月預算累計</div><div class="sheet-field-val">'+fmt(r['至本月預算數累計'])+'</div></div>'
    +'<div class="sheet-field"><div class="sheet-field-label">累計動支率</div><div class="sheet-field-val" style="color:'+pctColor(r['累計動支率'])+'">'+fmtPct(r['累計動支率'])+'</div></div>'
    +'</div></div>'
    +'<div class="sheet-section"><div class="sheet-sec-title">年度數據</div>'
    +'<div class="sheet-grid">'
    +'<div class="sheet-field"><div class="sheet-field-label">本年度預算</div><div class="sheet-field-val">'+fmt(r['本年度預算'])+'</div></div>'
    +'<div class="sheet-field"><div class="sheet-field-label">累計動支（本月餘額）</div><div class="sheet-field-val" style="color:#1565c0">'+fmt(r['本月餘額'])+'</div></div>'
    +'<div class="sheet-field"><div class="sheet-field-label">剩餘可動支</div><div class="sheet-field-val" style="color:'+remC+'">'+fmt(rem)+'</div></div>'
    +'<div class="sheet-field"><div class="sheet-field-label">年度動支率</div><div class="sheet-field-val" style="color:'+pctColor(yr)+'">'+fmtPct(yr)+'</div></div>'
    +'</div></div>'
    +'<div class="sheet-section"><div class="sheet-sec-title">年度動支進度</div>'
    +'<div class="prog-wrap"><div class="prog-label"><span>動支率</span><span style="color:'+pctColor(yr)+'">'+fmtPct(yr)+'</span></div>'
    +'<div class="prog-bar" style="height:10px"><div class="prog-fill" style="width:'+Math.min(100,yr)+'%;background:'+progColor(yr)+'"></div></div></div></div>';
  document.getElementById('overlay').className='overlay open';
}
document.getElementById('overlay').addEventListener('click', function(e){
  if(e.target===this) this.className='overlay';
});

// ── Summary Tab ─────────────────────────────────
function renderSummary(){
  // Overall
  var totYr=0, totBal=0, totRem=0;
  RAW.forEach(function(r){
    totYr  += (typeof r['本年度預算']==='number'?r['本年度預算']:0);
    totBal += (typeof r['本月餘額']==='number'?r['本月餘額']:0);
    totRem += (typeof r['剩餘可動支數']==='number'?r['剩餘可動支數']:0);
  });
  var overallPct = totYr>0 ? (totBal/totYr*100) : 0;
  var oc = document.getElementById('overallCard');
  oc.innerHTML = '<div class="summary-title">📌 整體預算概況</div>'
    +'<div class="bar-row"><div class="bar-meta"><span class="bar-name">本年度預算</span><strong>'+fmt(totYr)+'</strong></div></div>'
    +'<div class="bar-row"><div class="bar-meta"><span class="bar-name">累計動支</span><strong style="color:#1565c0">'+fmt(totBal)+'</strong></div></div>'
    +'<div class="bar-row"><div class="bar-meta"><span class="bar-name">整體年度動支率</span><strong style="color:'+pctColor(overallPct)+'">'+overallPct.toFixed(2)+'%</strong></div>'
    +'<div class="bar-track"><div class="bar-fill" style="width:'+Math.min(100,overallPct)+'%;background:'+progColor(overallPct)+'"></div></div></div>'
    +'<div class="bar-row"><div class="bar-meta"><span class="bar-name">剩餘可動支</span><strong style="color:'+(totRem<0?'#c62828':'#2e7d32')+'">'+fmt(totRem)+'</strong></div></div>';

  // Category Summary
  var catMap={};
  RAW.forEach(function(r){
    var c=r['費用分類'];
    if(!catMap[c]) catMap[c]={yr:0,bal:0};
    catMap[c].yr  += (typeof r['本年度預算']==='number'?r['本年度預算']:0);
    catMap[c].bal += (typeof r['本月餘額']==='number'?r['本月餘額']:0);
  });
  var cs=document.getElementById('catSummary');
  var html='<div class="summary-title">📁 費用分類動支率</div>';
  Object.keys(catMap).forEach(function(c){
    var m=catMap[c], pct=m.yr>0?(m.bal/m.yr*100):0;
    var cc=CAT_COLORS[c]||'#78909c';
    html+='<div class="bar-row">'
      +'<div class="bar-meta"><span class="bar-name" style="color:'+cc+'">'+c+'</span>'
      +'<span class="bar-pct" style="color:'+pctColor(pct)+'">'+pct.toFixed(1)+'%</span></div>'
      +'<div style="font-size:10px;color:#999;margin-bottom:3px">動支: '+fmt(m.bal)+' ／ 預算: '+fmt(m.yr)+'</div>'
      +'<div class="bar-track"><div class="bar-fill" style="width:'+Math.min(100,pct)+'%;background:'+cc+'"></div></div>'
      +'</div>';
  });
  cs.innerHTML=html;

  // Unit Summary
  var unitMap={};
  RAW.forEach(function(r){
    if(!r['預算主管單位']) return;
    var u=r['預算主管單位'];
    if(!unitMap[u]) unitMap[u]={yr:0,bal:0};
    unitMap[u].yr  += (typeof r['本年度預算']==='number'?r['本年度預算']:0);
    unitMap[u].bal += (typeof r['本月餘額']==='number'?r['本月餘額']:0);
  });
  var us=document.getElementById('unitSummary');
  var uhtml='<div class="summary-title">🏢 各科室動支率</div>';
  Object.keys(unitMap).sort(function(a,b){
    var pa=unitMap[a].yr>0?unitMap[a].bal/unitMap[a].yr:0;
    var pb=unitMap[b].yr>0?unitMap[b].bal/unitMap[b].yr:0;
    return pb-pa;
  }).forEach(function(u){
    var m=unitMap[u], pct=m.yr>0?(m.bal/m.yr*100):0;
    var uc=UNIT_PALETTE[u]||'#888';
    uhtml+='<div class="bar-row">'
      +'<div class="bar-meta"><span class="bar-name" style="color:'+uc+'">'+u+'</span>'
      +'<span class="bar-pct" style="color:'+pctColor(pct)+'">'+pct.toFixed(1)+'%</span></div>'
      +'<div class="bar-track"><div class="bar-fill" style="width:'+Math.min(100,pct)+'%;background:'+uc+'"></div></div>'
      +'</div>';
  });
  us.innerHTML=uhtml;
}

// ── Warning Tab ─────────────────────────────────
function renderWarning(){
  var warns = RAW.filter(function(r){ return typeof r['年度動支率']==='number' && r['年度動支率']>=70; });
  warns.sort(function(a,b){ return b['年度動支率']-a['年度動支率']; });
  var el=document.getElementById('warnList');
  if(!warns.length){ el.innerHTML='<div style="text-align:center;padding:40px;color:#888">✅ 無高用率項目</div>'; return; }
  var html='<div style="font-size:12px;color:#666;margin-bottom:8px;font-weight:600">年度動支率 ≥ 70% 計 '+warns.length+' 筆</div>';
  warns.forEach(function(r){
    var yr=r['年度動支率'], isHigh=yr>=90;
    var uc=UNIT_PALETTE[r['預算主管單位']]||'';
    var unitBadge=r['預算主管單位']?'<span class="unit-badge" style="background:'+uc+'1a;color:'+uc+'">'+r['預算主管單位']+'</span>':'';
    html+='<div class="warn-card'+(isHigh?' high':'')+'">'
      +'<div style="font-weight:700;font-size:13px;color:#128048;font-family:monospace">'+r['明細帳']+'</div>'
      +'<div style="font-size:14px;font-weight:600;margin:3px 0">'+r['會計項目']+'</div>'
      +'<div class="badges" style="margin-bottom:6px"><span class="cat-badge" style="background:'+(CAT_COLORS[r['費用分類']]||'#78909c')+'">'+r['費用分類']+'</span>'+unitBadge+'</div>'
      +'<div style="display:flex;justify-content:space-between;font-size:12px">'
      +'<span>年度預算: '+fmt(r['本年度預算'])+'</span>'
      +'<strong style="color:'+(isHigh?'#c62828':'#e07b00')+'">動支率 '+fmtPct(yr)+'</strong>'
      +'</div></div>';
  });
  el.innerHTML=html;
}

// ── Charts Tab ──────────────────────────────────
function renderCharts(){
  var root=document.getElementById('chartsRoot');

  // KPI Cards
  var totYr=0,totBal=0,totRem=0;
  RAW.forEach(function(r){
    totYr  +=(typeof r['本年度預算']==='number'?r['本年度預算']:0);
    totBal +=(typeof r['本月餘額']==='number'?r['本月餘額']:0);
    totRem +=(typeof r['剩餘可動支數']==='number'?r['剩餘可動支數']:0);
  });
  var overallPct=totYr>0?(totBal/totYr*100):0;
  var kpiHtml='<div class="kpi-grid">'
    +'<div class="kpi-card"><div class="kpi-label">本年度預算</div><div class="kpi-val" style="color:#1976d2;font-size:13px">'+Math.round(totYr/10000)+'萬</div></div>'
    +'<div class="kpi-card"><div class="kpi-label">累計動支</div><div class="kpi-val" style="color:#1565c0;font-size:13px">'+Math.round(totBal/10000)+'萬</div></div>'
    +'<div class="kpi-card"><div class="kpi-label">整體動支率</div><div class="kpi-val" style="color:'+pctColor(overallPct)+'">'+overallPct.toFixed(1)+'%</div></div>'
    +'</div>';

  // Chart containers
  var chartsHtml=kpiHtml
    +'<div class="chart-wrap"><div class="chart-title">🍩 費用分類年度預算分配</div><div style="height:220px;position:relative"><canvas id="cDonut"></canvas></div></div>'
    +'<div class="chart-wrap"><div class="chart-title">📊 費用分類年度動支率</div><div style="height:240px;position:relative"><canvas id="cCatBar"></canvas></div></div>'
    +'<div class="chart-wrap"><div class="chart-title">🏢 各科室年度動支率</div><div id="unitBarWrap" style="position:relative"><canvas id="cUnitBar"></canvas></div></div>'
    +'<div class="chart-wrap"><div class="chart-title">📦 費用分類：已動支 vs 剩餘（萬元）</div><div style="height:260px;position:relative"><canvas id="cStack"></canvas></div></div>';
  root.innerHTML=chartsHtml;

  // Load Chart.js CDN
  if(typeof Chart==='undefined'){
    var s=document.createElement('script');
    s.src='https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js';
    s.onload=function(){ drawAllCharts(); };
    document.head.appendChild(s);
  } else { drawAllCharts(); }

  function drawAllCharts(){
    // Prepare category data
    var catKeys=['人事費','業務外包','業務成本','專案建置成本','設備及折舊','管銷費用','其他'];
    var catYr={}, catBal={};
    catKeys.forEach(function(c){ catYr[c]=0; catBal[c]=0; });
    RAW.forEach(function(r){
      var c=r['費用分類']||'其他';
      if(!catYr[c]) catYr[c]=0;
      if(!catBal[c]) catBal[c]=0;
      catYr[c]  +=(typeof r['本年度預算']==='number'?r['本年度預算']:0);
      catBal[c] +=(typeof r['本月餘額']==='number'?r['本月餘額']:0);
    });
    var activeCats=catKeys.filter(function(c){ return catYr[c]>0; });
    var catColors=activeCats.map(function(c){ return CAT_COLORS[c]||'#78909c'; });

    // Donut
    new Chart(document.getElementById('cDonut'),{
      type:'doughnut',
      data:{ labels:activeCats, datasets:[{ data:activeCats.map(function(c){ return Math.round(catYr[c]/10000); }), backgroundColor:catColors }] },
      options:{ maintainAspectRatio:false, plugins:{ legend:{ position:'right', labels:{ font:{ size:11 }, boxWidth:12 } } } }
    });

    // Cat Bar
    var catPcts=activeCats.map(function(c){ return catYr[c]>0?(catBal[c]/catYr[c]*100):0; });
    var catBarColors=catPcts.map(function(p){ return p>=90?'#c62828':p>=70?'#e07b00':'#2e7d32'; });
    new Chart(document.getElementById('cCatBar'),{
      type:'bar',
      data:{ labels:activeCats, datasets:[{ data:catPcts, backgroundColor:catBarColors, label:'動支率%' }] },
      options:{ indexAxis:'y', maintainAspectRatio:false,
        plugins:{ legend:{ display:false } },
        scales:{ x:{ max:100, ticks:{ callback:function(v){ return v+'%'; } } }, y:{ ticks:{ font:{ size:11 } } } }
      }
    });

    // Unit Bar
    var unitMap={};
    RAW.forEach(function(r){
      if(!r['預算主管單位']) return;
      var u=r['預算主管單位'];
      if(!unitMap[u]) unitMap[u]={yr:0,bal:0};
      unitMap[u].yr  +=(typeof r['本年度預算']==='number'?r['本年度預算']:0);
      unitMap[u].bal +=(typeof r['本月餘額']==='number'?r['本月餘額']:0);
    });
    var unitKeys=Object.keys(unitMap).sort(function(a,b){
      var pa=unitMap[a].yr>0?unitMap[a].bal/unitMap[a].yr*100:0;
      var pb=unitMap[b].yr>0?unitMap[b].bal/unitMap[b].yr*100:0;
      return pb-pa;
    });
    var unitPcts=unitKeys.map(function(u){ return unitMap[u].yr>0?(unitMap[u].bal/unitMap[u].yr*100):0; });
    var unitColors=unitKeys.map(function(u){ return UNIT_PALETTE[u]||'#888'; });
    var uHeight=Math.max(260,unitKeys.length*28);
    document.getElementById('unitBarWrap').style.height=uHeight+'px';
    new Chart(document.getElementById('cUnitBar'),{
      type:'bar',
      data:{ labels:unitKeys, datasets:[{ data:unitPcts, backgroundColor:unitColors, label:'動支率%' }] },
      options:{ indexAxis:'y', maintainAspectRatio:false,
        plugins:{ legend:{ display:false } },
        scales:{ x:{ max:100, ticks:{ callback:function(v){ return v+'%'; } } }, y:{ ticks:{ font:{ size:11 } } } }
      }
    });

    // Stacked Bar
    var catRem=activeCats.map(function(c){ return Math.round((catYr[c]-catBal[c])/10000); });
    var catBalW=activeCats.map(function(c){ return Math.round(catBal[c]/10000); });
    new Chart(document.getElementById('cStack'),{
      type:'bar',
      data:{ labels:activeCats, datasets:[
        { label:'已動支(萬)', data:catBalW, backgroundColor:'#e57373' },
        { label:'剩餘可動支(萬)', data:catRem, backgroundColor:'#81c784' }
      ] },
      options:{ indexAxis:'y', maintainAspectRatio:false,
        plugins:{ legend:{ position:'top', labels:{ font:{ size:11 }, boxWidth:12 } } },
        scales:{ x:{ stacked:true }, y:{ stacked:true } }
      }
    });
  }
}

// ── Init ────────────────────────────────────────
document.getElementById('updTime').textContent = new Date().toLocaleString('zh-TW');
renderCards();
</script>
