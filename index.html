<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f0f4f0;color:#1a1a1a;}
.header{background:linear-gradient(135deg,#0d5c30 0%,#128048 60%,#1a9655 100%);color:#fff;padding:14px 16px 10px;position:sticky;top:0;z-index:100;}
.header h1{font-size:17px;font-weight:700;letter-spacing:.5px;}
.header .sub{font-size:11px;opacity:.85;margin-top:2px;}
.badge{display:inline-block;background:rgba(255,255,255,.22);border-radius:10px;padding:1px 8px;font-size:11px;margin-left:6px;}
.tab-bar{display:flex;background:#fff;border-bottom:1px solid #e0e0e0;position:sticky;top:57px;z-index:99;overflow-x:auto;}
.tab-bar::-webkit-scrollbar{display:none;}
.tab-btn{flex:none;padding:10px 14px;font-size:13px;font-weight:500;color:#666;border:none;background:none;cursor:pointer;white-space:nowrap;border-bottom:2.5px solid transparent;transition:all .2s;}
.tab-btn.active{color:#128048;border-bottom-color:#128048;font-weight:700;}
.tab-content{display:none;padding:12px;min-height:calc(100vh - 160px);}
.tab-content.active{display:block;}
.filter-card{background:#fff;border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 1px 6px rgba(0,0,0,.06);}
.filter-card h3{font-size:13px;color:#555;margin-bottom:8px;}
.search-box{width:100%;padding:9px 12px;border:1.5px solid #ddd;border-radius:10px;font-size:14px;outline:none;}
.search-box:focus{border-color:#128048;}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
.chip{padding:5px 12px;border-radius:20px;font-size:12px;border:1.5px solid #ddd;background:#fff;cursor:pointer;transition:all .2s;}
.chip.active{background:#128048;color:#fff;border-color:#128048;}
.active-filters{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;}
.filter-pill{padding:4px 10px;border-radius:14px;font-size:11px;font-weight:600;}
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px;}
.stat-card{background:#fff;border-radius:14px;padding:12px;box-shadow:0 1px 5px rgba(0,0,0,.05);}
.stat-card .lbl{font-size:11px;color:#777;margin-bottom:4px;}
.stat-card .val{font-size:18px;font-weight:700;color:#0d5c30;}
.stat-card .unit{font-size:11px;color:#888;}
.result-count{font-size:13px;color:#555;margin-bottom:8px;font-weight:600;}
.card{background:#fff;border-radius:16px;padding:14px;margin-bottom:10px;box-shadow:0 1px 6px rgba(0,0,0,.07);cursor:pointer;transition:transform .1s;}
.card:active{transform:scale(.98);}
.card-code{font-size:13px;font-weight:700;color:#0d5c30;}
.card-name{font-size:14px;font-weight:600;margin:4px 0 6px;}
.badges{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px;}
.cat-badge,.unit-badge{padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600;}
.card-body{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.card-item .lbl{font-size:11px;color:#888;}
.card-item .val{font-size:15px;font-weight:700;}
.progress-bar{height:5px;background:#e8f5e9;border-radius:3px;margin-top:6px;overflow:hidden;}
.progress-fill{height:100%;border-radius:3px;}
.notice{background:#fffde7;border:1px solid #f9a825;border-radius:10px;padding:10px 12px;font-size:12px;color:#5c4000;margin-bottom:10px;}
.pagination{display:flex;justify-content:center;gap:8px;margin-top:12px;padding-bottom:80px;flex-wrap:wrap;}
.page-btn{padding:8px 16px;border-radius:10px;border:1.5px solid #128048;background:#fff;color:#128048;font-size:13px;font-weight:600;cursor:pointer;}
.page-btn.active{background:#128048;color:#fff;}
.summary-section{background:#fff;border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 1px 6px rgba(0,0,0,.06);}
.summary-section h3{font-size:14px;font-weight:700;color:#0d5c30;margin-bottom:12px;}
.bar-row{margin-bottom:10px;}
.bar-label{display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px;}
.bar-track{height:10px;background:#e8f5e9;border-radius:5px;overflow:hidden;}
.bar-fill{height:100%;border-radius:5px;}
.warn-card{background:#fff;border-radius:14px;padding:12px;margin-bottom:8px;border-left:4px solid #e07b00;box-shadow:0 1px 5px rgba(0,0,0,.06);}
.warn-card.red{border-left-color:#c62828;}
.info-card{background:#fff;border-radius:14px;padding:14px;margin-bottom:10px;box-shadow:0 1px 5px rgba(0,0,0,.05);}
.info-row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #f0f0f0;font-size:13px;}
.overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:200;opacity:0;pointer-events:none;transition:opacity .3s;}
.overlay.open{opacity:1;pointer-events:all;}
.sheet{position:absolute;bottom:0;left:0;right:0;background:#fff;border-radius:20px 20px 0 0;padding:20px;max-height:85vh;overflow-y:auto;transform:translateY(100%);transition:transform .3s;}
.overlay.open .sheet{transform:translateY(0);}
.sheet-title{font-size:16px;font-weight:700;color:#0d5c30;margin-bottom:14px;}
.sheet-section{background:#f8fdf9;border-radius:12px;padding:12px;margin-bottom:10px;}
.sheet-section h4{font-size:12px;color:#128048;font-weight:700;margin-bottom:8px;}
.sheet-row{display:flex;justify-content:space-between;padding:4px 0;font-size:13px;}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e0e0e0;display:flex;z-index:100;padding-bottom:env(safe-area-inset-bottom);}
.bottom-nav .tab-btn{flex:1;padding:10px 4px;font-size:11px;text-align:center;}
.kpi-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px;}
.kpi-card{background:#fff;border-radius:14px;padding:12px;box-shadow:0 1px 5px rgba(0,0,0,.06);text-align:center;}
.kpi-card.full{grid-column:1/-1;}
.kpi-label{font-size:11px;color:#777;margin-bottom:4px;}
.kpi-value{font-size:20px;font-weight:700;}
.kpi-unit{font-size:11px;color:#888;}
.chart-section{background:#fff;border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 1px 6px rgba(0,0,0,.06);}
.chart-section h3{font-size:14px;font-weight:700;color:#0d5c30;margin-bottom:12px;}
canvas{max-width:100%;}
</style>
</head>

});

RAW.forEach(function(r){if(r['預算主管單位'])unitSet[r['預算主管單位']]=true;});
var unitChipsEl=document.getElementById('unitChips');
['all'].concat(Object.keys(unitSet).sort()).forEach(function(u){
  var chip=document.createElement('button');
  chip.className='chip'+(u==='all'?' active':'');
  chip.textContent=u==='all'?'全部':u;
  chip.dataset.val=u;
  chip.addEventListener('click',function(){
    curUnit=this.dataset.val;
    unitChipsEl.querySelectorAll('.chip').forEach(function(x){x.classList.toggle('active',x.dataset.val===curUnit);});
    curPage=1;render();
  });
  unitChipsEl.appendChild(chip);
});
document.getElementById('searchBox').addEventListener('input',function(){curSearch=this.value.toLowerCase().trim();curPage=1;render();});
function renderStats(rows){
  var tb=0,tg=0,ta=0,tr=0;
  rows.forEach(function(r){tb+=parseFloat(r['本月餘額'])||0;tg+=parseFloat(r['本月預算數'])||0;ta+=parseFloat(r['本年度預算'])||0;tr+=parseFloat(r['剩餘可動支數'])||0;});
  document.getElementById('statsGrid').innerHTML=
    '<div class="stat-card"><div class="lbl">本月餘額（累計）</div><div class="val" style="color:#1565c0">'+fmt(Math.round(tb))+'</div><div class="unit">元</div></div>'+
    '<div class="stat-card"><div class="lbl">本月預算數</div><div class="val">'+fmt(Math.round(tg))+'</div><div class="unit">元</div></div>'+
    '<div class="stat-card"><div class="lbl">本年度預算</div><div class="val">'+fmt(Math.round(ta))+'</div><div class="unit">元</div></div>'+
    '<div class="stat-card"><div class="lbl">剩餘可動支數</div><div class="val" style="color:'+(tr<0?'#c62828':'#128048')+'">'+fmt(Math.round(tr))+'</div><div class="unit">元</div></div>';
}
function render(){
  var rows=filtered();
  document.getElementById('totalBadge').textContent=rows.length+'筆';
  document.getElementById('resultCount').textContent='共 '+rows.length+' 筆';
  renderStats(rows);
  var pills='';
  if(curCat!=='all')pills+='<span class="filter-pill" style="background:#e8f5e9;color:#2e7d32">分類：'+curCat+'</span>';
  if(curUnit!=='all')pills+='<span class="filter-pill" style="background:#e3f2fd;color:#1565c0">科室：'+curUnit+'</span>';
  if(curSearch)pills+='<span class="filter-pill" style="background:#fff8e1;color:#e65100">搜尋：'+curSearch+'</span>';
  document.getElementById('activeFilters').innerHTML=pills;
  var total=rows.length,pages=Math.max(1,Math.ceil(total/PAGE_SIZE));
  if(curPage>pages)curPage=1;
  var start=(curPage-1)*PAGE_SIZE,end=Math.min(start+PAGE_SIZE,total);
  var container=document.getElementById('cardsContainer');
  container.innerHTML='';
  rows.slice(start,end).forEach(function(r){
    var cc=CAT_COLORS[r['費用分類']]||CAT_COLORS['其他'];
    var uc=getUC(r['預算主管單位']);
    var yr=parseFloat(r['年度動支率'])||0;
    var card=document.createElement('div');
    card.className='card';
    card.dataset.acc=r['明細帳'];
    var ub=r['預算主管單位']?'<span class="unit-badge" style="background:'+uc+'1a;color:'+uc+'">'+r['預算主管單位']+'</span>':'';
    card.innerHTML=
      '<div class="card-code">'+r['明細帳']+'</div>'+
      '<div class="card-name">'+r['會計項目']+'</div>'+
      '<div class="badges"><span class="cat-badge" style="background:'+cc.bg+';color:'+cc.color+'">'+r['費用分類']+'</span>'+ub+'</div>'+
      '<div class="card-body">'+
        '<div class="card-item"><div class="lbl">本月餘額（累計）</div><div class="val" style="color:#1565c0">'+fmt(r['本月餘額'])+'</div></div>'+
        '<div class="card-item"><div class="lbl">累計動支率</div><div class="val" style="color:'+rc(r['累計動支率'])+'">'+r['累計動支率']+'%</div></div>'+
        '<div class="card-item"><div class="lbl">本年度預算</div><div class="val">'+fmt(r['本年度預算'])+'</div></div>'+
        '<div class="card-item"><div class="lbl">剩餘可動支數</div><div class="val" style="color:'+((parseFloat(r['剩餘可動支數'])||0)<0?'#c62828':'#128048')+'">'+fmt(r['剩餘可動支數'])+'</div></div>'+
      '</div>'+
      '<div class="progress-bar"><div class="progress-fill" style="width:'+Math.min(100,yr)+'%;background:'+rc(yr)+'"></div></div>'+
      '<div style="font-size:11px;color:'+rc(yr)+';margin-top:3px;text-align:right;">年度動支率 '+r['年度動支率']+'%</div>';
    card.addEventListener('click',function(){openSheet(this.dataset.acc);});
    container.appendChild(card);
  });
  var pgEl=document.getElementById('pagination');
  pgEl.innerHTML='';
  if(pages>1){for(var i=1;i<=pages;i++){var pb=document.createElement('button');pb.className='page-btn'+(i===curPage?' active':'');pb.textContent=i;pb.dataset.pg=i;pb.addEventListener('click',function(){curPage=parseInt(this.dataset.pg);render();window.scrollTo(0,0);});pgEl.appendChild(pb);}}
}
function openSheet(acc){
  var r=RAW.find(function(x){return x['明細帳']===acc;});
  if(!r)return;
  var uc=getUC(r['預算主管單位']);
  document.getElementById('sheetTitle').textContent=r['明細帳']+' '+r['會計項目'];
  var ut=r['預算主管單位']?'<div style="margin-bottom:10px;"><span style="background:'+uc+'1a;color:'+uc+';padding:2px 8px;border-radius:10px;font-size:12px;">'+r['預算主管單位']+'</span></div>':'';
  document.getElementById('sheetBody').innerHTML=ut+
    '<div class="sheet-section"><h4>📅 本月數據</h4>'+
      '<div class="sheet-row"><span>本月動支數</span><strong>'+fmt(r['本月動支數'])+'</strong></div>'+
      '<div class="sheet-row"><span>本月餘額（累計）</span><strong style="color:#1565c0">'+fmt(r['本月餘額'])+'</strong></div>'+
      '<div class="sheet-row"><span>本月預算數</span><strong>'+fmt(r['本月預算數'])+'</strong></div>'+
      '<div class="sheet-row"><span>至本月預算數（累計）</span><strong>'+fmt(r['至本月預算數累計'])+'</strong></div>'+
      '<div class="sheet-row"><span>累計動支率</span><strong style="color:'+rc(r['累計動支率'])+'">'+r['累計動支率']+'%</strong></div>'+
    '</div>'+
    '<div class="sheet-section"><h4>📆 年度數據</h4>'+
      '<div class="sheet-row"><span>本年度預算</span><strong>'+fmt(r['本年度預算'])+'</strong></div>'+
      '<div class="sheet-row"><span>剩餘可動支數</span><strong style="color:'+((parseFloat(r['剩餘可動支數'])||0)<0?'#c62828':'#128048')+'">'+fmt(r['剩餘可動支數'])+'</strong></div>'+
      '<div class="sheet-row"><span>年度動支率</span><strong style="color:'+rc(r['年度動支率'])+'">'+r['年度動支率']+'%</strong></div>'+
    '</div>'+
    '<div class="sheet-section"><h4>📊 年度動支進度</h4>'+
      '<div class="progress-bar" style="height:12px;"><div class="progress-fill" style="height:100%;width:'+Math.min(100,parseFloat(r['年度動支率'])||0)+'%;background:'+rc(r['年度動支率'])+'"></div></div>'+
      '<div style="font-size:12px;margin-top:6px;color:'+rc(r['年度動支率'])+'">'+r['年度動支率']+'%</div>'+
    '</div>';
  document.getElementById('overlay').className='overlay open';
}
document.getElementById('overlay').addEventListener('click',function(e){if(e.target===this)this.className='overlay';});
function renderSummary(){
  var ta=0,tb=0,catM={},unitM={};
  RAW.forEach(function(r){
    var a=parseFloat(r['本年度預算'])||0,b=parseFloat(r['本月餘額'])||0;
    ta+=a;tb+=b;
    if(!catM[r['費用分類']])catM[r['費用分類']]={ann:0,bal:0};
    catM[r['費用分類']].ann+=a;catM[r['費用分類']].bal+=b;
    if(r['預算主管單位']){
      if(!unitM[r['預算主管單位']])unitM[r['預算主管單位']]={ann:0,bal:0};
      unitM[r['預算主管單位']].ann+=a;unitM[r['預算主管單位']].bal+=b;
    }
  });
  var or=ta>0?(tb/ta*100).toFixed(1):0;
  document.getElementById('overallSummary').innerHTML=
    '<div class="bar-row"><div class="bar-label"><span>整體動支率</span><span style="color:'+rc(or)+'">'+or+'%</span></div>'+
    '<div class="bar-track"><div class="bar-fill" style="width:'+Math.min(100,or)+'%;background:'+rc(or)+'"></div></div></div>'+
    '<div style="font-size:12px;color:#555;margin-top:8px;">年度預算：'+fmt(Math.round(ta))+'元｜累計動支：'+fmt(Math.round(tb))+'元</div>';
  var ch='';
  Object.keys(catM).sort().forEach(function(c){
    var r2=catM[c].ann>0?(catM[c].bal/catM[c].ann*100).toFixed(1):0;
    var cc=CAT_COLORS[c]||CAT_COLORS['其他'];
    ch+='<div class="bar-row"><div class="bar-label"><span style="color:'+cc.color+'">'+c+'</span><span style="color:'+rc(r2)+'">'+r2+'%</span></div>'+
        '<div style="font-size:11px;color:#888;margin-bottom:2px;">累計：'+fmt(Math.round(catM[c].bal))+'｜年度：'+fmt(Math.round(catM[c].ann))+'</div>'+
        '<div class="bar-track"><div class="bar-fill" style="width:'+Math.min(100,r2)+'%;background:'+cc.color+'"></div></div></div>';
  });
  document.getElementById('catSummary').innerHTML=ch;
  var uh='';
  Object.keys(unitM).sort().forEach(function(u){
    var r2=unitM[u].ann>0?(unitM[u].bal/unitM[u].ann*100).toFixed(1):0;
    var uc=getUC(u);
    uh+='<div class="bar-row"><div class="bar-label"><span style="color:'+uc+'">'+u+'</span><span style="color:'+rc(r2)+'">'+r2+'%</span></div>'+
        '<div class="bar-track"><div class="bar-fill" style="width:'+Math.min(100,r2)+'%;background:'+uc+'"></div></div></div>';
  });
  document.getElementById('unitSummary').innerHTML=uh;
}
(function(){
  var warns=RAW.filter(function(r){return(parseFloat(r['年度動支率'])||0)>=70;});
  warns.sort(function(a,b){return(parseFloat(b['年度動支率'])||0)-(parseFloat(a['年度動支率'])||0);});
  var h='';
  if(warns.length===0)h='<div style="text-align:center;color:#888;padding:40px;">✅ 目前無高用率項目</div>';
  warns.forEach(function(r){
    var yr=parseFloat(r['年度動支率'])||0;
    var uc=getUC(r['預算主管單位']);
    var ut=r['預算主管單位']?'<span style="background:'+uc+'1a;color:'+uc+';padding:2px 8px;border-radius:10px;font-size:11px;margin-left:6px;">'+r['預算主管單位']+'</span>':'';
    h+='<div class="warn-card'+(yr>=90?' red':'')+'">'+
      '<div style="display:flex;justify-content:space-between;align-items:center;">'+
        '<div><strong>'+r['明細帳']+'</strong>'+ut+'<br><span style="font-size:12px;color:#555;">'+r['會計項目']+'</span></div>'+
        '<div style="font-size:18px;font-weight:700;color:'+rc(yr)+'">'+yr+'%</div>'+
      '</div>'+
      '<div style="font-size:11px;color:#777;margin-top:6px;">年度預算：'+fmt(r['本年度預算'])+'｜剩餘：'+fmt(r['剩餘可動支數'])+'</div>'+
    '</div>';
  });
  document.getElementById('warningList').innerHTML=h;
})();
function renderCharts(){
  if(_chartsReady)return;
  _chartsReady=true;
  var root=document.getElementById('chartsRoot');
  var ta=0,tb=0,tr=0;
  RAW.forEach(function(r){ta+=parseFloat(r['本年度預算'])||0;tb+=parseFloat(r['本月餘額'])||0;tr+=parseFloat(r['剩餘可動支數'])||0;});
  var or=ta>0?(tb/ta*100).toFixed(1):0;
  var kpi=document.createElement('div');kpi.className='kpi-grid';
  kpi.innerHTML=
    '<div class="kpi-card"><div class="kpi-label">本年度預算</div><div class="kpi-value" style="color:#0d5c30">'+Math.round(ta/10000)+'</div><div class="kpi-unit">萬元</div></div>'+
    '<div class="kpi-card"><div class="kpi-label">累計動支</div><div class="kpi-value" style="color:#1565c0">'+Math.round(tb/10000)+'</div><div class="kpi-unit">萬元</div></div>'+
    '<div class="kpi-card full"><div class="kpi-label">整體動支率</div><div class="kpi-value" style="color:'+rc(or)+'">'+or+'%</div>'+
    '<div class="progress-bar" style="margin-top:8px;"><div class="progress-fill" style="width:'+Math.min(100,or)+'%;background:'+rc(or)+'"></div></div></div>';
  root.appendChild(kpi);
  var s=document.createElement('script');
  s.src='https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js';
  s.onload=function(){drawAllCharts(root);};
  document.head.appendChild(s);
}
function drawAllCharts(root){
  var catM={},unitM={};
  RAW.forEach(function(r){
    var a=parseFloat(r['本年度預算'])||0,b=parseFloat(r['本月餘額'])||0,rm=parseFloat(r['剩餘可動支數'])||0;
    if(!catM[r['費用分類']])catM[r['費用分類']]={ann:0,bal:0,rem:0};
    catM[r['費用分類']].ann+=a;catM[r['費用分類']].bal+=b;catM[r['費用分類']].rem+=rm;
    if(r['預算主管單位']){
      if(!unitM[r['預算主管單位']])unitM[r['預算主管單位']]={ann:0,bal:0};
      unitM[r['預算主管單位']].ann+=a;unitM[r['預算主管單位']].bal+=b;
    }
  });
  var catKeys=Object.keys(catM).sort();
  var unitKeys=Object.keys(unitM).sort(function(a,b){
    var ra=unitM[a].ann>0?unitM[a].bal/unitM[a].ann:0;
    var rb=unitM[b].ann>0?unitM[b].bal/unitM[b].ann:0;
    return rb-ra;
  });
  var CP=['#2e7d32','#1565c0','#e65100','#6a1b9a','#880e4f','#006064','#f57f17'];
  var d1=document.createElement('div');d1.className='chart-section';
  d1.innerHTML='<h3>🍩 費用分類預算分配</h3><div style="position:relative;height:260px;"><canvas id="c1"></canvas></div>';
  root.appendChild(d1);
  new Chart(document.getElementById('c1'),{type:'doughnut',data:{labels:catKeys,datasets:[{data:catKeys.map(function(c){return Math.round(catM[c].ann/10000);}),backgroundColor:CP,borderWidth:2,borderColor:'#fff'}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{font:{size:11},boxWidth:12}}}}});
  var d2=document.createElement('div');d2.className='chart-section';
  d2.innerHTML='<h3>📊 費用分類年度動支率</h3><div style="position:relative;height:260px;"><canvas id="c2"></canvas></div>';
  root.appendChild(d2);
  var cr=catKeys.map(function(c){return catM[c].ann>0?parseFloat((catM[c].bal/catM[c].ann*100).toFixed(1)):0;});
  new Chart(document.getElementById('c2'),{type:'bar',data:{labels:catKeys,datasets:[{label:'動支率%',data:cr,backgroundColor:cr.map(function(r2){return r2>=90?'#c62828':r2>=70?'#e07b00':'#2e7d32';}),borderRadius:4}]},options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{max:100,ticks:{callback:function(v){return v+'%';}}}}}});
  var uh=Math.max(280,unitKeys.length*26);
  var d3=document.createElement('div');d3.className='chart-section';
  d3.innerHTML='<h3>🏢 各科室年度動支率</h3><div style="position:relative;height:'+uh+'px;"><canvas id="c3"></canvas></div>';
  root.appendChild(d3);
  var ur=unitKeys.map(function(u){return unitM[u].ann>0?parseFloat((unitM[u].bal/unitM[u].ann*100).toFixed(1)):0;});
  new Chart(document.getElementById('c3'),{type:'bar',data:{labels:unitKeys,datasets:[{label:'動支率%',data:ur,backgroundColor:ur.map(function(r2){return r2>=90?'#c62828':r2>=70?'#e07b00':'#2e7d32';}),borderRadius:4}]},options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{max:100,ticks:{callback:function(v){return v+'%';}}}}}});
  var d4=document.createElement('div');d4.className='chart-section';
  d4.innerHTML='<h3>📦 費用分類：已動支 vs 剩餘可動支（萬元）</h3><div style="position:relative;height:260px;"><canvas id="c4"></canvas></div>';
  root.appendChild(d4);
  new Chart(document.getElementById('c4'),{type:'bar',data:{labels:catKeys,datasets:[{label:'累計動支',data:catKeys.map(function(c){return Math.round(catM[c].bal/10000);}),backgroundColor:'#1565c0',borderRadius:4},{label:'剩餘可動支',data:catKeys.map(function(c){return Math.max(0,Math.round(catM[c].rem/10000));}),backgroundColor:'#a5d6a7',borderRadius:4}]},options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{font:{size:11},boxWidth:12}}},scales:{x:{stacked:true,ticks:{callback:function(v){return v+'萬';}}},y:{stacked:true}}}});
}
render();
</script>
</body>
</html>
